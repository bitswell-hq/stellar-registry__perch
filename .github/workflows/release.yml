name: Release

# Two chained halves:
#
#   1. `detect-releases` — once CI passes on a push to main, tag any contract
#      whose crate manifest `version` has no matching `<contract>-v<version>`
#      tag yet (i.e. it was bumped in the merged PR). Releases are ON-CHAIN
#      wasm publishes, not crates.io, so this is pure git — NO release-plz /
#      `cargo package`, which couldn't resolve the workspace's git-only +
#      intra-workspace path deps against the crates.io index and also packaged
#      the immutable last-release tags as its diff baseline, wedging the
#      pipeline. To release a contract, bump its version in a PR.
#   2. The infra publishes (`publish-plan` → `constructorless-build` →
#      `constructorless-publish`) — a generic, contract-AGNOSTIC fan-out:
#      whichever infra contracts this run released (the ALLOW list in
#      publish-plan: perch-interpreter, perch-doc-compiler,
#      perch-ed25519-verifier, perch-spending-limit) are each built+attested
#      and published + `deploy_stateless`'d (content-addressed, salt =
#      wasm_hash) into unverified/perch/constructorless via the reusable
#      stellar-registry/actions workflows (contract-release →
#      registry-publish), authored by the perch-author-account smart account
#      and signed by the theahaco/stellar-cli fork (on-chain rule discovery —
#      no perch-deploy). No per-contract code — the set is data (see
#      publish-plan). That registry is perch's ONE canonical registry: an
#      account or factory bakes a single registry id and derives every infra
#      address as deployer(registry, sha256(wasm)), so every contract one
#      consumer resolves must live in the same registry. (The spending limit
#      used to have its own chain into unverified/perch/stateless; that
#      registry is retired and keeps only perch-spending-limit <= 0.1.1.)
#
# A third, off-chain leg — `npm-publish` — mirrors the same convention for
# the TypeScript packages: detect-releases also tags `<pkg>-v<version>` when a
# packages/<pkg> manifest version has no tag yet (perch-js →
# @stellar-registry/perch, perch-interpreter-js →
# @stellar-registry/perch-interpreter, perch-zk → @stellar-registry/perch-zk,
# perch-relay → @stellar-registry/perch-relay, perch-contracts →
# @stellar-registry/perch-contracts, perch-artifacts →
# @stellar-registry/perch-artifacts), and the npm-pack/npm-publish matrix jobs
# then publish each released package to npm by trusted publishing (OIDC, no
# token). A perch-artifacts release then runs notify-nido, which tells
# nidohq/nido about each deployment manifest it ships (nido-dispatch.yml).
#
# The recovery stack (verifiers, ZK pool and adapter, controller, account,
# factory) is deployed in pin order by scripts/deploy-stack.sh, which writes
# the deployment manifest (deployments/<network>.json) every consumer's
# build-time pins are fetched and verified from (scripts/fetch-infra-wasm.sh,
# docs/deploy/README.md). Its recovery-specific contracts are NOT in the
# publish-plan allow-list — the `deploy-stack` job below publishes them
# (authored by the same smart account, signed by the same delegate) and reuses
# the allow-listed tier-0 the constructorless jobs publish, because the account
# and factory must pin the EXACT on-chain tier-0 bytes and a rebuild would not
# reproduce them. That job is gated off (vars.PERCH_DEPLOY_STACK) until the
# manager bootstraps each recovery-stack name, so merging ships their source
# and version tracking without an on-chain publish before that is deliberate.
#
# Nothing here runs on a raw push: this workflow fires when the CI workflow
# completes, and the `ci-green` job lets the rest proceed only when CI passed
# on a push to main and that commit is still main's tip (the reusable build
# can only build the run's default-branch sha, so the tagged commit and the
# built commit must be the same). Every job checks out the commit CI tested
# (github.event.workflow_run.head_sha), never the default ref. A version bump
# that lands on a commit whose CI fails is therefore never tagged — tagging is
# the point of no return (detect-releases never re-tags a version) — and the
# bump stays pending in the manifests until a later commit passes CI as main's
# tip; that run tags and publishes it. The same holds for a commit main moved
# past before its CI finished.
#
# Mainnet is the exception: nothing above ever reaches it. Every testnet and
# npm job keeps running on a release merge as described here, and the
# `mainnet-*` jobs at the end of this file run ONLY when someone dispatches
# this workflow from main with a mainnet input (below). They publish a tag that
# was already released, and only after the `mainnet` environment's reviewer
# approves; a dispatch is a dry run unless `mainnet_dry_run` is cleared.
#
# All publish halves hang off `needs:` in the SAME run (gated on the
# detect-releases `releases` output) instead of a tag/release trigger, so they
# fire even though the tag was pushed with the default GITHUB_TOKEN — no GitHub
# App required. (This is why the old per-contract publish.yml, which needed the
# App token's tag push to retrigger, was folded in here and removed.)
#
# ONE-TIME BOOTSTRAP (manager-signed), once per NEW wasm name: the
# constructorless registry is MANAGED — while its manager is set, the INITIAL
# publish of a wasm name needs the manager's signature (registry error #12
# ManagerRequired otherwise); that first publish also binds the name's author
# for good (the registry has no author transfer), and every later version
# needs only the author's own authorization (the smart account's ci-publish
# rule). So before a contract newly added to ALLOW can publish, the manager
# publishes an earlier version of it with author = the perch-author smart
# account (vars.PERCH_AUTHOR_ADDRESS), using any wasm already uploaded to the
# network (e.g. the contract's previous release):
#
#   stellar contract invoke --id <constructorless registry> --network testnet \
#     --source-account <manager> -- publish_hash \
#     --wasm_name <name> --author <PERCH_AUTHOR_ADDRESS> \
#     --wasm_hash <uploaded hash> --version <earlier version>
#
# (Versions must be strictly increasing, so the bootstrap version must be
# below the first CI release.) If a release merges first, its publish leg
# fails with #12 and the tag stays: after the bootstrap, re-run it with the
# `publish_tag` dispatch input (detect-releases never re-tags a version).

on:
  # Release work starts only after CI finishes on main; ci-green checks the
  # conclusion. `branches` filters on the CI run's head branch, which a pull
  # request from a fork can also name `main`, so ci-green also requires a push
  # event from this repository: no run here executes code a fork controls.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Recovery path — PUBLISH-ONLY: re-run the on-chain half against the
  # existing, already-attested release asset for the tag (e.g. after a
  # transient RPC failure). It never rebuilds, so it doesn't matter how far
  # main has moved: integrity comes from `gh attestation verify` against the
  # pinned reusable signer workflow, not from git position. That check does
  # not yet bind the source ref or commit, so a dispatch publish also waits
  # for the `testnet` environment's required reviewer, and the release-tag
  # ruleset keeps a `perch-*-v*` tag from being moved or deleted
  # (docs/deploy/README.md "Release-path settings"). If the BUILD half
  # failed instead, use the failed run's native "Re-run failed jobs" (same
  # sha), after deleting the GitHub release if it got as far as creating one
  # (`gh release delete <tag>` — keep the tag).
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing tag of an ALLOW-listed contract to (re)publish to unverified/perch/constructorless, e.g. perch-spending-limit-v0.1.2"
        required: false
        type: string
      # The mainnet release (the `mainnet-*` jobs). Never set with
      # publish_tag: mainnet-plan refuses a dispatch that names both.
      mainnet_publish_tags:
        description: "Mainnet: released tags of ALLOW-listed contracts to publish to the mainnet registry, space-separated, e.g. perch-interpreter-v0.1.4 perch-doc-compiler-v0.3.3"
        required: false
        type: string
      mainnet_stack_tag:
        description: "Mainnet: released tag of a recovery-stack contract; the stack is built from its commit and deployed to the mainnet registry, e.g. perch-account-factory-v0.1.3"
        required: false
        type: string
      mainnet_dry_run:
        description: "Mainnet: simulate and print every transaction and its fee, submit nothing. Clear to publish."
        required: false
        default: true
        type: boolean

permissions: {}

# Dispatch recovery runs get their own group: the shared group has ONE pending
# slot, and a CI-gated run arriving while another one is active would silently
# cancel a queued dispatch (cancel-in-progress only protects the RUNNING run).
# A dispatch racing a CI-gated run is on-chain-safe: the fetch_hash preflight
# skips a same-hash republish and refuses a different-hash one, and
# deploy_stateless is idempotent. Mainnet dispatches share one group of their
# own, so two never sign with the mainnet delegate at once; every other run
# gets the group it always had.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag == '' && (inputs.mainnet_publish_tags != '' || inputs.mainnet_stack_tag != '') && 'release-mainnet' || (github.event_name == 'workflow_dispatch' && format('release-plz-dispatch-{0}', inputs.publish_tag) || 'release-plz') }}
  cancel-in-progress: false

jobs:
  # The gate every other job hangs off: CI concluded `success` on a push to
  # main of this repository, and the commit it tested is the sha this run was
  # given as the default-branch tip. When main moved on before CI finished,
  # the newer commit's own CI run does the release instead.
  ci-green:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      go: ${{ steps.tip.outputs.go }}
    steps:
      - name: Is the commit CI tested still main's tip?
        id: tip
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TIP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$HEAD_SHA" = "$TIP_SHA" ]; then
            echo "go=true" >>"$GITHUB_OUTPUT"
            echo "CI passed on $HEAD_SHA — releasing from it" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "go=false" >>"$GITHUB_OUTPUT"
            echo "CI passed on $HEAD_SHA, but main is now at $TIP_SHA — that commit's CI run releases any pending bump" >>"$GITHUB_STEP_SUMMARY"
          fi

  # Detect which contracts to release — WITHOUT release-plz or `cargo package`.
  # Perch never publishes to crates.io (releases are on-chain wasm publishes), so
  # release-plz's `cargo package --workspace` change-detection was a structural
  # mismatch: the workspace's git-only + intra-workspace path deps can't all
  # resolve on the crates.io index, and release-plz also packages the immutable
  # last-release tags as its diff baseline — commits whose manifests can't be
  # retroactively fixed — which permanently wedged the pipeline. Instead: a
  # contract is "released" when its crate manifest `version` has no matching
  # `<contract>-v<version>` tag yet (i.e. someone bumped it in a merged PR). Pure
  # git, no packaging. Emits the same `releases` shape the publish halves consume,
  # so everything downstream is unchanged.
  detect-releases:
    needs: ci-green
    if: needs.ci-green.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create + push the per-contract tags
    outputs:
      releases_created: ${{ steps.detect.outputs.releases_created }}
      releases: ${{ steps.detect.outputs.releases }}
      npm_released: ${{ steps.npm.outputs.npm_released }}
      npm_releases: ${{ steps.npm.outputs.npm_releases }}
      artifacts_tag: ${{ steps.npm.outputs.artifacts_tag }}
    steps:
      # Default token + persisted credentials are enough to push a tag. Tags
      # pushed with GITHUB_TOKEN do NOT retrigger workflows, but the publish
      # halves below run via `needs:` in THIS same run, so no retrigger (and no
      # GitHub App) is needed. The tags land on the commit CI tested.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # full tag history for the version-bump comparison
      - name: Detect released contracts (manifest version bumped past its tag)
        id: detect
        run: |
          set -euo pipefail
          # The release-tracked contracts. To release one, bump its `version` in
          # crates/<contract>/Cargo.toml in a PR; on merge this tags + publishes
          # it. The constructorless allow-list in publish-plan decides which of
          # these actually publish on-chain (the rest just get a tag).
          CONTRACTS="perch-interpreter perch-doc-compiler perch-ed25519-verifier perch-spending-limit perch-account perch-stateless-registry perch-recovery perch-webauthn-verifier perch-zk-pool perch-zk-adapter perch-account-factory"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          releases='[]'
          for c in $CONTRACTS; do
            ver=$(grep -m1 '^version = "' "crates/$c/Cargo.toml" | sed 's/^version = "\(.*\)"/\1/')
            tag="$c-v$ver"
            # Already released? (tag exists) — skip.
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then continue; fi
            # Guard against a downgrade: never tag a version <= the highest existing tag.
            last=$(git tag -l "$c-v*" | sed "s|^$c-v||" | sort -V | tail -1)
            if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$ver" "$last" | sort -V | tail -1)" != "$ver" ]; then
              echo "::warning::$c manifest version $ver is not greater than last tag $last — skipping"
              continue
            fi
            git tag "$tag"
            git push origin "$tag"
            releases=$(jq -c --arg p "$c" --arg t "$tag" --arg v "$ver" '. + [{package_name:$p, tag:$t, version:$v}]' <<<"$releases")
            echo "released $tag"
          done
          {
            echo "releases=$releases"
            n=$(jq length <<<"$releases")
            echo "releases_created=$([ "$n" -gt 0 ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Released this run"
            jq -r 'if length==0 then "_none — no contract version bumped_" else (.[] | "- \(.tag)") end' <<<"$releases"
          } >>"$GITHUB_STEP_SUMMARY"
      # Same convention for the npm packages: packages/<pkg> is "released"
      # when its manifest version has no <pkg>-v<version> tag yet. Feeds the
      # npm-publish matrix below (npm registry instead of on-chain wasm).
      # (perch-interpreter-js-v* never collides with the contract's
      # perch-interpreter-v* tags: the "-js-v"/"-v" suffixes differ.)
      - name: Detect released npm packages (manifest version bumped past its tag)
        id: npm
        run: |
          set -euo pipefail
          # Every package under packages/ (scripts/test-release-scripts.py
          # checks this list against the directory and against release-pr's).
          # A package added here with no tag yet publishes its manifest
          # version on the next merge, and that merge must touch
          # packages/<pkg>/: release-pr's git-cliff (--include-path) ignores a
          # tag on a commit outside the path, so it would never see the
          # release and would re-propose the package's whole history.
          NPM_PACKAGES="perch-js perch-interpreter-js perch-zk perch-relay perch-contracts perch-artifacts"
          npm_releases='[]'
          for p in $NPM_PACKAGES; do
            ver=$(jq -r .version "packages/$p/package.json")
            # Strict semver shape — the version flows into later `run:` shells.
            if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "unexpected $p version: '$ver'" >&2
              exit 1
            fi
            tag="$p-v$ver"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists — nothing to release"
              continue
            fi
            last=$(git tag -l "$p-v*" | sed "s|^$p-v||" | sort -V | tail -1)
            if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$ver" "$last" | sort -V | tail -1)" != "$ver" ]; then
              echo "::warning::$p manifest version $ver is not greater than last tag $last — skipping"
              continue
            fi
            git tag "$tag"
            git push origin "$tag"
            npm_releases=$(jq -c --arg p "$p" --arg t "$tag" --arg v "$ver" '. + [{package:$p, tag:$t, version:$v}]' <<<"$npm_releases")
            # notify-nido announces the deployment records this release ships.
            [ "$p" != perch-artifacts ] || echo "artifacts_tag=$tag" >>"$GITHUB_OUTPUT"
            echo "released $tag"
            echo "- $tag (npm)" >>"$GITHUB_STEP_SUMMARY"
          done
          {
            echo "npm_releases=$npm_releases"
            n=$(jq length <<<"$npm_releases")
            echo "npm_released=$([ "$n" -gt 0 ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"

  # Version bumps + changelogs — git-cliff driven, NO cargo package. Companion to
  # detect-releases (which tags on merge): once CI passes on main, this computes
  # each contract's next version from its conventional commits (scoped to its
  # crate tree + the intra-workspace libs it embeds), bumps the manifest,
  # regenerates crates/<c>/CHANGELOG.md, and opens/updates one "chore: release"
  # PR. Merging that PR bumps the versions on main, which detect-releases then
  # tags + publishes. This is release-plz's UX (auto semver bump + changelog +
  # release PR) rebuilt on git history, sidestepping the cargo-package wedge.
  # (The PR is opened with GITHUB_TOKEN, so its own CI checks don't run — the
  # bumps are mechanical; real CI ran on the feature PRs.)
  release-pr:
    needs: ci-green
    if: needs.ci-green.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # git-cliff needs full history + tags
      - name: Install git-cliff
        run: |
          mkdir -p "$RUNNER_TEMP/gc"
          curl -fsSL https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/gc.tar.gz"
          echo "bb40f68e752db1a32526c43e0108e8eff785f7c24c67024cffe1c316e034372975fd78c9af8e9a48148235aad15c9a103f1a5b490c282f1db09a7a793794b69f  $RUNNER_TEMP/gc.tar.gz" | sha512sum -c -
          tar -xz -C "$RUNNER_TEMP/gc" --strip-components=1 -f "$RUNNER_TEMP/gc.tar.gz"
      - name: Compute version bumps + changelogs
        id: prep
        run: |
          set -uo pipefail
          export PATH="$RUNNER_TEMP/gc:$PATH" # git-cliff, installed above
          # Each contract's changelog/version scope = its own crate tree + the
          # intra-workspace lib crates it embeds, so a lib change re-releases the
          # contract that ships it. Update these lists if a contract's perch deps
          # change: scripts/test-release-scripts.py (CI) fails when a list
          # misses a crate the contract links. A bare name is a crate under
          # crates/; an entry with a slash is a repo path (perch-zk-adapter
          # compiles in vendor/'s verifier).
          paths_for() { case "$1" in
            perch-interpreter) echo "perch-interpreter perch-program";;
            perch-doc-compiler) echo "perch-doc-compiler perch-compile perch-ir perch-program perch-recovery-interface";;
            # perch-smart-account depends on perch-recovery-interface (the
            # controller hook, account view, and pool insertion clients), so an
            # interface change re-releases the account too — see AGENTS.md's
            # version-pin sharp edge.
            perch-account) echo "perch-account perch-smart-account perch-doc-compiler perch-compile perch-ir perch-program perch-registry-resolve perch-registry-resolve-macro perch-recovery-interface";;
            perch-recovery) echo "perch-recovery perch-recovery-interface perch-doc-compiler perch-compile perch-ir perch-program";;
            perch-zk-pool) echo "perch-zk-pool perch-zk-primitives perch-recovery-interface";;
            # The verification key the adapter compiles in lives in its own
            # crate (vk/), so a circuit change re-releases it; so does a
            # change to the vendored verifier it links (a path with a `/` is
            # taken from the repository root).
            perch-zk-adapter) echo "perch-zk-adapter perch-zk-primitives perch-recovery-interface vendor/ultrahonk-soroban-verifier";;
            # The factory pins the account wasm and the WebAuthn verifier, so
            # a change to either is a new factory.
            perch-account-factory) echo "perch-account-factory perch-account perch-smart-account perch-doc-compiler perch-compile perch-ir perch-program perch-registry-resolve perch-registry-resolve-macro perch-recovery-interface perch-webauthn-verifier";;
            *) echo "$1";;
          esac; }
          CONTRACTS="perch-interpreter perch-doc-compiler perch-ed25519-verifier perch-spending-limit perch-account perch-stateless-registry perch-recovery perch-webauthn-verifier perch-zk-pool perch-zk-adapter perch-account-factory"
          # The committed build-time pins (crates/*/wasm/) move only after a
          # source change that already bumped the contract, in the
          # deploy(<network>) commit recording that deployment: never a
          # release of their own.
          pins=(--exclude-path "crates/*/wasm/**")
          summary=""
          bumped=""
          for c in $CONTRACTS; do
            inc=()
            for d in $(paths_for "$c"); do
              case "$d" in
                */*) inc+=(--include-path "$d/**");;
                *) inc+=(--include-path "crates/$d/**");;
              esac
            done
            # Build inputs no crate tree holds (the locked external packages
            # the contract links, the workspace pins it inherits, the release
            # profile, the toolchain) change its wasm without touching a scoped
            # path, often in a chore(deps) commit cliff.toml skips: each change
            # since its last tag counts as one fix(deps) commit, so a re-pin
            # of the OZ fork or soroban-sdk re-releases every contract linking
            # it. A release commit's own version bumps are not such a change.
            deps_out=$(python3 scripts/release-deps.py cliff-args "$c") || { echo "::error::scripts/release-deps.py failed for $c"; exit 1; }
            deps=()
            [ -z "$deps_out" ] || mapfile -t deps <<<"$deps_out"
            # feat -> minor, fix -> patch; pre-1.0 breaking stays minor (cliff.toml).
            # Returns the crate's current version when nothing is releasable.
            next_tag=$(git cliff --config cliff.toml --tag-pattern "$c-v.*" "${inc[@]}" "${pins[@]}" "${deps[@]}" --bumped-version 2>/dev/null) || true
            next_ver=${next_tag#"$c"-v}
            cur=$(grep -m1 '^version = "' "crates/$c/Cargo.toml" | sed 's/^version = "\(.*\)"/\1/')
            [ -n "$next_ver" ] || continue
            [ "$next_ver" != "$cur" ] || continue
            # Only a strict increase (guards the race where detect-releases has
            # already tagged this version on the release-PR merge push).
            [ "$(printf '%s\n%s\n' "$cur" "$next_ver" | sort -V | tail -1)" = "$next_ver" ] || continue
            sed -i "s|^version = \"[^\"]*\"|version = \"$next_ver\"|" "crates/$c/Cargo.toml"
            git cliff --config cliff.toml --tag-pattern "$c-v.*" "${inc[@]}" "${pins[@]}" "${deps[@]}" --bump -o "crates/$c/CHANGELOG.md" 2>/dev/null
            summary="${summary}- \`$c\`: $cur -> $next_ver"$'\n'
            echo "bump $c: $cur -> $next_ver"
            bumped="${bumped}$c=$next_ver"$'\n'
          done
          # Sync every intra-workspace path-dependency pin to the version its
          # target crate just moved to. Without this, a 0.x MINOR bump here
          # (breaking, under Cargo's caret rules) leaves a dependent's pin
          # stale and `cargo metadata` fails workspace-wide the next time
          # anything touches that dependent — see AGENTS.md's version-pin
          # sharp edge (this used to be a manual "grep and bump every match"
          # step, which is exactly how that failure mode happened before).
          if [ -n "$bumped" ]; then
            while IFS='=' read -r name ver; do
              [ -n "$name" ] || continue
              for f in crates/*/Cargo.toml; do
                grep -qE "^${name} = \{ version = \"[^\"]*\", path = " "$f" || continue
                sed -i -E "s|^(${name} = \{ version = \")[^\"]*(\", path = )|\1${ver}\2|" "$f"
                echo "synced pin: $f -> $name $ver"
              done
            done <<<"$bumped"
            # Carry the new member versions into Cargo.lock in the same
            # commit. A lock left at the old versions is rewritten by the
            # next cargo build, which dirties every checkout of the release
            # (nido's vendor/perch drift check fails on it) and fails CI's
            # `--locked` gate. `--workspace` touches only workspace members;
            # the guard below fails the job if anything else moved.
            cargo update --workspace || { echo "::error::cargo update --workspace failed"; exit 1; }
            if git diff -U0 Cargo.lock | grep -E '^[-+]' | grep -vE '^(---|\+\+\+) ' | grep -vqE '^[-+]version = "'; then
              echo "::error::refreshing Cargo.lock changed more than workspace member versions"
              git diff Cargo.lock
              exit 1
            fi
            cargo metadata --locked --format-version 1 >/dev/null || { echo "::error::Cargo.lock still stale after the refresh"; exit 1; }
          fi
          # The npm packages ride the same convention: tag-pattern <pkg>-v*,
          # scoped to packages/<pkg> plus the repository files the package
          # ships (scripts/npm-release.sh, which deploy-stack also runs to
          # bump perch-artifacts in the deploy(<network>) PR).
          NPM_PACKAGES="perch-js perch-interpreter-js perch-zk perch-relay perch-contracts perch-artifacts"
          for p in $NPM_PACKAGES; do
            out=$(scripts/npm-release.sh bump "$p") || { echo "::error::scripts/npm-release.sh failed for $p"; exit 1; }
            [ -n "$out" ] || continue
            read -r cur next_ver <<<"$out"
            summary="${summary}- \`$p\` (npm \`$(jq -r .name "packages/$p/package.json")\`): $cur -> $next_ver"$'\n'
            echo "bump $p: $cur -> $next_ver"
          done
          if [ -n "$summary" ]; then echo "any=true" >>"$GITHUB_OUTPUT"; else echo "any=false" >>"$GITHUB_OUTPUT"; fi
          {
            echo "body<<__RPBODY__"
            echo "Automated by the \`release-pr\` job (git-cliff) — version bumps + changelogs, no cargo package."
            echo ""
            echo "### Contracts to release"
            printf "%s" "${summary:-_none_}"
            echo ""
            echo ""
            echo "Merging bumps the versions on main; \`detect-releases\` then tags and publishes them."
            echo "__RPBODY__"
          } >>"$GITHUB_OUTPUT"
      - name: Open / update the release PR
        if: steps.prep.outputs.any == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # The checkout is a detached commit, so the PR's base must be named.
          base: main
          branch: release/next
          delete-branch: true
          title: "chore: release"
          commit-message: "chore: release — version bumps + changelogs"
          body: ${{ steps.prep.outputs.body }}
      - name: Close the release PR when nothing is pending
        if: steps.prep.outputs.any != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head release/next --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$pr" ]; then gh pr close "$pr" --delete-branch --comment "No releasable changes remain." || true; fi

  # npm mirror of the on-chain publish chains: when detect-releases tags
  # <pkg>-v* (a packages/<pkg> manifest version was bumped in a merged PR),
  # publish that package to the npm registry — one matrix leg per released
  # package. Same release convention as the contracts — bump the version in a
  # PR to release; the release-pr job proposes that bump from conventional
  # commits.
  #
  # Two jobs, so nothing that runs the package's dependencies or its own
  # scripts can mint a publish credential. npm-pack installs, checks, tests,
  # and packs with no `id-token` and no secret; npm-publish holds `id-token:
  # write` and only publishes the packed tarball, with lifecycle scripts off.
  # The publish authenticates by npm trusted publishing (OIDC): there is no
  # npm token anywhere, and each package's trusted-publisher entry names this
  # workflow file and the `npm` environment, so a job outside that environment
  # cannot publish (docs/deploy/README.md "Release-path settings"). A failed
  # publish can be re-run: the tag and the CI-tested head sha are unchanged on
  # a re-run, so it publishes exactly the tagged commit.
  npm-pack:
    needs: [ci-green, detect-releases]
    if: >-
      !cancelled() && needs.ci-green.outputs.go == 'true' &&
      needs.detect-releases.outputs.npm_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the tested commit
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect-releases.outputs.npm_releases) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.release.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # No dependency cache in a release job (zizmor cache-poisoning: nothing a
      # cache write could later inject into a published package).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      # prepack builds dist/ into the tarball; publishConfig pins
      # access=public for the scope. `npm publish` of a directory records the
      # commit as the registry's gitHead, but a tarball publish takes the
      # manifest as packed, so the commit goes into it here
      # (scripts/nido-dispatch-plan.sh checks it against the release tag).
      - name: Pack
        run: |
          set -euo pipefail
          npm pkg set gitHead="$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-${{ matrix.release.package }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  npm-publish:
    needs: [ci-green, detect-releases, npm-pack]
    if: >-
      !cancelled() && needs.ci-green.outputs.go == 'true' &&
      needs.detect-releases.outputs.npm_released == 'true' &&
      needs.npm-pack.result == 'success'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect-releases.outputs.npm_releases) }}
    steps:
      # Trusted publishing needs npm 11.5.1 or later; Node 24 bundles it. No
      # registry-url: npm's default registry is the one the OIDC exchange
      # targets, and no .npmrc token placeholder is wanted.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-${{ matrix.release.package }}
          path: pack
      - name: Publish the packed tarball
        env:
          PACKAGE: ${{ matrix.release.package }}
          VERSION: ${{ matrix.release.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          npm_version=$(npm --version)
          if [ "$(printf '%s\n%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version cannot use trusted publishing (needs 11.5.1 or later)"
            exit 1
          fi
          shopt -s nullglob
          tarballs=(pack/*.tgz)
          [ "${#tarballs[@]}" -eq 1 ] || { echo "::error::expected one tarball for $PACKAGE, found ${#tarballs[@]}"; exit 1; }
          tgz="${tarballs[0]}"
          # The tarball must be the version detect-releases tagged, packed
          # from the commit it tagged.
          manifest=$(tar -xzOf "$tgz" package/package.json)
          packed=$(jq -r .version <<<"$manifest")
          [ "$packed" = "$VERSION" ] || { echo "::error::$tgz is version $packed, the tag is $VERSION"; exit 1; }
          head=$(jq -r '.gitHead // ""' <<<"$manifest")
          [ "$head" = "$HEAD_SHA" ] || { echo "::error::$tgz was packed from '$head', the tag is on $HEAD_SHA"; exit 1; }
          npm publish "$tgz" --provenance --ignore-scripts

  # Tell nidohq/nido about each deployment record this run's
  # @stellar-registry/perch-artifacts release ships (nido-dispatch.yml). It
  # runs only after npm-publish, so the package version the dispatch names
  # already carries the manifest; nido-dispatch.yml checks that on the
  # registry before sending. `!cancelled()` lets another package's failed leg
  # pass: the registry check is what gates the send.
  notify-nido:
    needs: [ci-green, detect-releases, npm-publish]
    if: >-
      !cancelled() && needs.ci-green.outputs.go == 'true' &&
      needs.detect-releases.outputs.artifacts_tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/nido-dispatch.yml
    with:
      tag: ${{ needs.detect-releases.outputs.artifacts_tag }}

  # ── Constructorless contract publishes ────────────────────────────────────
  # The generic, contract-agnostic half: any released infra contract in the
  # ALLOW list (the reusable infra wasms authored by the perch-author-account
  # smart account) is published to unverified/perch/constructorless, perch's
  # one canonical registry (see the header). There is no per-contract workflow
  # code — the set is data (the ALLOW list below, kept in step with the
  # detect-releases CONTRACTS list), and everything else (wasm path, registry
  # name, version) derives from the release tag. Adding a contract is a
  # one-line edit here + a detect-releases CONTRACTS entry + the manager's
  # one-time initial publish of its name (the bootstrap note at the top).
  #
  # This hangs off detect-releases's `releases` output in the SAME run, not a
  # tag/release trigger — so it fires even though tags are pushed with the
  # default GITHUB_TOKEN (no GitHub App required).

  # Which constructorless contracts did THIS run release (or was one passed by
  # hand)? Emit the publish matrix; empty ⇒ publish-constructorless skips.
  publish-plan:
    needs: [ci-green, detect-releases]
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '') ||
        (needs.ci-green.outputs.go == 'true' && needs.detect-releases.outputs.releases_created == 'true')
      )
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    env:
      RELEASES: ${{ needs.detect-releases.outputs.releases }}
      DISPATCH_TAG: ${{ inputs.publish_tag }}
    steps:
      - name: Build the publish matrix
        id: plan
        run: |
          # The canonical infra set. Keep in step with the detect-releases
          # CONTRACTS list. A contract not listed here is tagged but never
          # published to the constructorless registry. Each name needs the
          # manager's one-time initial publish there (the bootstrap note at the
          # top) before its first CI publish can succeed.
          # The recovery stack (perch-recovery, perch-zk-pool,
          # perch-zk-adapter, perch-webauthn-verifier, perch-account-factory)
          # is deliberately NOT in this allow-list: it is tagged/versioned
          # (CONTRACTS above) so its intra-workspace pins stay tracked, but it
          # is a build-time pin chain, not a contract-agnostic matrix. The
          # `deploy-stack` job below publishes it to the canonical registry in
          # pin order (reusing these allow-listed tier-0 bytes for the account's
          # pins) and records the deployment manifest. That job stays gated off
          # until the manager's one-time initial publish of each new name.
          ALLOW='["perch-interpreter","perch-doc-compiler","perch-ed25519-verifier","perch-spending-limit"]'
          if [ -n "$DISPATCH_TAG" ]; then
            # Strict allow-list regex, not a prefix glob: the tag and the package
            # parsed from it flow into later `run:` shells and perch-deploy args,
            # so anything beyond exact <pkg>-v<semver> shape is rejected.
            if [[ "$DISPATCH_TAG" =~ ^(perch-interpreter|perch-doc-compiler|perch-ed25519-verifier|perch-spending-limit)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              matrix=$(jq -cn \
                --arg p "${BASH_REMATCH[1]}" --arg t "$DISPATCH_TAG" --arg v "${BASH_REMATCH[2]}" \
                '[{package: $p, tag: $t, version: $v}]')
            else
              echo "publish_tag '$DISPATCH_TAG' is not the tag of an ALLOW-listed contract" >&2
              exit 1
            fi
          else
            # releases is [{package_name, tag, version}, …]; keep the allowed set.
            matrix=$(jq -c --argjson allow "$ALLOW" \
              '[.[] | select(.package_name as $p | $allow | index($p)) | {package: .package_name, tag: .tag, version: .version}]' \
              <<<"$RELEASES")
          fi
          n=$(jq length <<<"$matrix")
          {
            echo "matrix={\"include\":$matrix}"
            echo "any=$([ "$n" -gt 0 ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "no constructorless contracts released this run — nothing to publish"
          else
            echo "publishing: $(jq -r '[.[].tag] | join(", ")' <<<"$matrix")"
          fi

  # Build + attest each released constructorless contract, then publish it to
  # unverified/perch/constructorless — both via the reusable stellar-registry/
  # actions workflows. The publish is authored by the perch-author-account smart
  # account and signed by the CAP-71 delegate CI key (perch-ci); the reusable
  # registry-publish installs the theahaco/stellar-cli fork, which signs
  # smart-account auth by discovering the account's context rule on-chain — no
  # perch-deploy shim, no smart-account flags.

  # Attested build (scaffold build + optimize + GitHub release + provenance).
  # CI-gated runs only: the reusable workflow has no ref input and builds this
  # run's github.sha, which ci-green requires to equal the CI-tested head sha
  # detect-releases tagged; a dispatch republishes the existing asset.
  constructorless-build:
    needs: [ci-green, publish-plan]
    if: >-
      !cancelled() && needs.ci-green.outputs.go == 'true' &&
      needs.publish-plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publish-plan.outputs.matrix) }}
    permissions:
      id-token: write
      contents: write
      attestations: write
    # FOLLOW-UP (stellar-registry/actions): once that repository's main gains
    # inputs for checksumming the stellar-cli fork and scaffold and for binding
    # `gh attestation verify` to the source ref, source commit, and signer
    # commit, re-pin both reusable workflows to that merged commit and pass
    # them (docs/deploy/README.md "Follow-up: reusable-workflow integrity
    # inputs"). Never pin an unmerged commit.
    uses: stellar-registry/actions/.github/workflows/contract-release.yml@57bfdf4b96279a28961cb76a48ec4204300b5818 # main 2026-10-14
    with:
      package: ${{ matrix.package }}
      release_name: ${{ matrix.tag }}
      release_description: >-
        Attested build of ${{ matrix.package }}, published content-addressed to
        the perch constructorless registry (see the attached publish receipt).
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  # On-chain publish via the reusable registry-publish (upload + smart-account-
  # signed publish_hash + deploy_stateless), authored by the SA. On a CI-gated
  # run it consumes the freshly attested asset; on dispatch it republishes the
  # existing one (build is skipped by design).
  constructorless-publish:
    needs: [ci-green, publish-plan, constructorless-build]
    if: >-
      !cancelled() && needs.publish-plan.outputs.any == 'true' && (
        (needs.ci-green.outputs.go == 'true' &&
         needs.constructorless-build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
         needs.constructorless-build.result == 'skipped')
      )
    strategy:
      fail-fast: false
      # One leg at a time: every publish signs with the same CI key, so parallel
      # legs would collide on its source-account sequence number.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.publish-plan.outputs.matrix) }}
    permissions:
      contents: write
      id-token: write # gh attestation verify
    # FOLLOW-UP: see constructorless-build; this pin moves with that one.
    uses: stellar-registry/actions/.github/workflows/registry-publish.yml@57bfdf4b96279a28961cb76a48ec4204300b5818 # main 2026-10-14
    with:
      # The constructorless subregistry (unverified/perch/constructorless) id and
      # the perch-author-account smart account (C…). Repo/testnet vars.
      registry: ${{ vars.PERCH_REGISTRY_CONTRACT_ID }}
      author: ${{ vars.PERCH_AUTHOR_ADDRESS }}
      wasm_name: ${{ matrix.package }}
      version: ${{ matrix.version }}
      release_tag: ${{ matrix.tag }}
      wasm_asset: ${{ matrix.package }}_v${{ matrix.version }}.wasm
      network: testnet
      # registry-publish runs its signing job in this environment (main-only,
      # with a required reviewer: docs/deploy/README.md "Release-path
      # settings"), so a dispatch republish waits for that approval too.
      environment: testnet
    secrets:
      # perch-ci: the account's ci-publish delegate (also the fee source). The
      # reference is resolved for registry-publish's job, which runs in the
      # `testnet` environment, so it reads that environment's copy once the
      # repository-level copy is gone. If it resolves to nothing,
      # registry-publish refuses an empty key before touching the network
      # (docs/deploy/README.md "Release-path settings" has the check).
      signing_key: ${{ secrets.CI_PUBLISH_SECRET_KEY }}
      release_token: ${{ secrets.GITHUB_TOKEN }}

  # ── Recovery-stack deploy ─────────────────────────────────────────────────
  # The recovery stack is a build-time pin chain (docs/deploy/README.md), so it
  # cannot be a contract-agnostic matrix like the constructorless publishes: the
  # account and factory must be built against the EXACT tier-0 bytes on-chain,
  # in pin order, and published in that order. scripts/deploy-stack.sh does this;
  # this job runs its canonical, smart-account-authored mode.
  #
  # The account pins the compiler/interpreter/spending-limit. Those (and the
  # ed25519 verifier) are the ALLOW-listed tier-0 the constructorless jobs above
  # already published; a rebuild here would not reproduce their bytes (scaffold
  # vs scaffold+optimize, unpinned rustc in the reusable build — see
  # docs/deploy/README.md and design step 7), so the account would pin a hash
  # the registry never deploy_stateless'd. The deploy therefore REUSES those
  # published bytes (fetched by hash) and publishes only the recovery-specific
  # names (webauthn verifier, ZK pool/adapter, controller) and the factory,
  # authored by the perch-author smart account and signed by the CI delegate
  # through the theahaco/stellar-cli fork — the same authority as the
  # constructorless publishes.

  # Did THIS run release a recovery-stack contract (the ones deploy-stack
  # deploys)? Empty ⇒ deploy-stack skips.
  deploy-plan:
    needs: [ci-green, detect-releases]
    if: >-
      !cancelled() && needs.ci-green.outputs.go == 'true' &&
      needs.detect-releases.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      any: ${{ steps.plan.outputs.any }}
    env:
      RELEASES: ${{ needs.detect-releases.outputs.releases }}
    steps:
      - name: Any recovery-stack contract released?
        id: plan
        run: |
          set -euo pipefail
          # What deploy-stack deploys: the recovery-specific tier-0 (webauthn
          # verifier, ZK pool/adapter, controller), the account, and the
          # factory. The allow-list tier-0 (doc-compiler, interpreter,
          # spending-limit, ed25519) are published by the constructorless jobs
          # and REUSED by the deploy, not deployed here. A change to a reused
          # tier-0 re-releases the account/factory (release-pr's paths_for
          # cascade), so it still lands in this set.
          DEPLOY_SET="perch-webauthn-verifier perch-recovery perch-zk-pool perch-zk-adapter perch-account perch-account-factory"
          any=false
          for c in $DEPLOY_SET; do
            if jq -e --arg c "$c" 'any(.[]; .package_name == $c)' <<<"$RELEASES" >/dev/null; then
              any=true; break
            fi
          done
          echo "any=$any" >>"$GITHUB_OUTPUT"
          if [ "$any" = true ]; then
            echo "recovery-stack contract(s) released — deploy-stack will run" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "no recovery-stack contract released — deploy-stack skips" >>"$GITHUB_STEP_SUMMARY"
          fi

  # Deploy the recovery stack to the canonical registry, SA-authored, in pin
  # order, and open a deploy(<network>) PR with the manifest + regenerated
  # bindings a human merges.
  #
  # Three jobs, so the CI publish seed never shares a runner with a build:
  #
  #   deploy-stack-build   `deploy-stack.sh --build-only`: fetch the reused
  #                        tier-0, compile the stack (crates.io build scripts
  #                        and proc macros run here), compute the content
  #                        addresses. No environment, no secret.
  #   deploy-stack         `deploy-stack.sh --prebuilt`: upload, publish, and
  #                        write the manifest from that output. The only job
  #                        holding the seed; it compiles and runs no Rust.
  #   deploy-stack-record  attest the built wasm, verify the deployment,
  #                        regenerate the bindings, bump perch-artifacts, open
  #                        the PR. No secret.
  #
  # A step boundary would not be enough: a build script can write anywhere the
  # runner user can (with sudo), including the `stellar` a later step runs.
  #
  # deploy-stack runs in the `testnet` GitHub Environment (main-only, required
  # reviewer), so CI_PUBLISH_SECRET_KEY is the environment's secret. A mainnet
  # deploy belongs in its own job under the `mainnet` environment (required
  # reviewer, `main`-only branch policy) signing with its own delegate secret,
  # CI_PUBLISH_MAINNET_SECRET_KEY, never this one. A job `if:` is evaluated
  # before the environment is entered, so vars.PERCH_DEPLOY_STACK must stay a
  # repository variable.
  #
  # Gated to run only when vars.PERCH_DEPLOY_STACK == 'true'. The recovery-stack
  # names are NOT yet in the canonical registry, and a managed registry refuses
  # a new name without the manager's one-time initial publish (#12
  # ManagerRequired). Until the manager bootstraps each name (docs/deploy/
  # README.md "The testnet registry") and sets that variable, these jobs are
  # skipped rather than failing every release — the same deliberate-decision
  # split the publish-plan ALLOW list uses for shipping a contract's source
  # before its first on-chain publish.
  deploy-stack-build:
    needs: [ci-green, detect-releases, deploy-plan, constructorless-publish]
    if: >-
      !cancelled() && needs.ci-green.outputs.go == 'true' &&
      needs.deploy-plan.outputs.any == 'true' &&
      vars.PERCH_DEPLOY_STACK == 'true' &&
      (needs.constructorless-publish.result == 'success' ||
       needs.constructorless-publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the tested commit
    env:
      STELLAR_NETWORK: testnet
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      # The ALLOW-listed tier-0 to reuse (published by the constructorless jobs,
      # not rebuilt here). Kept in step with publish-plan's ALLOW list.
      REUSE: "perch-doc-compiler perch-interpreter perch-spending-limit perch-ed25519-verifier"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32v1-none
      # No dependency cache: these bytes are published and pinned on-chain, so
      # nothing a poisoned cache could inject may reach the build.
      - uses: ./.github/actions/setup-stellar-fork
        with:
          scaffold: "true"
      - name: Build the stack against the canonical registry (no key)
        env:
          REGISTRY: ${{ vars.PERCH_REGISTRY_CONTRACT_ID }}
        run: |
          set -euo pipefail
          scripts/deploy-stack.sh --build-only --registry "$REGISTRY" --reuse "$REUSE"
      # The stack (wasm, build.json, addresses.json) and the consumer pins
      # build-stack.sh staged, which the deploy PR commits.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-stack-build
          path: |
            target/stack
            crates/perch-smart-account/wasm
            crates/perch-account-factory/wasm
          if-no-files-found: error
          retention-days: 7

  deploy-stack:
    needs: [ci-green, deploy-stack-build]
    if: >-
      !cancelled() && needs.ci-green.outputs.go == 'true' &&
      needs.deploy-stack-build.result == 'success'
    runs-on: ubuntu-latest
    environment: testnet
    permissions:
      contents: read # check out the tested commit
    env:
      STELLAR_NETWORK: testnet
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      REUSE: "perch-doc-compiler perch-interpreter perch-spending-limit perch-ed25519-verifier"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-stellar-fork
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deploy-stack-build
          path: .
      - name: Publish the prebuilt stack (smart-account-authored, reusing the published tier-0)
        # Secrets go through the environment, never argv: STELLAR_ACCOUNT is the
        # source/fee delegate and STELLAR_SIGN_WITH_KEY signs the account's
        # publish_hash authorization (the fork discovers its context rule). The
        # author is the perch-author smart account; the registry is canonical.
        # --prebuilt compiles nothing and runs only `stellar`, `jq`, and `curl`.
        env:
          STELLAR_ACCOUNT: ${{ secrets.CI_PUBLISH_SECRET_KEY }}
          STELLAR_SIGN_WITH_KEY: ${{ secrets.CI_PUBLISH_SECRET_KEY }}
          REGISTRY: ${{ vars.PERCH_REGISTRY_CONTRACT_ID }}
          AUTHOR: ${{ vars.PERCH_AUTHOR_ADDRESS }}
        run: |
          set -euo pipefail
          scripts/deploy-stack.sh --prebuilt --registry "$REGISTRY" --author "$AUTHOR" --reuse "$REUSE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-stack-manifest
          path: deployments/testnet.json
          if-no-files-found: error
          retention-days: 7

  deploy-stack-record:
    needs: [ci-green, deploy-stack]
    if: >-
      !cancelled() && needs.ci-green.outputs.go == 'true' &&
      needs.deploy-stack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the manifest + bindings onto the deploy branch
      pull-requests: write # open the deploy(<network>) PR
      id-token: write # build-provenance attestation
      attestations: write
    env:
      STELLAR_NETWORK: testnet
      REUSE: "perch-doc-compiler perch-interpreter perch-spending-limit perch-ed25519-verifier"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0 # git-cliff needs full history + tags (perch-artifacts bump)
      # First, so a failed install fails before anything is attested. The
      # deployment is already on-chain by now; this job's inputs are this
      # run's artifacts, so a failure here is recovered by re-running it.
      - name: Install git-cliff (bumps perch-artifacts below)
        run: |
          mkdir -p "$RUNNER_TEMP/gc"
          curl -fsSL https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/gc.tar.gz"
          echo "bb40f68e752db1a32526c43e0108e8eff785f7c24c67024cffe1c316e034372975fd78c9af8e9a48148235aad15c9a103f1a5b490c282f1db09a7a793794b69f  $RUNNER_TEMP/gc.tar.gz" | sha512sum -c -
          tar -xz -C "$RUNNER_TEMP/gc" --strip-components=1 -f "$RUNNER_TEMP/gc.tar.gz"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deploy-stack-build
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deploy-stack-manifest
          path: deployments
      - name: Collect the freshly built wasm (not the reused tier-0) to attest
        id: built
        run: |
          set -euo pipefail
          paths=""
          for pkg in $(jq -r '.artifacts[].package' target/stack/build.json); do
            case " $REUSE " in *" $pkg "*) continue ;; esac
            paths="${paths}target/stack/${pkg//-/_}.wasm"$'\n'
          done
          {
            echo "paths<<EOF"
            printf '%s' "$paths"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      # Attest before anything in this job compiles or runs repository code.
      - name: Attest build provenance for each deployed wasm
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.built.outputs.paths }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-stellar-fork
      - name: Verify the deployment against the chain
        run: scripts/verify-deployment.sh --manifest deployments/testnet.json
      - name: Regenerate the deployment bindings (@stellar-registry/perch-contracts)
        run: scripts/bindings-contracts.sh
      # @stellar-registry/perch-artifacts ships deployments/, so the PR that
      # records a deployment also releases it: merging the PR tags and
      # publishes that version (detect-releases, npm-publish), then
      # notify-nido tells Nido, naming it. The bump is release-pr's own
      # (scripts/npm-release.sh), computed with the deploy commit in the
      # history: commit the record locally, bump, then uncommit it all so the
      # PR step below makes the one deploy(testnet) commit.
      - name: Bump @stellar-registry/perch-artifacts for the new deployment record
        env:
          MESSAGE: "deploy(testnet): recovery stack @ ${{ github.event.workflow_run.head_sha }}"
          MANIFEST: deployments/testnet.json
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/gc:$PATH" # git-cliff, installed above
          git add -- "$MANIFEST"
          if git diff --cached --quiet -- "$MANIFEST"; then
            git reset -q
            echo "$MANIFEST is unchanged — no perch-artifacts release" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "$MESSAGE"
          out=$(scripts/npm-release.sh bump perch-artifacts)
          git reset -q --soft HEAD~1
          git reset -q
          # The deployment is already on-chain, so its record PR still opens;
          # the next release PR then proposes the bump, and Nido hears of this
          # record when that release publishes.
          if [ -z "$out" ]; then
            echo "::warning::$MANIFEST changed but scripts/npm-release.sh proposed no perch-artifacts bump; the release PR will"
            exit 0
          fi
          read -r cur next <<<"$out"
          echo "\`@stellar-registry/perch-artifacts\`: $cur -> $next" >>"$GITHUB_STEP_SUMMARY"
      - name: Open the deploy(testnet) manifest PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # The checkout is a detached commit, so the PR's base must be named.
          base: main
          branch: deploy/testnet
          delete-branch: true
          title: "deploy(testnet): recovery stack"
          commit-message: "deploy(testnet): recovery stack @ ${{ github.event.workflow_run.head_sha }}"
          add-paths: |
            deployments/testnet.json
            crates/perch-smart-account/wasm
            crates/perch-account-factory/wasm
            packages/perch-contracts/src
            packages/perch-artifacts/package.json
            packages/perch-artifacts/package-lock.json
            packages/perch-artifacts/CHANGELOG.md
          body: >
            Automated by the `deploy-stack` jobs: the recovery stack deployed to
            the canonical `constructorless` registry, smart-account-authored, in
            pin order, from the tagged `main` commit
            ${{ github.event.workflow_run.head_sha }} (always in `main`'s
            history, so this record survives any merge method). Merging
            updates `deployments/testnet.json`, the account's and factory's
            committed build-time pins, and the regenerated
            `@stellar-registry/perch-contracts` bindings, which flips consumers —
            and CI's deployed-bytes checks — onto this deployment. It also
            bumps `@stellar-registry/perch-artifacts` (version and changelog,
            from the release tooling), so the merge publishes a package
            carrying this manifest before Nido is notified.

  # ── Mainnet release (manual dispatch only) ────────────────────────────────
  # Nothing in a release merge reaches mainnet. These jobs run only on a
  # workflow_dispatch from main that names mainnet_publish_tags and/or
  # mainnet_stack_tag; none of them hangs off ci-green or detect-releases.
  # They publish tags that already exist on main, as the bytes those tags
  # were released as:
  #
  #   mainnet-publish        each ALLOW-listed tag's attested release asset
  #                          (the contract-release build), checked against its
  #                          attestation for the tag's commit, then uploaded,
  #                          publish_hash'd, and deploy_stateless'd.
  #   mainnet-deploy-stack-* the recovery stack, rebuilt from the stack tag's
  #                          commit with the toolchain the testnet deployment
  #                          from that commit recorded. Each rebuilt tier-0 must
  #                          be the hash that deployment recorded and attested,
  #                          or the build refuses. The account and the factory
  #                          pin the mainnet registry, so they are new bytes,
  #                          built against the mainnet tier-0 and attested by
  #                          the record job.
  #
  # Every job that reads a mainnet setting or the mainnet delegate runs in the
  # `mainnet` environment (required reviewer, main-only) and reads only that
  # environment's CI_PUBLISH_MAINNET_SECRET_KEY and PERCH_MAINNET_* variables,
  # which have no defaults (scripts/mainnet-settings.sh checks them on-chain).
  # The build jobs get the settings as mainnet-config's outputs, so no job
  # that compiles is bound to the environment. The registry path is a
  # setting: on mainnet perch's registries sit directly under the Stellar
  # Registry root (perch/constructorless), not under unverified/.
  #
  # mainnet_dry_run (the default) runs every check, then simulates each
  # transaction a real run would send and prints it with its fee; nothing is
  # submitted and no PR opens. A combined dry run (publish tags and a stack tag
  # together) stops the stack at its build, which reuses the tier-0 the publish
  # has not yet put on mainnet: dry-run the stack once those are published.

  # Resolve the dispatch to released commits, from git alone. No key, no
  # environment.
  mainnet-plan:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mainnet_publish_tags != '' || inputs.mainnet_stack_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read # the tags and main's history
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      publish_any: ${{ steps.plan.outputs.publish_any }}
      stack_any: ${{ steps.plan.outputs.stack_any }}
      stack_tag: ${{ steps.plan.outputs.stack_tag }}
      stack_commit: ${{ steps.plan.outputs.stack_commit }}
      stack_rustc: ${{ steps.plan.outputs.stack_rustc }}
      testnet_manifest_commit: ${{ steps.plan.outputs.testnet_manifest_commit }}
    env:
      # Kept in step with publish-plan's ALLOW, deploy-plan's DEPLOY_SET, and
      # the deploy-stack jobs' REUSE (scripts/test-release-scripts.py checks).
      MAINNET_ALLOW: "perch-interpreter perch-doc-compiler perch-ed25519-verifier perch-spending-limit"
      MAINNET_STACK: "perch-webauthn-verifier perch-recovery perch-zk-pool perch-zk-adapter perch-account perch-account-factory"
      REUSE: "perch-doc-compiler perch-interpreter perch-spending-limit perch-ed25519-verifier"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # every tag, and main's history of deployments/testnet.json
      - name: Resolve the tags to released commits on main
        id: plan
        env:
          REF: ${{ github.ref }}
          TESTNET_TAG: ${{ inputs.publish_tag }}
          PUBLISH_TAGS: ${{ inputs.mainnet_publish_tags }}
          STACK_TAG: ${{ inputs.mainnet_stack_tag }}
          DRY_RUN: ${{ inputs.mainnet_dry_run }}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/main ] || { echo "::error::dispatch a mainnet release from main, not $REF"; exit 1; }
          [ -z "$TESTNET_TAG" ] || { echo "::error::publish_tag is a testnet republish: dispatch it on its own, not with a mainnet release"; exit 1; }
          plan=$(scripts/mainnet-plan.sh --main "$GITHUB_SHA" --allow "$MAINNET_ALLOW" \
            --stack-set "$MAINNET_STACK" --reuse "$REUSE" --publish "$PUBLISH_TAGS" --stack "$STACK_TAG")
          {
            echo "publish=$(jq -c .publish <<<"$plan")"
            echo "publish_any=$(jq -r '.publish | length > 0' <<<"$plan")"
            echo "stack_any=$(jq -r '.stack != null' <<<"$plan")"
            echo "stack_tag=$(jq -r '.stack.tag // ""' <<<"$plan")"
            echo "stack_commit=$(jq -r '.stack.commit // ""' <<<"$plan")"
            echo "stack_rustc=$(jq -r '.stack.rustc // ""' <<<"$plan")"
            echo "testnet_manifest_commit=$(jq -r '.stack.testnet_manifest_commit // ""' <<<"$plan")"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Mainnet release plan ($([ "$DRY_RUN" = true ] && echo "dry run: nothing is submitted" || echo "PUBLISHES to mainnet"))"
            jq -r '.publish[] | "- publish `\(.tag)` (\(.commit))"' <<<"$plan"
            jq -r 'if .stack then "- deploy the recovery stack from `\(.stack.tag)` (\(.stack.commit)), rustc \(.stack.rustc)" else empty end' <<<"$plan"
          } >>"$GITHUB_STEP_SUMMARY"

  # Publish each tag's attested release asset to the mainnet registry,
  # authored by the mainnet perch-author account and signed by its mainnet
  # delegate. One job, not a matrix: the legs would share the delegate's
  # sequence number, and each one would wait for its own approval.
  mainnet-publish:
    needs: mainnet-plan
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.mainnet-plan.outputs.publish_any == 'true'
    runs-on: ubuntu-latest
    environment: mainnet
    permissions:
      contents: read # the release assets
      attestations: read # gh attestation verify
    env:
      STELLAR_NETWORK: mainnet
      STELLAR_RPC_URL: https://mainnet.sorobanrpc.com
      STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
      # The mainnet environment's variables. No defaults: an unset one fails
      # scripts/mainnet-settings.sh.
      REGISTRY: ${{ vars.PERCH_MAINNET_REGISTRY_CONTRACT_ID }}
      REGISTRY_PATH: ${{ vars.PERCH_MAINNET_REGISTRY_PATH }}
      ROOT: ${{ vars.PERCH_MAINNET_ROOT_REGISTRY }}
      AUTHOR: ${{ vars.PERCH_MAINNET_AUTHOR_ADDRESS }}
      PUBLISH: ${{ needs.mainnet-plan.outputs.publish }}
    steps:
      # main's tip, for the pinned stellar-cli fork and the scripts. Nothing
      # here compiles, and the wasm comes from the releases, not this tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-stellar-fork
      - name: Check the mainnet settings
        run: scripts/mainnet-settings.sh >/dev/null
      # Exactly the bytes each tag was released as: the release's asset, and
      # its build attestation must name the tag's commit on main. The check
      # refuses any other bytes.
      - name: Fetch and verify each tag's attested release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          while read -r row; do
            pkg=$(jq -r .package <<<"$row") ver=$(jq -r .version <<<"$row")
            tag=$(jq -r .tag <<<"$row") commit=$(jq -r .commit <<<"$row")
            asset="${pkg}_v${ver}.wasm"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir dist
            test -s "dist/$asset" || { echo "::error::release $tag has no $asset"; exit 1; }
            gh attestation verify "dist/$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow stellar-registry/actions/.github/workflows/contract-release.yml \
              --source-ref refs/heads/main --source-digest "$commit"
            binver=$(stellar contract info meta --wasm "dist/$asset" | sed -n 's/^ • binver: \(.*\)$/\1/p')
            [ "$binver" = "$ver" ] || { echo "::error::$asset carries binver '$binver', the tag is $ver"; exit 1; }
            echo "$tag: $(sha256sum "dist/$asset" | cut -d' ' -f1)"
          done < <(jq -c '.[]' <<<"$PUBLISH")
      # The delegate is only the simulation source here: every transaction is
      # built unsigned and simulated for its fee (scripts/publish-wasm.sh
      # --plan), and nothing is sent.
      - name: Simulate each publish (dry run, submits nothing)
        if: inputs.mainnet_dry_run
        env:
          STELLAR_ACCOUNT: ${{ secrets.CI_PUBLISH_MAINNET_SECRET_KEY }}
        run: |
          set -euo pipefail
          : >receipts.jsonl
          while read -r row; do
            pkg=$(jq -r .package <<<"$row") ver=$(jq -r .version <<<"$row")
            scripts/publish-wasm.sh --plan --registry "$REGISTRY" --author "$AUTHOR" \
              --name "$pkg" --version "$ver" --wasm "dist/${pkg}_v${ver}.wasm" >>receipts.jsonl
          done < <(jq -c '.[]' <<<"$PUBLISH")
      # Secrets go through the environment, never argv: STELLAR_ACCOUNT is the
      # source/fee delegate and STELLAR_SIGN_WITH_KEY signs the author's
      # publish_hash authorization (the fork discovers its context rule).
      - name: Publish and deploy each wasm (smart-account-authored)
        if: ${{ !inputs.mainnet_dry_run }}
        env:
          STELLAR_ACCOUNT: ${{ secrets.CI_PUBLISH_MAINNET_SECRET_KEY }}
          STELLAR_SIGN_WITH_KEY: ${{ secrets.CI_PUBLISH_MAINNET_SECRET_KEY }}
        run: |
          set -euo pipefail
          : >receipts.jsonl
          while read -r row; do
            pkg=$(jq -r .package <<<"$row") ver=$(jq -r .version <<<"$row")
            scripts/publish-wasm.sh --registry "$REGISTRY" --author "$AUTHOR" \
              --name "$pkg" --version "$ver" --wasm "dist/${pkg}_v${ver}.wasm" >>receipts.jsonl
          done < <(jq -c '.[]' <<<"$PUBLISH")
      - name: Summarize
        if: ${{ !cancelled() && hashFiles('receipts.jsonl') != '' }}
        env:
          DRY_RUN: ${{ inputs.mainnet_dry_run }}
        run: |
          {
            echo "### Mainnet publish to $REGISTRY ($REGISTRY_PATH)$([ "$DRY_RUN" = true ] && echo ": dry run, nothing submitted")"
            scripts/publish-wasm.sh --summary receipts.jsonl
          } >>"$GITHUB_STEP_SUMMARY"
      # A failed run keeps the receipts of what it did publish.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && !inputs.mainnet_dry_run && hashFiles('receipts.jsonl') != '' }}
        with:
          name: mainnet-publish-receipts
          path: receipts.jsonl
          if-no-files-found: error
          retention-days: 90

  # Attach each mainnet publish receipt to its release, beside the testnet
  # one (publish-receipt.json). No secret.
  mainnet-publish-record:
    needs: [mainnet-plan, mainnet-publish]
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.mainnet_dry_run &&
      needs.mainnet-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the receipt to each release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mainnet-publish-receipts
      - name: Attach publish-receipt-mainnet.json to each release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.mainnet-plan.outputs.publish }}
        run: |
          set -euo pipefail
          while read -r row; do
            pkg=$(jq -r .package <<<"$row") ver=$(jq -r .version <<<"$row") tag=$(jq -r .tag <<<"$row")
            jq -c --arg n "$pkg" --arg v "$ver" 'select(.name == $n and .version == $v) | . + {network: "mainnet"}' \
              receipts.jsonl >publish-receipt-mainnet.json
            [ -s publish-receipt-mainnet.json ] || { echo "::error::no receipt for $tag"; exit 1; }
            gh release upload "$tag" publish-receipt-mainnet.json --clobber --repo "$GITHUB_REPOSITORY"
          done < <(jq -c '.[]' <<<"$PUBLISH")

  # The settings the stack build pins, read in the environment and checked
  # on-chain, then handed to the build as outputs: the job that compiles is
  # never bound to the environment. No secret.
  mainnet-config:
    needs: mainnet-plan
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.mainnet-plan.outputs.stack_any == 'true'
    runs-on: ubuntu-latest
    environment: mainnet
    permissions:
      contents: read # the settings check and the stellar-cli fork
    outputs:
      registry: ${{ steps.settings.outputs.registry }}
      root: ${{ steps.settings.outputs.root }}
    env:
      STELLAR_RPC_URL: https://mainnet.sorobanrpc.com
      STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
      REGISTRY: ${{ vars.PERCH_MAINNET_REGISTRY_CONTRACT_ID }}
      REGISTRY_PATH: ${{ vars.PERCH_MAINNET_REGISTRY_PATH }}
      ROOT: ${{ vars.PERCH_MAINNET_ROOT_REGISTRY }}
      AUTHOR: ${{ vars.PERCH_MAINNET_AUTHOR_ADDRESS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-stellar-fork
      - name: Check the mainnet settings
        id: settings
        run: scripts/mainnet-settings.sh >>"$GITHUB_OUTPUT"

  # Build the stack from the stack tag's commit (checked out under stack/;
  # its own scripts build it), pinned to the mainnet registry, with no key.
  mainnet-deploy-stack-build:
    needs: [mainnet-plan, mainnet-config, mainnet-publish]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' &&
      needs.mainnet-plan.outputs.stack_any == 'true' &&
      needs.mainnet-config.result == 'success' &&
      (needs.mainnet-publish.result == 'success' || needs.mainnet-publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the stack commit
      attestations: read # gh attestation verify
    env:
      STELLAR_NETWORK: mainnet
      STELLAR_RPC_URL: https://mainnet.sorobanrpc.com
      STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
      PERCH_ROOT_REGISTRY: ${{ needs.mainnet-config.outputs.root }}
      REGISTRY: ${{ needs.mainnet-config.outputs.registry }}
      # The ALLOW-listed tier-0 to reuse from the mainnet registry (published
      # by mainnet-publish, not rebuilt here).
      REUSE: "perch-doc-compiler perch-interpreter perch-spending-limit perch-ed25519-verifier"
      STACK_COMMIT: ${{ needs.mainnet-plan.outputs.stack_commit }}
      TESTNET_MANIFEST_COMMIT: ${{ needs.mainnet-plan.outputs.testnet_manifest_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the testnet manifest at TESTNET_MANIFEST_COMMIT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.mainnet-plan.outputs.stack_commit }}
          path: stack
          persist-credentials: false
      # The rustc the testnet deployment from this commit recorded, so the
      # tier-0 rebuild can reproduce the bytes it attested. No dependency
      # cache, as in deploy-stack-build.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ needs.mainnet-plan.outputs.stack_rustc }}
          targets: wasm32v1-none
      - uses: ./.github/actions/setup-stellar-fork
        with:
          scaffold: "true"
      - name: Build the stack against the mainnet registry (no key)
        env:
          # Over the checkout's rust-toolchain.toml (`stable`).
          RUSTUP_TOOLCHAIN: ${{ needs.mainnet-plan.outputs.stack_rustc }}
        run: |
          set -euo pipefail
          stack/scripts/deploy-stack.sh --build-only --registry "$REGISTRY" --reuse "$REUSE"
      # Tier 0 pins nothing, so mainnet must run exactly the tier-0 bytes the
      # testnet deployment from this commit recorded, every name of them:
      # the reused ones as fetched from the mainnet registry, and the rebuilt
      # ones, which must also carry this workflow's own deploy-stack record
      # attestation for this commit on main. The account and the factory may
      # differ only in the registry they pin, so every tier-0 hash they pin
      # must be that deployment's too. Anything else refuses.
      - name: Check every tier-0 is the bytes the testnet deployment recorded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=stack/target/stack/build.json
          testnet=$(git show "$TESTNET_MANIFEST_COMMIT:deployments/testnet.json")
          want() { jq -r --arg p "$1" '.contracts[$p].sha256 // empty' <<<"$testnet"; }
          for pkg in $(jq -r '.artifacts[] | select(.tier == 0) | .package' "$build"); do
            wasm="stack/target/stack/$(jq -r --arg p "$pkg" '.artifacts[] | select(.package == $p) | .wasm' "$build")"
            got=$(sha256sum "$wasm" | cut -d' ' -f1)
            [ "$got" = "$(want "$pkg")" ] || { echo "::error::$pkg is $got; the testnet deployment from $STACK_COMMIT recorded '$(want "$pkg")'"; exit 1; }
            case " $REUSE " in
              *" $pkg "*) echo "$pkg: $got (reused from the mainnet registry)" ;;
              *)
                gh attestation verify "$wasm" --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                  --source-ref refs/heads/main --source-digest "$STACK_COMMIT"
                echo "$pkg: $got (rebuilt, attested)" ;;
            esac
          done
          tier0=$(jq -c '[.artifacts[] | select(.tier == 0) | .package]' "$build")
          for consumer in perch-account perch-account-factory; do
            while read -r dep hash; do
              [ "$hash" = "$(want "$dep")" ] || { echo "::error::$consumer pins $dep $hash; the testnet deployment recorded '$(want "$dep")'"; exit 1; }
            done < <(jq -r --arg c "$consumer" --argjson t0 "$tier0" \
              '.artifacts[] | select(.package == $c) | .pins | to_entries[] | select(.key as $k | $t0 | index($k)) | "\(.key) \(.value)"' "$build")
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mainnet-deploy-stack-build
          path: stack/target/stack
          if-no-files-found: error
          retention-days: 7

  # Publish the prebuilt stack to the mainnet registry in pin order, or with
  # mainnet_dry_run simulate every transaction that would send. The only
  # stack job holding the mainnet delegate; it compiles and runs no Rust.
  mainnet-deploy-stack:
    needs: [mainnet-plan, mainnet-deploy-stack-build]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' &&
      needs.mainnet-deploy-stack-build.result == 'success'
    runs-on: ubuntu-latest
    environment: mainnet
    permissions:
      contents: read # check out the stack commit
    env:
      STELLAR_NETWORK: mainnet
      STELLAR_RPC_URL: https://mainnet.sorobanrpc.com
      STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
      REGISTRY: ${{ vars.PERCH_MAINNET_REGISTRY_CONTRACT_ID }}
      REGISTRY_PATH: ${{ vars.PERCH_MAINNET_REGISTRY_PATH }}
      ROOT: ${{ vars.PERCH_MAINNET_ROOT_REGISTRY }}
      AUTHOR: ${{ vars.PERCH_MAINNET_AUTHOR_ADDRESS }}
      PERCH_ROOT_REGISTRY: ${{ vars.PERCH_MAINNET_ROOT_REGISTRY }}
      REUSE: "perch-doc-compiler perch-interpreter perch-spending-limit perch-ed25519-verifier"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.mainnet-plan.outputs.stack_commit }}
          path: stack
          persist-credentials: false
      - uses: ./.github/actions/setup-stellar-fork
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mainnet-deploy-stack-build
          path: stack/target/stack
      - name: Check the mainnet settings (and that the build pins this registry)
        run: |
          set -euo pipefail
          scripts/mainnet-settings.sh >/dev/null
          [ "$(jq -r .registry stack/target/stack/build.json)" = "$REGISTRY" ] \
            || { echo "::error::the stack was built for another registry"; exit 1; }
      # In deploy-stack.sh's order: tier 0 (the reused ones report as
      # already deployed, or refuse on another hash), the account (install
      # only), the factory. The delegate is only the simulation source.
      - name: Simulate the deploy (dry run, submits nothing)
        if: inputs.mainnet_dry_run
        env:
          STELLAR_ACCOUNT: ${{ secrets.CI_PUBLISH_MAINNET_SECRET_KEY }}
        run: |
          set -euo pipefail
          build=stack/target/stack/build.json
          plan() { # package [--install-only]
            local a
            a=$(jq -c --arg p "$1" '.artifacts[] | select(.package == $p)' "$build")
            scripts/publish-wasm.sh --plan "${@:2}" --registry "$REGISTRY" --author "$AUTHOR" --name "$1" \
              --version "$(jq -r .version <<<"$a")" --wasm "stack/target/stack/$(jq -r .wasm <<<"$a")" >>receipts.jsonl
          }
          : >receipts.jsonl
          for pkg in $(jq -r '.artifacts[] | select(.tier == 0) | .package' "$build"); do plan "$pkg"; done
          plan perch-account --install-only
          plan perch-account-factory
      - name: Publish the prebuilt stack (smart-account-authored, reusing the mainnet tier-0)
        if: ${{ !inputs.mainnet_dry_run }}
        env:
          STELLAR_ACCOUNT: ${{ secrets.CI_PUBLISH_MAINNET_SECRET_KEY }}
          STELLAR_SIGN_WITH_KEY: ${{ secrets.CI_PUBLISH_MAINNET_SECRET_KEY }}
        run: |
          set -euo pipefail
          stack/scripts/deploy-stack.sh --prebuilt --registry "$REGISTRY" --author "$AUTHOR" --reuse "$REUSE"
      - name: Summarize the dry run
        if: ${{ !cancelled() && inputs.mainnet_dry_run && hashFiles('receipts.jsonl') != '' }}
        run: |
          {
            echo "### Mainnet stack deploy to $REGISTRY ($REGISTRY_PATH): dry run, nothing submitted"
            scripts/publish-wasm.sh --summary receipts.jsonl
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.mainnet_dry_run }}
        with:
          name: mainnet-deploy-stack-manifest
          path: stack/deployments/mainnet.json
          if-no-files-found: error
          retention-days: 7

  # Attest the registry-pinned wasm, verify the deployment, bump
  # perch-artifacts, and open the deploy(mainnet) PR, as deploy-stack-record
  # does for testnet. No secret. The PR records deployments/mainnet.json
  # only: the committed build-time pins (crates/*/wasm) and the
  # @stellar-registry/perch-contracts bindings describe the testnet
  # deployment and stay on it.
  mainnet-deploy-stack-record:
    needs: [mainnet-plan, mainnet-deploy-stack]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.mainnet_dry_run &&
      needs.mainnet-deploy-stack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the manifest onto the deploy branch
      pull-requests: write # open the deploy(mainnet) PR
      id-token: write # build-provenance attestation
      attestations: write
    env:
      STELLAR_NETWORK: mainnet
      STACK_COMMIT: ${{ needs.mainnet-plan.outputs.stack_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git-cliff needs full history + tags (perch-artifacts bump)
      - name: Install git-cliff (bumps perch-artifacts below)
        run: |
          mkdir -p "$RUNNER_TEMP/gc"
          curl -fsSL https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/gc.tar.gz"
          echo "bb40f68e752db1a32526c43e0108e8eff785f7c24c67024cffe1c316e034372975fd78c9af8e9a48148235aad15c9a103f1a5b490c282f1db09a7a793794b69f  $RUNNER_TEMP/gc.tar.gz" | sha512sum -c -
          tar -xz -C "$RUNNER_TEMP/gc" --strip-components=1 -f "$RUNNER_TEMP/gc.tar.gz"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mainnet-deploy-stack-build
          path: target/stack
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mainnet-deploy-stack-manifest
          path: deployments
      # The account and the factory pin the mainnet registry, so no earlier
      # attestation covers them. The tier-0 carry the testnet release's
      # (checked in mainnet-deploy-stack-build). A dispatch run's attestation
      # names the dispatched main commit; the manifest's source.commit names
      # the stack commit they were built from.
      - name: Collect the registry-pinned wasm to attest
        id: built
        run: |
          set -euo pipefail
          {
            echo "paths<<EOF"
            jq -r '.artifacts[] | select(.tier > 0) | "target/stack/\(.wasm)"' target/stack/build.json
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - name: Attest build provenance for the account and the factory
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.built.outputs.paths }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-stellar-fork
      - name: Verify the deployment against the chain
        run: scripts/verify-deployment.sh --manifest deployments/mainnet.json
      - name: Bump @stellar-registry/perch-artifacts for the new deployment record
        env:
          MESSAGE: "deploy(mainnet): recovery stack @ ${{ needs.mainnet-plan.outputs.stack_commit }}"
          MANIFEST: deployments/mainnet.json
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/gc:$PATH" # git-cliff, installed above
          git add -- "$MANIFEST"
          if git diff --cached --quiet -- "$MANIFEST"; then
            git reset -q
            echo "$MANIFEST is unchanged — no perch-artifacts release" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "$MESSAGE"
          out=$(scripts/npm-release.sh bump perch-artifacts)
          git reset -q --soft HEAD~1
          git reset -q
          if [ -z "$out" ]; then
            echo "::warning::$MANIFEST changed but scripts/npm-release.sh proposed no perch-artifacts bump; the release PR will"
            exit 0
          fi
          read -r cur next <<<"$out"
          echo "\`@stellar-registry/perch-artifacts\`: $cur -> $next" >>"$GITHUB_STEP_SUMMARY"
      - name: Open the deploy(mainnet) manifest PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: deploy/mainnet
          delete-branch: true
          title: "deploy(mainnet): recovery stack"
          commit-message: "deploy(mainnet): recovery stack @ ${{ needs.mainnet-plan.outputs.stack_commit }}"
          add-paths: |
            deployments/mainnet.json
            packages/perch-artifacts/package.json
            packages/perch-artifacts/package-lock.json
            packages/perch-artifacts/CHANGELOG.md
          body: >
            Automated by the `mainnet-deploy-stack` jobs, dispatched by hand: the
            recovery stack deployed to the mainnet registry,
            smart-account-authored, in pin order, built from
            `${{ needs.mainnet-plan.outputs.stack_tag }}`
            (${{ needs.mainnet-plan.outputs.stack_commit }}, on `main`). Merging
            adds `deployments/mainnet.json` and bumps
            `@stellar-registry/perch-artifacts` (version and changelog, from the
            release tooling), so the merge publishes a package carrying this
            manifest before Nido is notified. The committed build-time pins and
            the `@stellar-registry/perch-contracts` bindings stay on the testnet
            deployment.
