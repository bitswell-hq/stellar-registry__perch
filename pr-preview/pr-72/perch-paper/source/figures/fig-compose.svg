<svg class="wide" viewBox="0 0 760 849" role="img" aria-labelledby="fig-compose-title" aria-describedby="fig-compose-text"><text x="2" y="16" class="m tag" font-size="14">MODEL</text><text x="60" y="16" class="m" font-size="14">the same five checks, two arrangements; no contract named</text><text x="2" y="38" class="x" font-size="14">Each request is signed by the app and a co-signer, and the oracle’s price is above the floor, unless it says</text><text x="2" y="55" class="x" font-size="14">otherwise.</text><text x="158" y="73" class="t" font-size="14">(a) Shaped like a Perch account</text><text x="158" y="90" class="m" font-size="14">one decision point holds the checks</text><text x="158" y="107" class="m" font-size="14">and the window record</text><text x="416" y="73" class="t" font-size="14">(b) Shaped like a policy-composed</text><text x="416" y="90" class="t" font-size="14">OpenZeppelin account</text><text x="416" y="107" class="m" font-size="14">one policy per check, each with its own state, run in</text><text x="416" y="124" class="m" font-size="14">order</text><rect x="158" y="145" width="250" height="139" rx="6" class="bx bx-k"/><text x="170" y="167" class="t" font-size="14">decision point</text><text x="170" y="187" class="x" font-size="14">• recipient pin</text><text x="170" y="204" class="x" font-size="14">• two signers</text><text x="170" y="221" class="x" font-size="14">• window cap + its record</text><rect x="168" y="229" width="230" height="44" rx="4" class="bx dash"/><text x="178" y="247" class="m" font-size="14">per-call bound and live read: a</text><text x="178" y="264" class="m" font-size="14">Perch rule has neither</text><rect x="416" y="149" width="147.21" height="24" rx="4" class="bx"/><text x="422" y="166" class="x" font-size="14">window cap + record</text><path d="M566.21 161H577.21" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="581.21" y="149" width="91.25" height="24" rx="4" class="bx"/><text x="587.21" y="166" class="x" font-size="14">recipient pin</text><path d="M416 191H427" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="431" y="179" width="105.14" height="24" rx="4" class="bx"/><text x="437" y="196" class="x" font-size="14">per-call bound</text><path d="M539.14 191H550.14" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="554.14" y="179" width="86.34" height="24" rx="4" class="bx"/><text x="560.14" y="196" class="x" font-size="14">two signers</text><path d="M643.48 191H654.48" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="658.48" y="179" width="67.55" height="24" rx="4" class="bx"/><text x="664.48" y="196" class="x" font-size="14">live read</text><text x="416" y="221" class="m" font-size="14">Each policy can be attached, detached or moved;</text><text x="416" y="238" class="m" font-size="14">the first to refuse stops the call.</text><text x="2" y="314" class="t tag" font-size="14">REQUESTS</text><g data-request="1" data-a="accepted" data-b="accepted"><circle cx="13" cy="341" r="11" class="bx"/><text x="13" y="345.9" class="t" font-size="14" text-anchor="middle">1</text><text x="30" y="346" class="t" font-size="14">Pay 6 to the</text><text x="30" y="363" class="t" font-size="14">shop</text><rect x="158" y="324" width="250" height="114" rx="6" class="bx"/><rect x="166" y="332" width="101.88" height="24" rx="4" class="bx"/><text x="172" y="349" class="x" font-size="14">decision point</text><path d="M167 373l4 5l8-10" class="gl"/><text x="188" y="378" class="x" font-size="14">accepted; written: the window</text><text x="188" y="396" class="x" font-size="14">record, now 6 of 10</text><rect x="416" y="324" width="342" height="114" rx="6" class="bx"/><rect x="424" y="332" width="88.79" height="24" rx="4" class="bx"/><text x="430" y="349" class="x" font-size="14">window cap</text><path d="M515.79 344H526.79" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="530.79" y="332" width="91.25" height="24" rx="4" class="bx"/><text x="536.79" y="349" class="x" font-size="14">recipient pin</text><path d="M625.04 344H636.04" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="640.04" y="332" width="105.14" height="24" rx="4" class="bx"/><text x="646.04" y="349" class="x" font-size="14">per-call bound</text><path d="M424 374H435" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="439" y="362" width="86.34" height="24" rx="4" class="bx"/><text x="445" y="379" class="x" font-size="14">two signers</text><path d="M528.34 374H539.34" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="543.34" y="362" width="67.55" height="24" rx="4" class="bx"/><text x="549.34" y="379" class="x" font-size="14">live read</text><path d="M425 403l4 5l8-10" class="gl"/><text x="446" y="408" class="x" font-size="14">accepted; written: the window cap’s record,</text><text x="446" y="426" class="x" font-size="14">now 6 of 10</text></g><g data-request="2" data-a="refused:window" data-b="refused:window"><circle cx="13" cy="461" r="11" class="bx"/><text x="13" y="465.9" class="t" font-size="14" text-anchor="middle">2</text><text x="30" y="466" class="t" font-size="14">Pay 5 more to</text><text x="30" y="483" class="t" font-size="14">the shop</text><rect x="158" y="444" width="250" height="102" rx="6" class="bx"/><rect x="166" y="452" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="172" y="469" class="d" font-size="14">decision point</text><path d="M267.88 449V479" class="fl-d"/><path d="M168 488l10 10M178 488l-10 10" class="gl-d"/><text x="188" y="498" class="d" font-size="14">refused at the decision point:</text><text x="188" y="516" class="d" font-size="14">window cap (6 + 5 = 11 &gt; 10);</text><text x="188" y="534" class="d" font-size="14">nothing written</text><rect x="416" y="444" width="342" height="102" rx="6" class="bx"/><rect x="424" y="452" width="88.79" height="24" rx="4" class="bx bx-no"/><text x="430" y="469" class="d" font-size="14">window cap</text><path d="M512.79 449V479" class="fl-d"/><path d="M426 488l10 10M436 488l-10 10" class="gl-d"/><text x="446" y="498" class="d" font-size="14">refused by the window cap (6 + 5 = 11 &gt; 10);</text><text x="446" y="516" class="d" font-size="14">nothing written</text></g><g data-request="3" data-a="refused:pin" data-b="refused:pin:rolled-back"><circle cx="13" cy="569" r="11" class="bx"/><text x="13" y="573.9" class="t" font-size="14" text-anchor="middle">3</text><text x="30" y="574" class="t" font-size="14">Pay 1 elsewhere</text><rect x="158" y="552" width="250" height="84" rx="6" class="bx"/><rect x="166" y="560" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="172" y="577" class="d" font-size="14">decision point</text><path d="M267.88 557V587" class="fl-d"/><path d="M168 596l10 10M178 596l-10 10" class="gl-d"/><text x="188" y="606" class="d" font-size="14">refused at the decision point:</text><text x="188" y="624" class="d" font-size="14">recipient pin; nothing written</text><rect x="416" y="552" width="342" height="84" rx="6" class="bx"/><rect x="424" y="560" width="88.79" height="24" rx="4" class="bx"/><text x="430" y="577" class="x" font-size="14">window cap</text><path d="M515.79 572H526.79" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="530.79" y="560" width="91.25" height="24" rx="4" class="bx bx-no"/><text x="536.79" y="577" class="d" font-size="14">recipient pin</text><path d="M622.04 557V587" class="fl-d"/><path d="M426 596l10 10M436 596l-10 10" class="gl-d"/><text x="446" y="606" class="d" font-size="14">refused by the recipient pin after the window</text><text x="446" y="624" class="d" font-size="14">cap wrote: rolled back with the call</text></g><g data-request="4" data-a="refused:window" data-b="accepted"><circle cx="13" cy="659" r="11" class="bx"/><text x="13" y="663.9" class="t" font-size="14" text-anchor="middle">4</text><text x="30" y="664" class="t" font-size="14">Detach the</text><text x="30" y="681" class="t" font-size="14">window cap in</text><text x="30" y="698" class="t" font-size="14">(b); pay 6 to the</text><text x="30" y="715" class="t" font-size="14">shop</text><rect x="158" y="642" width="250" height="132" rx="6" class="bx"/><rect x="166" y="650" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="172" y="667" class="d" font-size="14">decision point</text><path d="M267.88 647V677" class="fl-d"/><path d="M168 686l10 10M178 686l-10 10" class="gl-d"/><text x="188" y="696" class="d" font-size="14">refused at the decision point:</text><text x="188" y="714" class="d" font-size="14">window cap (6 + 6 = 12 &gt; 10);</text><text x="188" y="732" class="d" font-size="14">nothing written</text><rect x="416" y="642" width="342" height="132" rx="6" class="bx"/><rect x="424" y="650" width="91.25" height="24" rx="4" class="bx"/><text x="430" y="667" class="x" font-size="14">recipient pin</text><path d="M518.25 662H529.25" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="533.25" y="650" width="105.14" height="24" rx="4" class="bx"/><text x="539.25" y="667" class="x" font-size="14">per-call bound</text><path d="M641.39 662H652.39" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="656.39" y="650" width="86.34" height="24" rx="4" class="bx"/><text x="662.39" y="667" class="x" font-size="14">two signers</text><path d="M424 692H435" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="439" y="680" width="67.55" height="24" rx="4" class="bx"/><text x="445" y="697" class="x" font-size="14">live read</text><path d="M425 721l4 5l8-10" class="gl"/><text x="446" y="726" class="x" font-size="14">accepted; no window cap attached, so nothing</text><text x="446" y="744" class="x" font-size="14">written; moved in the last 100 ledgers: 12,</text><text x="446" y="762" class="x" font-size="14">over 10</text></g><text x="158" y="798" class="x" font-size="14">Window at most 10: holds while the</text><text x="158" y="815" class="x" font-size="14">rule keeps its cap.</text><text x="416" y="798" class="x" font-size="14">Window at most 10: holds while the window-cap</text><text x="416" y="815" class="x" font-size="14">policy is attached.</text><text x="2" y="798" class="t tag" font-size="14">GUARANTEE</text><text x="2" y="841" class="t" font-size="15">Composition buys flexibility; one decision point gives one place to check.</text></svg>
