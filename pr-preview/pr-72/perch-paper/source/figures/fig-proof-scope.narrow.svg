<svg class="narrow" viewBox="0 0 340 501" role="img" aria-labelledby="fig-proof-scope-title" aria-describedby="fig-proof-scope-text"><rect x="2" y="4" width="336" height="62" rx="6" class="bx"/><text x="14" y="31" class="t" font-size="14">Rust source</text><text x="14" y="50" class="x" font-size="14">rule-core <tspan class="mono">cbabe59</tspan>, the evaluator</text><text x="2" y="90" class="t tag" font-size="14">PROOF PATH</text><rect x="2" y="98" width="336" height="62" rx="6" class="bx"/><rect x="5" y="101" width="11" height="56" rx="0" class="tr"/><text x="28" y="125" class="t" font-size="14">Charon and Aeneas</text><text x="28" y="144" class="x" font-size="14">translate it to Lean</text><path d="M40 162V176" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="180" width="336" height="62" rx="6" class="bx bx-pr"/><rect x="6" y="184" width="328" height="54" rx="2" class="fl-g"/><text x="14" y="207" class="t" font-size="14">Lean: the translation and a model</text><text x="14" y="226" class="x" font-size="14">940 theorems, checked by Lean’s kernel</text><text x="2" y="268" class="t tag" font-size="14">SHIPPING PATH</text><rect x="2" y="276" width="336" height="62" rx="6" class="bx"/><rect x="5" y="279" width="11" height="56" rx="0" class="tr"/><text x="28" y="303" class="t" font-size="14">rustc 1.97.1</text><text x="28" y="322" class="x" font-size="14">compiles it to Wasm</text><path d="M40 340V354" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="358" width="336" height="62" rx="6" class="bx"/><text x="14" y="385" class="t" font-size="14">The account’s Wasm</text><text x="14" y="404" class="x" font-size="14">Perch <tspan class="mono">f0275f4</tspan>: tested</text><text x="2" y="442" class="m" font-size="14">Tests bridge the paths (golden fixtures,</text><text x="2" y="459" class="m" font-size="14">Lean-generated traces); nothing checks the Wasm</text><text x="2" y="476" class="m" font-size="14">against the Lean translation. Double border:</text><text x="2" y="493" class="m" font-size="14">proved. Single: tested. Hatched: trusted.</text></svg>
