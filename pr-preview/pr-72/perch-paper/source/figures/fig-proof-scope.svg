<svg class="wide" viewBox="0 0 760 290" role="img" aria-labelledby="fig-proof-scope-title" aria-describedby="fig-proof-scope-text"><rect x="2" y="96" width="170" height="81" rx="6" class="bx"/><text x="14" y="123" class="t" font-size="14">Rust source</text><text x="14" y="142" class="x" font-size="14">rule-core <tspan class="mono">cbabe59</tspan>,</text><text x="14" y="161" class="x" font-size="14">the evaluator</text><rect x="236" y="12" width="200" height="62" rx="6" class="bx"/><rect x="239" y="15" width="11" height="56" rx="0" class="tr"/><text x="262" y="39" class="t" font-size="14">Charon and Aeneas</text><text x="262" y="58" class="x" font-size="14">translate it to Lean</text><rect x="500" y="6" width="258" height="81" rx="6" class="bx bx-pr"/><rect x="504" y="10" width="250" height="73" rx="2" class="fl-g"/><text x="512" y="33" class="t" font-size="14">Lean: the translation and a model</text><text x="512" y="52" class="x" font-size="14">940 theorems, checked by Lean’s</text><text x="512" y="71" class="x" font-size="14">kernel</text><rect x="236" y="196" width="200" height="62" rx="6" class="bx"/><rect x="239" y="199" width="11" height="56" rx="0" class="tr"/><text x="262" y="223" class="t" font-size="14">rustc 1.97.1</text><text x="262" y="242" class="x" font-size="14">compiles it to Wasm</text><rect x="500" y="196" width="258" height="62" rx="6" class="bx"/><text x="512" y="223" class="t" font-size="14">The account’s Wasm</text><text x="512" y="242" class="x" font-size="14">Perch <tspan class="mono">f0275f4</tspan>: tested</text><path d="M172 120H200V42H232" class="fl" marker-end="url(#perch-ah)"/><path d="M172 150H200V226H232" class="fl" marker-end="url(#perch-ah)"/><path d="M436 42H496" class="fl" marker-end="url(#perch-ah)"/><path d="M436 226H496" class="fl" marker-end="url(#perch-ah)"/><path d="M629 84V192" class="fl-m dash"/><text x="640" y="116" class="m" font-size="14">tests bridge them:</text><text x="640" y="133" class="m" font-size="14">golden fixtures</text><text x="640" y="150" class="m" font-size="14">and</text><text x="640" y="167" class="m" font-size="14">Lean-generated</text><text x="640" y="184" class="m" font-size="14">traces</text><text x="236" y="120" class="d" font-size="14">Nothing checks the Wasm</text><text x="236" y="137" class="d" font-size="14">against the Lean translation.</text><text x="2" y="280" class="m" font-size="14">Double border: proved. Single: tested. Hatched: trusted. Dashed: tests, not proofs.</text></svg>
