<svg class="wide" viewBox="0 0 760 1250" role="img" aria-labelledby="fig-6-title" aria-describedby="fig-6-text"><rect x="2" y="2" width="756" height="58" rx="6" class="bx bx-k"/><text x="14" y="24" class="x" font-size="15">Soroban host → <tspan class="mono">__check_auth(signature_payload, auth payload, contexts)</tspan>. The auth</text><text x="14" y="44" class="x" font-size="15">payload carries <tspan class="mono">context_rule_ids</tspan> and the claimed signers.</text><text x="2" y="92" class="m tag" font-size="13">ACCOUNT SHELL · TESTED</text><rect x="50" y="110" width="450" height="61" rx="6" class="bx"/><text x="62" y="135" class="x" font-size="15">A context calls a reserved hook on any contract:</text><text x="62" y="155" class="x" font-size="15"><tspan class="mono">install</tspan>, <tspan class="mono">uninstall</tspan>, <tspan class="mono">enforce</tspan> or an <tspan class="mono">rcv_*</tspan> name?</text><circle cx="26" cy="132" r="11" class="bx"/><text x="26" y="136.68" class="t" font-size="13" text-anchor="middle">1</text><path d="M500 140.5H524V140.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="127.5" width="178.8" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="145.4" class="d" font-size="14">ReservedFunction · 1</text><rect x="50" y="197" width="450" height="101" rx="6" class="bx"/><text x="62" y="222" class="x" font-size="15">Recovery completion? Exactly one</text><text x="62" y="242" class="x" font-size="15"><tspan class="mono">apply_account_doc</tspan> (exported <tspan class="mono">apply_doc</tspan>) context</text><text x="62" y="262" class="x" font-size="15">on this account, selecting the recovery rule.</text><text x="62" y="282" class="x" font-size="15">Classification only.</text><circle cx="26" cy="219" r="11" class="bx"/><text x="26" y="223.68" class="t" font-size="13" text-anchor="middle">2</text><path d="M26 143.0V207.0" class="fl" marker-end="url(#perch-ah)"/><rect x="50" y="324" width="450" height="61" rx="6" class="bx"/><text x="62" y="349" class="x" font-size="15">Frozen by an authorized <tspan class="mono">Protected</tspan> attempt, and</text><text x="62" y="369" class="x" font-size="15">this is not its completion?</text><circle cx="26" cy="346" r="11" class="bx"/><text x="26" y="350.68" class="t" font-size="13" text-anchor="middle">3</text><path d="M26 230.0V334.0" class="fl" marker-end="url(#perch-ah)"/><path d="M500 354.5H524V354.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="341.5" width="155.28" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="359.4" class="d" font-size="14">AccountFrozen · 2</text><rect x="50" y="411" width="450" height="61" rx="6" class="bx"/><text x="62" y="436" class="x" font-size="15">A selected grant rule calls the recovery</text><text x="62" y="456" class="x" font-size="15">controller, its ZK adapter or its ZK pool?</text><circle cx="26" cy="433" r="11" class="bx"/><text x="26" y="437.68" class="t" font-size="13" text-anchor="middle">4</text><path d="M26 357.0V421.0" class="fl" marker-end="url(#perch-ah)"/><path d="M500 441.5H524V441.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="428.5" width="170.96" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="446.4" class="d" font-size="14">ScopeEscalation · 4</text><rect x="90" y="480" width="666" height="101" rx="6" class="bx bx-hi"/><text x="102" y="505" class="x" font-size="15">A completion leaves here. The recovery controller's <tspan class="mono">rcv_complete</tspan> checks the</text><text x="102" y="525" class="x" font-size="15">exact approved document bytes and the completion window: authorized with no</text><text x="102" y="545" class="x" font-size="15">signatures, or refused.</text><text x="102" y="565" class="m tag" font-size="13">TESTED · RECOVERY CONTROLLER</text><path d="M70 472.0V500H88" class="fl" marker-end="url(#perch-ah)"/><rect x="50" y="607" width="450" height="81" rx="6" class="bx"/><text x="62" y="632" class="x" font-size="15">bound = SHA-256(domain ‖ account ‖ signature</text><text x="62" y="652" class="x" font-size="15">payload), with domain</text><text x="62" y="672" class="x" font-size="15"><tspan class="mono">"perch/account/auth-addr-v1"</tspan></text><circle cx="26" cy="629" r="11" class="bx"/><text x="26" y="633.68" class="t" font-size="13" text-anchor="middle">5</text><path d="M26 444.0V617.0" class="fl" marker-end="url(#perch-ah)"/><rect x="50" y="714" width="450" height="61" rx="6" class="bx"/><text x="62" y="739" class="x" font-size="15">Resolve the selected rule IDs to stored rules and</text><text x="62" y="759" class="x" font-size="15">spending records; convert the contexts.</text><circle cx="26" cy="736" r="11" class="bx"/><text x="26" y="740.68" class="t" font-size="13" text-anchor="middle">6</text><path d="M26 640.0V724.0" class="fl" marker-end="url(#perch-ah)"/><path d="M500 727.5H524V727.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="714.5" width="225.84" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="732.4" class="d" font-size="14">ContextRuleNotFound · 3000</text><path d="M500 761.5H524V761.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="748.5" width="170.96" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="766.4" class="d" font-size="14">RuleEvalRefused · 5</text><rect x="50" y="801" width="450" height="121" rx="6" class="bx bx-pr"/><text x="62" y="826" class="x" font-size="15"><tspan class="mono">rule_eval::check_auth</tspan> (pinned:</text><text x="62" y="846" class="x" font-size="15"><tspan class="mono">rule_eval::authorize</tspan>). Rules, records, contexts,</text><text x="62" y="866" class="x" font-size="15">choices, signers, ledger, generation → next</text><text x="62" y="886" class="x" font-size="15">records. No storage, no signatures.</text><text x="62" y="906" class="g tag" font-size="13">PROVED · MODEL + TRANSLATION</text><circle cx="26" cy="823" r="11" class="bx"/><text x="26" y="827.68" class="t" font-size="13" text-anchor="middle">7</text><path d="M26 747.0V811.0" class="fl" marker-end="url(#perch-ah)"/><path d="M500 844.5H524V844.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="831.5" width="131.76" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="849.4" class="d" font-size="14">StaleScope · 3</text><path d="M500 878.5H524V878.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="865.5" width="170.96" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="883.4" class="d" font-size="14">RuleEvalRefused · 5</text><rect x="50" y="948" width="450" height="61" rx="6" class="bx"/><text x="62" y="973" class="x" font-size="15">digest = SHA-256(bound ‖ XDR(selected rule IDs)).</text><text x="62" y="993" class="x" font-size="15">For each claimed signer:</text><circle cx="26" cy="970" r="11" class="bx"/><text x="26" y="974.68" class="t" font-size="13" text-anchor="middle">8</text><path d="M26 834.0V958.0" class="fl" marker-end="url(#perch-ah)"/><rect x="90" y="1017" width="666" height="81" rx="6" class="bx"/><rect x="91" y="1018" width="10" height="79" class="tr"/><text x="114" y="1042" class="x" font-size="15">External: <tspan class="mono">verifier.verify(digest)</tspan>. A failure traps with</text><text x="114" y="1062" class="x" font-size="15"><tspan class="mono">ExternalVerificationFailed</tspan> (3003), and the host reverts the transaction.</text><text x="114" y="1082" class="m tag" font-size="13">TRUSTED · VERIFIER</text><path d="M70 1009.0V1037H88" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="90" y="1106" width="666" height="41" rx="6" class="bx bx-k"/><text x="102" y="1131" class="x" font-size="15">Delegated (CAP-0071): the host's <tspan class="mono">delegate_auth</tspan>. Rule IDs are not bound.</text><path d="M70 1009.0V1126H88" class="fl-k" marker-end="url(#perch-ah-k)"/><rect x="50" y="1173" width="450" height="61" rx="6" class="bx"/><text x="62" y="1198" class="x" font-size="15">Store each capped spending record that changed.</text><text x="62" y="1218" class="x" font-size="15">Authorized.</text><circle cx="26" cy="1195" r="11" class="bx"/><text x="26" y="1199.68" class="t" font-size="13" text-anchor="middle">9</text><path d="M26 981.0V1183.0" class="fl" marker-end="url(#perch-ah)"/></svg>
