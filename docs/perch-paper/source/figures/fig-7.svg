<svg class="wide" viewBox="0 0 760 683" role="img" aria-labelledby="fig-7-title" aria-describedby="fig-7-text"><rect x="28" y="2" width="380" height="141" rx="6" class="bx bx-k"/><text x="40" y="27" class="t" font-size="15">Host</text><text x="40" y="47" class="x" font-size="15">signature payload = SHA-256 of the XDR</text><text x="40" y="67" class="x" font-size="15">preimage: network ID, nonce, expiration</text><text x="40" y="87" class="x" font-size="15">ledger, invocation tree. Entries with</text><text x="40" y="107" class="x" font-size="15">delegates also include the account</text><text x="40" y="127" class="x" font-size="15">address.</text><path d="M68 143V163" class="fl" marker-end="url(#perch-ah)"/><rect x="28" y="165" width="380" height="101" rx="6" class="bx"/><text x="40" y="190" class="t" font-size="15">Account</text><text x="40" y="210" class="x" font-size="15">bound = SHA-256(domain ‖ 32-byte contract</text><text x="40" y="230" class="x" font-size="15">ID ‖ signature payload), with domain</text><text x="40" y="250" class="x" font-size="15"><tspan class="mono">"perch/account/auth-addr-v1"</tspan></text><path d="M68 266V286" class="fl" marker-end="url(#perch-ah)"/><rect x="28" y="288" width="380" height="81" rx="6" class="bx"/><text x="40" y="313" class="t" font-size="15">Account</text><text x="40" y="333" class="x" font-size="15">digest = SHA-256(bound ‖</text><text x="40" y="353" class="x" font-size="15">XDR(<tspan class="mono">context_rule_ids</tspan>))</text><path d="M68 369V389" class="fl" marker-end="url(#perch-ah)"/><rect x="28" y="391" width="380" height="121" rx="6" class="bx"/><rect x="29" y="392" width="10" height="119" class="tr"/><text x="52" y="416" class="t" font-size="15">External signer</text><text x="52" y="436" class="x" font-size="15">Ed25519 signs the digest. A WebAuthn</text><text x="52" y="456" class="x" font-size="15">passkey signs with challenge =</text><text x="52" y="476" class="x" font-size="15">base64url(digest).</text><text x="52" y="496" class="m tag" font-size="13">TRUSTED · VERIFIER</text><rect x="28" y="540" width="380" height="141" rx="6" class="bx bx-k"/><text x="40" y="565" class="t" font-size="15">Delegated signer (CAP-0071)</text><text x="40" y="585" class="x" font-size="15">Approves, through the host's</text><text x="40" y="605" class="x" font-size="15"><tspan class="mono">delegate_auth</tspan>, the host's payload for</text><text x="40" y="625" class="x" font-size="15">this account's entry, which is bound to</text><text x="40" y="645" class="x" font-size="15">the account. It never sees</text><text x="40" y="665" class="x" font-size="15"><tspan class="mono">context_rule_ids</tspan>.</text><text x="432" y="18" class="m tag" font-size="13">Bound to</text><text x="626" y="18" class="m tag" font-size="13" text-anchor="middle">External</text><text x="716" y="18" class="m tag" font-size="13" text-anchor="middle">Delegated</text><line x1="432" y1="28" x2="758" y2="28" class="rule"/><text x="432" y="48" class="x" font-size="15">network</text><path d="M620 40l4 5l8-10" class="gl"/><path d="M710 40l4 5l8-10" class="gl"/><line x1="432" y1="58" x2="758" y2="58" class="rule"/><text x="432" y="78" class="x" font-size="15">nonce (replay)</text><path d="M620 70l4 5l8-10" class="gl"/><path d="M710 70l4 5l8-10" class="gl"/><line x1="432" y1="88" x2="758" y2="88" class="rule"/><text x="432" y="108" class="x" font-size="15">expiration ledger</text><path d="M620 100l4 5l8-10" class="gl"/><path d="M710 100l4 5l8-10" class="gl"/><line x1="432" y1="118" x2="758" y2="118" class="rule"/><text x="432" y="138" class="x" font-size="15">calls and arguments</text><path d="M620 130l4 5l8-10" class="gl"/><path d="M710 130l4 5l8-10" class="gl"/><line x1="432" y1="148" x2="758" y2="148" class="rule"/><text x="432" y="168" class="x" font-size="15">this account</text><path d="M620 160l4 5l8-10" class="gl"/><path d="M710 160l4 5l8-10" class="gl"/><line x1="432" y1="178" x2="758" y2="178" class="rule"/><text x="432" y="198" class="x" font-size="15">selected rule IDs</text><path d="M620 190l4 5l8-10" class="gl"/><path d="M711 188l10 10M721 188l-10 10" class="gl-d"/><line x1="432" y1="208" x2="758" y2="208" class="rule"/><text x="432" y="228" class="x" font-size="15">rule contents</text><path d="M621 218l10 10M631 218l-10 10" class="gl-d"/><path d="M711 218l10 10M721 218l-10 10" class="gl-d"/><line x1="432" y1="238" x2="758" y2="238" class="rule"/><text x="432" y="258" class="x" font-size="15">account revision</text><path d="M621 248l10 10M631 248l-10 10" class="gl-d"/><path d="M711 248l10 10M721 248l-10 10" class="gl-d"/><line x1="432" y1="268" x2="758" y2="268" class="rule"/><path d="M14 30V649H26" class="fl-k" marker-end="url(#perch-ah-k)"/><line x1="14" y1="30" x2="28" y2="30" class="fl-k"/></svg>
