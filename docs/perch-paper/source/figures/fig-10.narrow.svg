<svg class="narrow" viewBox="0 0 340 1684" role="img" aria-labelledby="fig-10-title" aria-describedby="fig-10-text"><rect x="2" y="2" width="336" height="97" rx="6" class="bx"/><text x="14" y="26" class="t" font-size="14">One source</text><text x="14" y="45" class="x" font-size="14"><tspan class="mono">crates/rule-eval</tspan>: about 2,400 lines of</text><text x="14" y="64" class="x" font-size="14">Rust, <tspan class="mono">no_std</tspan>, no dependencies,</text><text x="14" y="83" class="x" font-size="14"><tspan class="mono">forbid(unsafe_code)</tspan></text><path d="M32 99V151" class="fl" marker-end="url(#perch-ah)"/><text x="46" y="139" class="t tag" font-size="13">PROOF PATH</text><rect x="2" y="149" width="336" height="59" rx="6" class="bx"/><rect x="3" y="150" width="10" height="57" class="tr"/><text x="26" y="173" class="x" font-size="14">rustc <tspan class="mono">nightly-2026-09-17</tspan> → MIR</text><text x="26" y="192" class="m tag" font-size="13">TRUSTED</text><path d="M32 208V226" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="228" width="336" height="59" rx="6" class="bx"/><rect x="3" y="229" width="10" height="57" class="tr"/><text x="26" y="252" class="x" font-size="14">Charon <tspan class="mono">7b462d9</tspan> → LLBC</text><text x="26" y="271" class="m tag" font-size="13">TRUSTED</text><path d="M32 287V305" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="307" width="336" height="97" rx="6" class="bx"/><rect x="3" y="308" width="10" height="95" class="tr"/><text x="26" y="331" class="x" font-size="14">Aeneas <tspan class="mono">ab34bd2</tspan> → <tspan class="mono">RuleEval.lean</tspan>:</text><text x="26" y="350" class="x" font-size="14">3,653 generated lines, regenerated and</text><text x="26" y="369" class="x" font-size="14">diffed in CI</text><text x="26" y="388" class="m tag" font-size="13">TRUSTED</text><path d="M32 404V422" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="424" width="336" height="376" rx="8" class="bx bx-pr"/><rect x="14" y="436" width="312" height="116" rx="6" class="bx"/><text x="26" y="460" class="x" font-size="14">Equivalence: <tspan class="mono">authorize_eq</tspan>,</text><text x="26" y="479" class="x" font-size="14"><tspan class="mono">lower_eq</tspan>, <tspan class="mono">lower_scoped_eq</tspan> relate</text><text x="26" y="498" class="x" font-size="14">the translation to the readable</text><text x="26" y="517" class="x" font-size="14">model.</text><text x="26" y="536" class="g tag" font-size="13">PROVED · TRANSLATION ↔ MODEL</text><rect x="14" y="562" width="312" height="78" rx="6" class="bx"/><text x="26" y="586" class="x" font-size="14">Containment, narrowing, trace</text><text x="26" y="605" class="x" font-size="14">inclusion, cap window, budgets</text><text x="26" y="624" class="g tag" font-size="13">PROVED · MODEL + TRANSLATION</text><rect x="14" y="650" width="312" height="78" rx="6" class="bx"/><text x="26" y="674" class="x" font-size="14">Account event model: recovery</text><text x="26" y="693" class="x" font-size="14">invalidation</text><text x="26" y="712" class="g tag" font-size="13">PROVED · ACCOUNT MODEL</text><text x="14" y="752" class="g" font-size="13">Lean v4.35.0 kernel. 940 exported</text><text x="14" y="769" class="g" font-size="13">theorems; axioms within propext,</text><text x="14" y="786" class="g" font-size="13">Quot.sound, Classical.choice.</text><rect x="2" y="818" width="336" height="97" rx="6" class="bx"/><rect x="3" y="819" width="10" height="95" class="tr"/><text x="26" y="842" class="x" font-size="14">Denotations, the document meaning</text><text x="26" y="861" class="x" font-size="14"><tspan class="mono">Doc.allows</tspan> (written from Perch</text><text x="26" y="880" class="x" font-size="14"><tspan class="mono">dff2a73</tspan>), and the Soroban host models</text><text x="26" y="899" class="m tag" font-size="13">TRUSTED SPECIFICATION</text><path d="M308 818V802" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="2" y="929" width="336" height="97" rx="6" class="bx"/><text x="14" y="953" class="x" font-size="14">Theorems about a Soroban host model;</text><text x="14" y="972" class="x" font-size="14">the model is tested against</text><text x="14" y="991" class="x" font-size="14">soroban-env-host 29.0.1 and 30.0.0</text><text x="14" y="1010" class="g tag" font-size="13">PROVED · HOST MODEL</text><rect x="2" y="1040" width="336" height="78" rx="6" class="bx"/><text x="14" y="1064" class="x" font-size="14">Perch <tspan class="mono">formal/</tspan> (Lean v4.33.0): CANON v1</text><text x="14" y="1083" class="x" font-size="14">encoding is injective</text><text x="14" y="1102" class="g tag" font-size="13">PROVED · PERCH CANON PACKAGE</text><rect x="2" y="1138" width="336" height="0.01" rx="8" class="rule"/><text x="46" y="1162" class="t tag" font-size="13">SHIPPING PATH</text><rect x="2" y="1172" width="336" height="59" rx="6" class="bx"/><rect x="3" y="1173" width="10" height="57" class="tr"/><text x="26" y="1196" class="x" font-size="14">rustc 1.97.1 → <tspan class="mono">wasm32v1-none</tspan></text><text x="26" y="1215" class="m tag" font-size="13">TRUSTED</text><path d="M32 1231V1249" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="1251" width="336" height="78" rx="6" class="bx"/><text x="14" y="1275" class="x" font-size="14">Linked into <tspan class="mono">perch_account.wasm</tspan>: <tspan class="mono">lower</tspan></text><text x="14" y="1294" class="x" font-size="14">and <tspan class="mono">lower_scoped</tspan> on install,</text><text x="14" y="1313" class="x" font-size="14"><tspan class="mono">authorize</tspan> in <tspan class="mono">__check_auth</tspan></text><path d="M32 1329V1347" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="1349" width="336" height="59" rx="6" class="bx"/><text x="14" y="1373" class="x" font-size="14">Account shell around it</text><text x="14" y="1392" class="m tag" font-size="13">TESTED</text><rect x="2" y="1426" width="336" height="59" rx="6" class="bx bx-no dash"/><text x="14" y="1450" class="x" font-size="14">Nothing checks this Wasm against the</text><text x="14" y="1469" class="x" font-size="14">translation.</text><path d="M312 1442l10 10M322 1442l-10 10" class="gl-d"/><rect x="2" y="1507" width="336" height="173" rx="6" class="bx"/><text x="14" y="1531" class="x" font-size="14">Bridge: 57 Lean-generated document</text><text x="14" y="1550" class="x" font-size="14">traces run through the account's</text><text x="14" y="1569" class="x" font-size="14"><tspan class="mono">apply_doc</tspan>, <tspan class="mono">apply_scope</tspan> and</text><text x="14" y="1588" class="x" font-size="14"><tspan class="mono">__check_auth</tspan> (native contracts,</text><text x="14" y="1607" class="x" font-size="14">enforcing authorization, the real</text><text x="14" y="1626" class="x" font-size="14">Ed25519 verifier). Rule-core's vectors</text><text x="14" y="1645" class="x" font-size="14">are replayed in Perch CI.</text><text x="14" y="1664" class="m tag" font-size="13">TESTED</text></svg>
