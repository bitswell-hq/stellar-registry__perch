<svg class="wide" viewBox="0 0 760 538" role="img" aria-labelledby="fig-5-title" aria-describedby="fig-5-text"><line x1="64" y1="250" x2="740" y2="250" class="fl-m"/><line x1="64" y1="24" x2="64" y2="250" class="fl-m"/><text x="56" y="255" class="m" font-size="15" text-anchor="end">0</text><text x="56" y="160.833" class="m" font-size="15" text-anchor="end">5</text><text x="56" y="66.6667" class="m" font-size="15" text-anchor="end">10</text><line x1="64" y1="61.66666666666666" x2="740" y2="61.66666666666666" class="fl-d" stroke-dasharray="6 4"/><text x="70" y="80.6667" class="d" font-size="15">limit 10 XLM</text><text x="70" y="18" class="m" font-size="15">XLM in window</text><path d="M362.2 256l6-12M368.2 256l6-12" class="fl-m"/><line x1="212.72" y1="250" x2="212.72" y2="256" class="fl-m"/><text x="212.72" y="273" class="m" font-size="15" text-anchor="middle">t</text><line x1="280.32" y1="250" x2="280.32" y2="256" class="fl-m"/><text x="280.32" y="273" class="m" font-size="15" text-anchor="middle">t+1</text><line x1="510.16" y1="250" x2="510.16" y2="256" class="fl-m"/><text x="510.16" y="273" class="m" font-size="15" text-anchor="middle">t+99</text><line x1="577.76" y1="250" x2="577.76" y2="256" class="fl-m"/><text x="577.76" y="273" class="m" font-size="15" text-anchor="middle">t+100</text><path d="M64 250.0H212.72V137.0H280.32V61.66666666666666H577.76" class="fl"/><path d="M577.76 61.66666666666666V174.66666666666669" class="fl-m" stroke-dasharray="4 3"/><path d="M577.76 174.66666666666669H591.76V80.5H621.76" class="fl"/><rect x="222.72" y="42.83333333333334" width="12" height="94.16666666666666" class="bx-no" fill="none" stroke-dasharray="4 3" style="fill:var(--fig-deny);stroke:var(--deny)"/><rect x="514.1600000000001" y="42.83333333333334" width="12" height="18.833333333333314" style="fill:var(--fig-deny);stroke:var(--deny)" stroke-dasharray="4 3"/><circle cx="200.72" cy="123" r="10" class="bx"/><text x="200.72" y="127.32" class="t" font-size="12" text-anchor="middle">1</text><circle cx="242.72" cy="40.8333" r="10" class="bx"/><text x="242.72" y="45.1533" class="t" font-size="12" text-anchor="middle">2</text><circle cx="292.32" cy="81.6667" r="10" class="bx"/><text x="292.32" y="85.9867" class="t" font-size="12" text-anchor="middle">3</text><circle cx="540.16" cy="40.8333" r="10" class="bx"/><text x="540.16" y="45.1533" class="t" font-size="12" text-anchor="middle">4</text><circle cx="607.76" cy="100.5" r="10" class="bx"/><text x="607.76" y="104.82" class="t" font-size="12" text-anchor="middle">5</text><line x1="145.12" y1="310" x2="510.16" y2="310" class="fl-k"/><circle cx="145.12" cy="310" r="4" style="fill:var(--bg);stroke:var(--key);stroke-width:2"/><circle cx="510.16" cy="310" r="4" style="fill:var(--key)"/><text x="145.12" y="301" class="k" font-size="15">window at t + 99: (t − 1, t + 99]</text><line x1="212.72" y1="350" x2="577.76" y2="350" class="fl-k"/><circle cx="212.72" cy="350" r="4" style="fill:var(--bg);stroke:var(--key);stroke-width:2"/><circle cx="577.76" cy="350" r="4" style="fill:var(--key)"/><text x="212.72" y="341" class="k" font-size="15">window at t + 100: (t, t + 100]</text><circle cx="14" cy="402" r="10" class="bx"/><text x="14" y="406.32" class="t" font-size="12" text-anchor="middle">1</text><text x="32" y="407" class="x" font-size="15">t: +6 accepted: 6 in the window</text><circle cx="14" cy="430" r="10" class="bx"/><text x="14" y="434.32" class="t" font-size="12" text-anchor="middle">2</text><text x="32" y="435" class="x" font-size="15">t: +5 refused: 6 + 5 = 11 &gt; 10, record unchanged</text><circle cx="14" cy="458" r="10" class="bx"/><text x="14" y="462.32" class="t" font-size="12" text-anchor="middle">3</text><text x="32" y="463" class="x" font-size="15">t + 1: +4 accepted: 10 ≤ 10, the limit is inclusive</text><circle cx="14" cy="486" r="10" class="bx"/><text x="14" y="490.32" class="t" font-size="12" text-anchor="middle">4</text><text x="32" y="491" class="x" font-size="15">t + 99: +1 refused: the window (t − 1, t + 99] holds 10</text><circle cx="14" cy="514" r="10" class="bx"/><text x="14" y="518.32" class="t" font-size="12" text-anchor="middle">5</text><text x="32" y="519" class="x" font-size="15">t + 100: the 6 leaves the window, leaving 4; +5 accepted: 9</text></svg>
