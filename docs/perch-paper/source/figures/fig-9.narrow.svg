<svg class="narrow" viewBox="0 0 340 1437" role="img" aria-labelledby="fig-9-title" aria-describedby="fig-9-text"><text x="0" y="18" class="t" font-size="16">(a) Conventional: Perch <tspan class="mono">c135aca</tspan></text><rect x="0" y="30" width="246.301" height="22" rx="11.0" class="pill pill-m"/><text x="123.15" y="45.68" class="m tag" font-size="13" text-anchor="middle">DEPLOYED · TESTNET · MAINNET</text><rect x="0" y="66" width="340" height="41" rx="6" class="bx bx-k"/><text x="12" y="91" class="x" font-size="15">Soroban host → <tspan class="mono">__check_auth</tspan></text><path d="M40 107V127" class="fl" marker-end="url(#perch-ah)"/><rect x="0" y="129" width="340" height="189" rx="6" class="bx"/><text x="12" y="154" class="t" font-size="15">Account</text><text x="12" y="174" class="x" font-size="15">OpenZeppelin library code resolves</text><text x="12" y="194" class="x" font-size="15">the rule ID and checks the rule, its</text><text x="12" y="214" class="x" font-size="15">expiry and its signers. Stores rules,</text><text x="12" y="234" class="x" font-size="15">signers and the document.</text><rect x="34" y="344" width="306" height="78" rx="6" class="bx bx-k"/><text x="46" y="368" class="t" font-size="14">Verifier</text><text x="46" y="387" class="x" font-size="14"><tspan class="mono">verify(digest)</tspan>: checks the</text><text x="46" y="406" class="x" font-size="14">signature.</text><path d="M14 318.0V364.0H32" class="fl-k" marker-end="url(#perch-ah-k)"/><text x="4" y="356" class="k" font-size="13">1</text><rect x="34" y="436" width="306" height="97" rx="6" class="bx bx-hi"/><text x="46" y="460" class="t" font-size="14">Interpreter</text><text x="46" y="479" class="x" font-size="14"><tspan class="mono">enforce</tspan>: functions, arguments and</text><text x="46" y="498" class="x" font-size="14">threshold. Keeps programs by</text><text x="46" y="517" class="x" font-size="14">(account, rule).</text><path d="M14 318.0V456.0H32" class="fl" marker-end="url(#perch-ah)"/><text x="4" y="448" class="a" font-size="13">2</text><rect x="34" y="547" width="306" height="78" rx="6" class="bx bx-hi"/><text x="46" y="571" class="t" font-size="14">Spending limit</text><text x="46" y="590" class="x" font-size="14"><tspan class="mono">enforce</tspan>: the cap. Keeps spending</text><text x="46" y="609" class="x" font-size="14">windows by (account, rule).</text><path d="M14 318.0V567.0H32" class="fl" marker-end="url(#perch-ah)"/><text x="4" y="559" class="a" font-size="13">3</text><text x="0" y="659" class="x" font-size="15">Order: authenticate, then policies</text><text x="0" y="683" class="t" font-size="15">Decision and state: 3 contracts, 3 calls</text><text x="0" y="705" class="m" font-size="14">(call counts read from source)</text><text x="0" y="757" class="t" font-size="16">(b) This paper: Perch <tspan class="mono">f0275f4</tspan></text><rect x="0" y="769" width="75.0752" height="22" rx="11.0" class="pill pill-m"/><text x="37.5376" y="784.68" class="m tag" font-size="13" text-anchor="middle">OPEN PR</text><rect x="83.0752" y="769" width="156.611" height="22" rx="11.0" class="pill pill-m"/><text x="161.381" y="784.68" class="m tag" font-size="13" text-anchor="middle">PREVIEW · TESTNET</text><rect x="0" y="805" width="340" height="41" rx="6" class="bx bx-k"/><text x="12" y="830" class="x" font-size="15">Soroban host → <tspan class="mono">__check_auth</tspan></text><path d="M40 846V866" class="fl" marker-end="url(#perch-ah)"/><rect x="0" y="868" width="340" height="189" rx="6" class="bx"/><text x="12" y="893" class="t" font-size="15">Account</text><rect x="12" y="904" width="316" height="97" rx="6" class="bx bx-pr"/><text x="24" y="928" class="x" font-size="14"><tspan class="mono">rule_eval::check_auth</tspan> (pinned</text><text x="24" y="947" class="x" font-size="14"><tspan class="mono">authorize</tspan>): functions, arguments,</text><text x="24" y="966" class="x" font-size="14">threshold and cap</text><text x="24" y="985" class="g tag" font-size="13">PROVED · MODEL + TRANSLATION</text><text x="12" y="1031" class="x" font-size="14">Stores rules, grants, spending records</text><text x="12" y="1050" class="x" font-size="14">and the generation.</text><rect x="34" y="1083" width="306" height="78" rx="6" class="bx bx-k"/><text x="46" y="1107" class="t" font-size="14">Verifier</text><text x="46" y="1126" class="x" font-size="14"><tspan class="mono">verify(digest)</tspan>: checks the</text><text x="46" y="1145" class="x" font-size="14">signature.</text><path d="M14 1057.0V1103.0H32" class="fl-k" marker-end="url(#perch-ah-k)"/><text x="4" y="1095" class="k" font-size="13">1</text><g opacity=".6"><rect x="34" y="1175" width="306" height="78" rx="6" class="bx dash"/><text x="46" y="1199" class="t" font-size="14">Interpreter</text><text x="46" y="1218" class="x" font-size="14">Address pinned and reported by</text><text x="46" y="1237" class="x" font-size="14"><tspan class="mono">infra()</tspan>. Not called.</text></g><g opacity=".6"><rect x="34" y="1267" width="306" height="78" rx="6" class="bx dash"/><text x="46" y="1291" class="t" font-size="14">Spending limit</text><text x="46" y="1310" class="x" font-size="14">Address pinned and reported by</text><text x="46" y="1329" class="x" font-size="14"><tspan class="mono">infra()</tspan>. Not called.</text></g><text x="0" y="1379" class="x" font-size="15">Order: decide, then authenticate</text><text x="0" y="1403" class="t" font-size="15">Decision and state: 1 contract, 1 call</text><text x="0" y="1425" class="m" font-size="14">(call counts read from source)</text></svg>
