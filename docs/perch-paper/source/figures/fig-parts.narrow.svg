<svg class="narrow" viewBox="0 0 340 1185" role="img" aria-labelledby="fig-1-title" aria-describedby="fig-1-text"><rect x="18" y="2" width="320" height="78" rx="6" class="bx bx-k"/><text x="30" y="26" class="t" font-size="14">Owner, in Nido</text><text x="30" y="45" class="x" font-size="14">Passkey wallet: signs account</text><text x="30" y="64" class="x" font-size="14">documents and grant installs.</text><rect x="18" y="94" width="320" height="59" rx="6" class="bx bx-k"/><text x="30" y="118" class="t" font-size="14">App (Guess the Number)</text><text x="30" y="137" class="x" font-size="14">Signs its calls with its grant key.</text><rect x="2" y="179" width="336" height="78" rx="6" class="bx bx-k"/><text x="14" y="203" class="t" font-size="14">Soroban host</text><text x="14" y="222" class="x" font-size="14">Calls the account's <tspan class="mono">__check_auth</tspan> for</text><text x="14" y="241" class="x" font-size="14">each authorization entry.</text><path d="M18 22H8V177" class="fl-k" marker-end="url(#perch-ah-k)"/><path d="M60 153V177" class="fl-k" marker-end="url(#perch-ah-k)"/><path d="M40 257V281" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="283" width="336" height="279" rx="8" class="bx"/><text x="14" y="309" class="t" font-size="15">Perch account</text><text x="326" y="309" class="m tag" font-size="13" text-anchor="end">TESTED</text><rect x="14" y="323" width="312" height="97" rx="6" class="bx bx-pr"/><text x="26" y="347" class="t" font-size="14"><tspan class="mono">rule_eval</tspan>, a linked library</text><text x="26" y="366" class="x" font-size="14"><tspan class="mono">check_auth</tspan> (pinned <tspan class="mono">authorize</tspan>),</text><text x="26" y="385" class="x" font-size="14"><tspan class="mono">lower</tspan>, <tspan class="mono">lower_scoped</tspan></text><text x="26" y="404" class="g tag" font-size="13">PROVED · MODEL + TRANSLATION</text><rect x="14" y="432" width="312" height="116" rx="0" class="bx"/><text x="26" y="456" class="t" font-size="14">Storage</text><text x="26" y="475" class="x" font-size="14">Account rules, installed grants,</text><text x="26" y="494" class="x" font-size="14">rule tags, spending records, grant</text><text x="26" y="513" class="x" font-size="14">generation, revision, credential</text><text x="26" y="532" class="x" font-size="14">index, account document bytes</text><rect x="24" y="592" width="314" height="116" rx="6" class="bx"/><rect x="25" y="593" width="10" height="114" class="tr"/><text x="48" y="616" class="t" font-size="14">Verifier contracts</text><text x="48" y="635" class="x" font-size="14">Ed25519 and WebAuthn.</text><text x="48" y="654" class="x" font-size="14"><tspan class="mono">verify(digest)</tspan> on every</text><text x="48" y="673" class="x" font-size="14">authorization.</text><text x="48" y="692" class="m tag" font-size="13">TRUSTED</text><path d="M12 562V612H22" class="fl-k" marker-end="url(#perch-ah-k)"/><rect x="24" y="720" width="314" height="116" rx="6" class="bx"/><text x="36" y="744" class="t" font-size="14">Document compiler (stateless)</text><text x="36" y="763" class="x" font-size="14"><tspan class="mono">compile_doc</tspan> on every install.</text><text x="36" y="782" class="x" font-size="14">Resolves verifier names through the</text><text x="36" y="801" class="x" font-size="14"><tspan class="mono">perch/verifiers</tspan> registry.</text><text x="36" y="820" class="m tag" font-size="13">TESTED</text><path d="M12 562V740H22" class="fl" marker-end="url(#perch-ah)"/><rect x="24" y="848" width="314" height="135" rx="6" class="bx"/><text x="36" y="872" class="t" font-size="14">Recovery controller</text><text x="36" y="891" class="x" font-size="14">Its hooks during recovery and on</text><text x="36" y="910" class="x" font-size="14">account-document writes. Guardians</text><text x="36" y="929" class="x" font-size="14">or a ZK factor approve attempts</text><text x="36" y="948" class="x" font-size="14">there.</text><text x="36" y="967" class="m tag" font-size="13">TESTED</text><path d="M12 562V868H22" class="fl" marker-end="url(#perch-ah)"/><g opacity=".65"><rect x="2" y="1001" width="336" height="78" rx="6" class="bx dash"/><text x="14" y="1025" class="x" font-size="14">Interpreter and spending-limit</text><text x="14" y="1044" class="x" font-size="14">contracts: addresses pinned and</text><text x="14" y="1063" class="x" font-size="14">reported by <tspan class="mono">infra()</tspan>, never called.</text></g><text x="2" y="1103" class="m" font-size="13">The account derives each infrastructure</text><text x="2" y="1120" class="m" font-size="13">address on chain as deployer(registry, Wasm</text><text x="2" y="1137" class="m" font-size="13">hash) from inputs compiled into it; no lookup</text><text x="2" y="1154" class="m" font-size="13">or storage slot can change it.</text><text x="2" y="1171" class="m" font-size="13">Owner-authorized <tspan class="mono">execute</tspan> calls are not shown.</text></svg>
