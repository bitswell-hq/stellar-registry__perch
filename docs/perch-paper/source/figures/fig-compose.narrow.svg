<svg class="narrow" viewBox="0 0 340 1730" role="img" aria-labelledby="fig-compose-title" aria-describedby="fig-compose-text"><text x="2" y="16" class="m tag" font-size="14">MODEL</text><text x="2" y="38" class="x" font-size="14">Each request is signed by the app and a co-signer,</text><text x="2" y="55" class="x" font-size="14">and the oracle’s price is above the floor, unless it</text><text x="2" y="72" class="x" font-size="14">says otherwise.</text><text x="2" y="90" class="t" font-size="14">(a) Shaped like a Perch account</text><text x="2" y="107" class="m" font-size="14">one decision point holds the checks and the</text><text x="2" y="124" class="m" font-size="14">window record</text><rect x="2" y="132" width="336" height="156" rx="6" class="bx bx-k"/><text x="14" y="154" class="t" font-size="14">decision point</text><text x="14" y="174" class="x" font-size="14">• recipient pin</text><text x="14" y="191" class="x" font-size="14">• per-call bound</text><text x="14" y="208" class="x" font-size="14">• window cap + its record</text><text x="14" y="225" class="x" font-size="14">• two signers</text><rect x="12" y="233" width="316" height="44" rx="4" class="bx dash"/><text x="22" y="251" class="m" font-size="14">live read: a Perch rule reads nothing outside</text><text x="22" y="268" class="m" font-size="14">the account</text><text x="2" y="318" class="t" font-size="14">(b) Shaped like a policy-composed</text><text x="2" y="335" class="t" font-size="14">OpenZeppelin account</text><text x="2" y="352" class="m" font-size="14">one policy per check, each with its own state, run in</text><text x="2" y="369" class="m" font-size="14">order</text><rect x="2" y="381" width="147.21" height="24" rx="4" class="bx"/><text x="8" y="398" class="x" font-size="14">window cap + record</text><path d="M152.21 393H163.21" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="167.21" y="381" width="91.25" height="24" rx="4" class="bx"/><text x="173.21" y="398" class="x" font-size="14">recipient pin</text><path d="M2 423H13" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="17" y="411" width="105.14" height="24" rx="4" class="bx"/><text x="23" y="428" class="x" font-size="14">per-call bound</text><path d="M125.14 423H136.14" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="140.14" y="411" width="86.34" height="24" rx="4" class="bx"/><text x="146.14" y="428" class="x" font-size="14">two signers</text><path d="M229.48 423H240.48" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="244.48" y="411" width="67.55" height="24" rx="4" class="bx"/><text x="250.48" y="428" class="x" font-size="14">live read</text><text x="2" y="453" class="m" font-size="14">Each policy can be attached, detached or moved;</text><text x="2" y="470" class="m" font-size="14">the first to refuse stops the call.</text><text x="2" y="517" class="t tag" font-size="14">REQUESTS</text><g data-request="1" data-a="accepted" data-b="accepted"><circle cx="13" cy="541" r="11" class="bx"/><text x="13" y="545.9" class="t" font-size="14" text-anchor="middle">1</text><text x="32" y="546" class="t" font-size="14">Pay 6 to the shop</text><rect x="2" y="556" width="336" height="102" rx="6" class="bx"/><text x="10" y="573" class="m tag" font-size="14">(A)</text><rect x="10" y="582" width="101.88" height="24" rx="4" class="bx"/><text x="16" y="599" class="x" font-size="14">decision point</text><path d="M11 623l4 5l8-10" class="gl"/><text x="32" y="628" class="x" font-size="14">accepted; written: the window record, now 6</text><text x="32" y="646" class="x" font-size="14">of 10</text><rect x="2" y="664" width="336" height="132" rx="6" class="bx"/><text x="10" y="681" class="m tag" font-size="14">(B)</text><rect x="10" y="690" width="88.79" height="24" rx="4" class="bx"/><text x="16" y="707" class="x" font-size="14">window cap</text><path d="M101.79 702H112.79" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="116.79" y="690" width="91.25" height="24" rx="4" class="bx"/><text x="122.79" y="707" class="x" font-size="14">recipient pin</text><path d="M10 732H21" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="25" y="720" width="105.14" height="24" rx="4" class="bx"/><text x="31" y="737" class="x" font-size="14">per-call bound</text><path d="M133.14 732H144.14" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="148.14" y="720" width="86.34" height="24" rx="4" class="bx"/><text x="154.14" y="737" class="x" font-size="14">two signers</text><path d="M237.48 732H248.48" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="252.48" y="720" width="67.55" height="24" rx="4" class="bx"/><text x="258.48" y="737" class="x" font-size="14">live read</text><path d="M11 761l4 5l8-10" class="gl"/><text x="32" y="766" class="x" font-size="14">accepted; written: the window cap’s record,</text><text x="32" y="784" class="x" font-size="14">now 6 of 10</text></g><g data-request="2" data-a="refused:window" data-b="refused:window"><circle cx="13" cy="822" r="11" class="bx"/><text x="13" y="826.9" class="t" font-size="14" text-anchor="middle">2</text><text x="32" y="827" class="t" font-size="14">Pay 5 more to the shop</text><rect x="2" y="837" width="336" height="102" rx="6" class="bx"/><text x="10" y="854" class="m tag" font-size="14">(A)</text><rect x="10" y="863" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="16" y="880" class="d" font-size="14">decision point</text><path d="M111.88 860V890" class="fl-d"/><path d="M12 899l10 10M22 899l-10 10" class="gl-d"/><text x="32" y="909" class="d" font-size="14">refused at the decision point: window cap (6</text><text x="32" y="927" class="d" font-size="14">+ 5 = 11 &gt; 10); nothing written</text><rect x="2" y="945" width="336" height="102" rx="6" class="bx"/><text x="10" y="962" class="m tag" font-size="14">(B)</text><rect x="10" y="971" width="88.79" height="24" rx="4" class="bx bx-no"/><text x="16" y="988" class="d" font-size="14">window cap</text><path d="M98.79 968V998" class="fl-d"/><path d="M12 1007l10 10M22 1007l-10 10" class="gl-d"/><text x="32" y="1017" class="d" font-size="14">refused by the window cap (6 + 5 = 11 &gt; 10);</text><text x="32" y="1035" class="d" font-size="14">nothing written</text></g><g data-request="3" data-a="refused:pin" data-b="refused:pin:rolled-back"><circle cx="13" cy="1073" r="11" class="bx"/><text x="13" y="1077.9" class="t" font-size="14" text-anchor="middle">3</text><text x="32" y="1078" class="t" font-size="14">Pay 1 elsewhere</text><rect x="2" y="1088" width="336" height="102" rx="6" class="bx"/><text x="10" y="1105" class="m tag" font-size="14">(A)</text><rect x="10" y="1114" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="16" y="1131" class="d" font-size="14">decision point</text><path d="M111.88 1111V1141" class="fl-d"/><path d="M12 1150l10 10M22 1150l-10 10" class="gl-d"/><text x="32" y="1160" class="d" font-size="14">refused at the decision point: recipient pin;</text><text x="32" y="1178" class="d" font-size="14">nothing written</text><rect x="2" y="1196" width="336" height="102" rx="6" class="bx"/><text x="10" y="1213" class="m tag" font-size="14">(B)</text><rect x="10" y="1222" width="88.79" height="24" rx="4" class="bx"/><text x="16" y="1239" class="x" font-size="14">window cap</text><path d="M101.79 1234H112.79" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="116.79" y="1222" width="91.25" height="24" rx="4" class="bx bx-no"/><text x="122.79" y="1239" class="d" font-size="14">recipient pin</text><path d="M208.04 1219V1249" class="fl-d"/><path d="M12 1258l10 10M22 1258l-10 10" class="gl-d"/><text x="32" y="1268" class="d" font-size="14">refused by the recipient pin after the window</text><text x="32" y="1286" class="d" font-size="14">cap wrote: rolled back with the call</text></g><g data-request="4" data-a="refused:window" data-b="accepted"><circle cx="13" cy="1324" r="11" class="bx"/><text x="13" y="1328.9" class="t" font-size="14" text-anchor="middle">4</text><text x="32" y="1329" class="t" font-size="14">Detach the window cap in (b); pay 6 to the</text><text x="32" y="1346" class="t" font-size="14">shop</text><rect x="2" y="1356" width="336" height="102" rx="6" class="bx"/><text x="10" y="1373" class="m tag" font-size="14">(A)</text><rect x="10" y="1382" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="16" y="1399" class="d" font-size="14">decision point</text><path d="M111.88 1379V1409" class="fl-d"/><path d="M12 1418l10 10M22 1418l-10 10" class="gl-d"/><text x="32" y="1428" class="d" font-size="14">refused at the decision point: window cap (6</text><text x="32" y="1446" class="d" font-size="14">+ 6 = 12 &gt; 10); nothing written</text><rect x="2" y="1464" width="336" height="150" rx="6" class="bx"/><text x="10" y="1481" class="m tag" font-size="14">(B)</text><rect x="10" y="1490" width="91.25" height="24" rx="4" class="bx"/><text x="16" y="1507" class="x" font-size="14">recipient pin</text><path d="M104.25 1502H115.25" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="119.25" y="1490" width="105.14" height="24" rx="4" class="bx"/><text x="125.25" y="1507" class="x" font-size="14">per-call bound</text><path d="M227.39 1502H238.39" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="242.39" y="1490" width="86.34" height="24" rx="4" class="bx"/><text x="248.39" y="1507" class="x" font-size="14">two signers</text><path d="M10 1532H21" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="25" y="1520" width="67.55" height="24" rx="4" class="bx"/><text x="31" y="1537" class="x" font-size="14">live read</text><path d="M11 1561l4 5l8-10" class="gl"/><text x="32" y="1566" class="x" font-size="14">accepted; no window cap attached, so</text><text x="32" y="1584" class="x" font-size="14">nothing written; moved in the last 100</text><text x="32" y="1602" class="x" font-size="14">ledgers: 12, over 10</text></g><text x="2" y="1646" class="x" font-size="14">(a) Window at most 10: holds while the rule exists.</text><text x="2" y="1666" class="x" font-size="14">(b) Window at most 10: holds while the window-cap</text><text x="2" y="1683" class="x" font-size="14">policy is attached.</text><text x="2" y="1703" class="t" font-size="15">Composition buys flexibility; one decision</text><text x="2" y="1722" class="t" font-size="15">point gives one place to check.</text></svg>
