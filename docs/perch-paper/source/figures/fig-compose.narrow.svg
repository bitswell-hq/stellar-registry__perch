<svg class="narrow" viewBox="0 0 340 1730" role="img" aria-labelledby="fig-compose-title" aria-describedby="fig-compose-text"><text x="2" y="16" class="m tag" font-size="14">MODEL</text><text x="2" y="38" class="x" font-size="14">Each request is signed by the app and a co-signer,</text><text x="2" y="55" class="x" font-size="14">and the oracle’s price is above the floor, unless it</text><text x="2" y="72" class="x" font-size="14">says otherwise.</text><text x="2" y="90" class="t" font-size="14">(a) Shaped like a Perch account</text><text x="2" y="107" class="m" font-size="14">one decision point holds the checks and the</text><text x="2" y="124" class="m" font-size="14">window record</text><rect x="2" y="132" width="336" height="139" rx="6" class="bx bx-k"/><text x="14" y="154" class="t" font-size="14">decision point</text><text x="14" y="174" class="x" font-size="14">• recipient pin</text><text x="14" y="191" class="x" font-size="14">• two signers</text><text x="14" y="208" class="x" font-size="14">• window cap + its record</text><rect x="12" y="216" width="316" height="44" rx="4" class="bx dash"/><text x="22" y="234" class="m" font-size="14">per-call bound and live read: a Perch rule</text><text x="22" y="251" class="m" font-size="14">has neither</text><text x="2" y="301" class="t" font-size="14">(b) Shaped like a policy-composed</text><text x="2" y="318" class="t" font-size="14">OpenZeppelin account</text><text x="2" y="335" class="m" font-size="14">one policy per check, each with its own state, run in</text><text x="2" y="352" class="m" font-size="14">order</text><rect x="2" y="364" width="147.21" height="24" rx="4" class="bx"/><text x="8" y="381" class="x" font-size="14">window cap + record</text><path d="M152.21 376H163.21" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="167.21" y="364" width="91.25" height="24" rx="4" class="bx"/><text x="173.21" y="381" class="x" font-size="14">recipient pin</text><path d="M2 406H13" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="17" y="394" width="105.14" height="24" rx="4" class="bx"/><text x="23" y="411" class="x" font-size="14">per-call bound</text><path d="M125.14 406H136.14" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="140.14" y="394" width="86.34" height="24" rx="4" class="bx"/><text x="146.14" y="411" class="x" font-size="14">two signers</text><path d="M229.48 406H240.48" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="244.48" y="394" width="67.55" height="24" rx="4" class="bx"/><text x="250.48" y="411" class="x" font-size="14">live read</text><text x="2" y="436" class="m" font-size="14">Each policy can be attached, detached or moved;</text><text x="2" y="453" class="m" font-size="14">the first to refuse stops the call.</text><text x="2" y="500" class="t tag" font-size="14">REQUESTS</text><g data-request="1" data-a="accepted" data-b="accepted"><circle cx="13" cy="524" r="11" class="bx"/><text x="13" y="528.9" class="t" font-size="14" text-anchor="middle">1</text><text x="32" y="529" class="t" font-size="14">Pay 6 to the shop</text><rect x="2" y="539" width="336" height="102" rx="6" class="bx"/><text x="10" y="556" class="m tag" font-size="14">(A)</text><rect x="10" y="565" width="101.88" height="24" rx="4" class="bx"/><text x="16" y="582" class="x" font-size="14">decision point</text><path d="M11 606l4 5l8-10" class="gl"/><text x="32" y="611" class="x" font-size="14">accepted; written: the window record, now 6</text><text x="32" y="629" class="x" font-size="14">of 10</text><rect x="2" y="647" width="336" height="132" rx="6" class="bx"/><text x="10" y="664" class="m tag" font-size="14">(B)</text><rect x="10" y="673" width="88.79" height="24" rx="4" class="bx"/><text x="16" y="690" class="x" font-size="14">window cap</text><path d="M101.79 685H112.79" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="116.79" y="673" width="91.25" height="24" rx="4" class="bx"/><text x="122.79" y="690" class="x" font-size="14">recipient pin</text><path d="M10 715H21" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="25" y="703" width="105.14" height="24" rx="4" class="bx"/><text x="31" y="720" class="x" font-size="14">per-call bound</text><path d="M133.14 715H144.14" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="148.14" y="703" width="86.34" height="24" rx="4" class="bx"/><text x="154.14" y="720" class="x" font-size="14">two signers</text><path d="M237.48 715H248.48" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="252.48" y="703" width="67.55" height="24" rx="4" class="bx"/><text x="258.48" y="720" class="x" font-size="14">live read</text><path d="M11 744l4 5l8-10" class="gl"/><text x="32" y="749" class="x" font-size="14">accepted; written: the window cap’s record,</text><text x="32" y="767" class="x" font-size="14">now 6 of 10</text></g><g data-request="2" data-a="refused:window" data-b="refused:window"><circle cx="13" cy="805" r="11" class="bx"/><text x="13" y="809.9" class="t" font-size="14" text-anchor="middle">2</text><text x="32" y="810" class="t" font-size="14">Pay 5 more to the shop</text><rect x="2" y="820" width="336" height="102" rx="6" class="bx"/><text x="10" y="837" class="m tag" font-size="14">(A)</text><rect x="10" y="846" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="16" y="863" class="d" font-size="14">decision point</text><path d="M111.88 843V873" class="fl-d"/><path d="M12 882l10 10M22 882l-10 10" class="gl-d"/><text x="32" y="892" class="d" font-size="14">refused at the decision point: window cap (6</text><text x="32" y="910" class="d" font-size="14">+ 5 = 11 &gt; 10); nothing written</text><rect x="2" y="928" width="336" height="102" rx="6" class="bx"/><text x="10" y="945" class="m tag" font-size="14">(B)</text><rect x="10" y="954" width="88.79" height="24" rx="4" class="bx bx-no"/><text x="16" y="971" class="d" font-size="14">window cap</text><path d="M98.79 951V981" class="fl-d"/><path d="M12 990l10 10M22 990l-10 10" class="gl-d"/><text x="32" y="1000" class="d" font-size="14">refused by the window cap (6 + 5 = 11 &gt; 10);</text><text x="32" y="1018" class="d" font-size="14">nothing written</text></g><g data-request="3" data-a="refused:pin" data-b="refused:pin:rolled-back"><circle cx="13" cy="1056" r="11" class="bx"/><text x="13" y="1060.9" class="t" font-size="14" text-anchor="middle">3</text><text x="32" y="1061" class="t" font-size="14">Pay 1 elsewhere</text><rect x="2" y="1071" width="336" height="102" rx="6" class="bx"/><text x="10" y="1088" class="m tag" font-size="14">(A)</text><rect x="10" y="1097" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="16" y="1114" class="d" font-size="14">decision point</text><path d="M111.88 1094V1124" class="fl-d"/><path d="M12 1133l10 10M22 1133l-10 10" class="gl-d"/><text x="32" y="1143" class="d" font-size="14">refused at the decision point: recipient pin;</text><text x="32" y="1161" class="d" font-size="14">nothing written</text><rect x="2" y="1179" width="336" height="102" rx="6" class="bx"/><text x="10" y="1196" class="m tag" font-size="14">(B)</text><rect x="10" y="1205" width="88.79" height="24" rx="4" class="bx"/><text x="16" y="1222" class="x" font-size="14">window cap</text><path d="M101.79 1217H112.79" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="116.79" y="1205" width="91.25" height="24" rx="4" class="bx bx-no"/><text x="122.79" y="1222" class="d" font-size="14">recipient pin</text><path d="M208.04 1202V1232" class="fl-d"/><path d="M12 1241l10 10M22 1241l-10 10" class="gl-d"/><text x="32" y="1251" class="d" font-size="14">refused by the recipient pin after the window</text><text x="32" y="1269" class="d" font-size="14">cap wrote: rolled back with the call</text></g><g data-request="4" data-a="refused:window" data-b="accepted"><circle cx="13" cy="1307" r="11" class="bx"/><text x="13" y="1311.9" class="t" font-size="14" text-anchor="middle">4</text><text x="32" y="1312" class="t" font-size="14">Detach the window cap in (b); pay 6 to the</text><text x="32" y="1329" class="t" font-size="14">shop</text><rect x="2" y="1339" width="336" height="102" rx="6" class="bx"/><text x="10" y="1356" class="m tag" font-size="14">(A)</text><rect x="10" y="1365" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="16" y="1382" class="d" font-size="14">decision point</text><path d="M111.88 1362V1392" class="fl-d"/><path d="M12 1401l10 10M22 1401l-10 10" class="gl-d"/><text x="32" y="1411" class="d" font-size="14">refused at the decision point: window cap (6</text><text x="32" y="1429" class="d" font-size="14">+ 6 = 12 &gt; 10); nothing written</text><rect x="2" y="1447" width="336" height="150" rx="6" class="bx"/><text x="10" y="1464" class="m tag" font-size="14">(B)</text><rect x="10" y="1473" width="91.25" height="24" rx="4" class="bx"/><text x="16" y="1490" class="x" font-size="14">recipient pin</text><path d="M104.25 1485H115.25" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="119.25" y="1473" width="105.14" height="24" rx="4" class="bx"/><text x="125.25" y="1490" class="x" font-size="14">per-call bound</text><path d="M227.39 1485H238.39" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="242.39" y="1473" width="86.34" height="24" rx="4" class="bx"/><text x="248.39" y="1490" class="x" font-size="14">two signers</text><path d="M10 1515H21" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="25" y="1503" width="67.55" height="24" rx="4" class="bx"/><text x="31" y="1520" class="x" font-size="14">live read</text><path d="M11 1544l4 5l8-10" class="gl"/><text x="32" y="1549" class="x" font-size="14">accepted; no window cap attached, so</text><text x="32" y="1567" class="x" font-size="14">nothing written; moved in the last 100</text><text x="32" y="1585" class="x" font-size="14">ledgers: 12, over 10</text></g><text x="2" y="1629" class="x" font-size="14">(a) Window at most 10: holds while the rule keeps</text><text x="2" y="1646" class="x" font-size="14">its cap.</text><text x="2" y="1666" class="x" font-size="14">(b) Window at most 10: holds while the window-cap</text><text x="2" y="1683" class="x" font-size="14">policy is attached.</text><text x="2" y="1703" class="t" font-size="15">Composition buys flexibility; one decision</text><text x="2" y="1722" class="t" font-size="15">point gives one place to check.</text></svg>
