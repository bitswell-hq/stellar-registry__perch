<svg class="narrow" viewBox="0 0 340 1799" role="img" aria-labelledby="fig-6-title" aria-describedby="fig-6-text"><rect x="2" y="2" width="336" height="113" rx="6" class="bx bx-k"/><text x="14" y="23" class="x" font-size="14">Soroban host →</text><text x="14" y="42" class="x" font-size="14"><tspan class="mono">__check_auth(signature_payload, auth</tspan></text><text x="14" y="61" class="x" font-size="14"><tspan class="mono">payload, contexts)</tspan>. The auth payload</text><text x="14" y="80" class="x" font-size="14">carries <tspan class="mono">context_rule_ids</tspan> and the</text><text x="14" y="99" class="x" font-size="14">claimed signers.</text><text x="2" y="143" class="m tag" font-size="13">ACCOUNT SHELL · TESTED</text><rect x="32" y="159" width="304" height="78" rx="6" class="bx"/><text x="44" y="183" class="x" font-size="14">A context calls a reserved hook on</text><text x="44" y="202" class="x" font-size="14">any contract: <tspan class="mono">install</tspan>, <tspan class="mono">uninstall</tspan>,</text><text x="44" y="221" class="x" font-size="14"><tspan class="mono">enforce</tspan> or an <tspan class="mono">rcv_*</tspan> name?</text><circle cx="14" cy="181" r="11" class="bx"/><text x="14" y="185.68" class="t" font-size="13" text-anchor="middle">1</text><path d="M44 237V258H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="245" width="167.6" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="262.55" class="d" font-size="13">ReservedFunction · 1</text><rect x="32" y="295" width="304" height="116" rx="6" class="bx"/><text x="44" y="319" class="x" font-size="14">Recovery completion? Exactly one</text><text x="44" y="338" class="x" font-size="14"><tspan class="mono">apply_account_doc</tspan> (exported</text><text x="44" y="357" class="x" font-size="14"><tspan class="mono">apply_doc</tspan>) context on this</text><text x="44" y="376" class="x" font-size="14">account, selecting the recovery</text><text x="44" y="395" class="x" font-size="14">rule. Classification only.</text><circle cx="14" cy="317" r="11" class="bx"/><text x="14" y="321.68" class="t" font-size="13" text-anchor="middle">2</text><path d="M14 192V305" class="fl" marker-end="url(#perch-ah)"/><rect x="32" y="437" width="304" height="78" rx="6" class="bx"/><text x="44" y="461" class="x" font-size="14">Frozen by an authorized <tspan class="mono">Protected</tspan></text><text x="44" y="480" class="x" font-size="14">attempt, and this is not its</text><text x="44" y="499" class="x" font-size="14">completion?</text><circle cx="14" cy="459" r="11" class="bx"/><text x="14" y="463.68" class="t" font-size="13" text-anchor="middle">3</text><path d="M14 328V447" class="fl" marker-end="url(#perch-ah)"/><path d="M44 515V536H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="523" width="145.76" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="540.55" class="d" font-size="13">AccountFrozen · 2</text><rect x="32" y="573" width="304" height="78" rx="6" class="bx"/><text x="44" y="597" class="x" font-size="14">A selected grant rule calls the</text><text x="44" y="616" class="x" font-size="14">recovery controller, its ZK adapter</text><text x="44" y="635" class="x" font-size="14">or its ZK pool?</text><circle cx="14" cy="595" r="11" class="bx"/><text x="14" y="599.68" class="t" font-size="13" text-anchor="middle">4</text><path d="M14 470V583" class="fl" marker-end="url(#perch-ah)"/><path d="M44 651V672H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="659" width="160.32" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="676.55" class="d" font-size="13">ScopeEscalation · 4</text><rect x="62" y="691" width="274" height="154" rx="6" class="bx bx-hi"/><text x="74" y="715" class="x" font-size="14">A completion leaves here. The</text><text x="74" y="734" class="x" font-size="14">recovery controller's</text><text x="74" y="753" class="x" font-size="14"><tspan class="mono">rcv_complete</tspan> checks the exact</text><text x="74" y="772" class="x" font-size="14">approved document bytes and the</text><text x="74" y="791" class="x" font-size="14">completion window: authorized</text><text x="74" y="810" class="x" font-size="14">with no signatures, or refused.</text><text x="74" y="829" class="m tag" font-size="13">TESTED · RECOVERY CONTROLLER</text><path d="M44 651V711H60" class="fl" marker-end="url(#perch-ah)"/><rect x="32" y="871" width="304" height="78" rx="6" class="bx"/><text x="44" y="895" class="x" font-size="14">bound = SHA-256(domain ‖ account ‖</text><text x="44" y="914" class="x" font-size="14">signature payload), with domain</text><text x="44" y="933" class="x" font-size="14"><tspan class="mono">"perch/account/auth-addr-v1"</tspan></text><circle cx="14" cy="893" r="11" class="bx"/><text x="14" y="897.68" class="t" font-size="13" text-anchor="middle">5</text><path d="M14 606V881" class="fl" marker-end="url(#perch-ah)"/><rect x="32" y="975" width="304" height="78" rx="6" class="bx"/><text x="44" y="999" class="x" font-size="14">Resolve the selected rule IDs to</text><text x="44" y="1018" class="x" font-size="14">stored rules and spending records;</text><text x="44" y="1037" class="x" font-size="14">convert the contexts.</text><circle cx="14" cy="997" r="11" class="bx"/><text x="14" y="1001.68" class="t" font-size="13" text-anchor="middle">6</text><path d="M14 904V985" class="fl" marker-end="url(#perch-ah)"/><path d="M44 1053V1074H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1061" width="211.28" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="1078.55" class="d" font-size="13">ContextRuleNotFound · 3000</text><path d="M44 1053V1106H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1093" width="160.32" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="1110.55" class="d" font-size="13">RuleEvalRefused · 5</text><rect x="32" y="1143" width="304" height="135" rx="6" class="bx bx-pr"/><text x="44" y="1167" class="x" font-size="14"><tspan class="mono">rule_eval::check_auth</tspan> (pinned:</text><text x="44" y="1186" class="x" font-size="14"><tspan class="mono">rule_eval::authorize</tspan>). Rules,</text><text x="44" y="1205" class="x" font-size="14">records, contexts, choices,</text><text x="44" y="1224" class="x" font-size="14">signers, ledger, generation → next</text><text x="44" y="1243" class="x" font-size="14">records. No storage, no signatures.</text><text x="44" y="1262" class="g tag" font-size="13">PROVED · MODEL + TRANSLATION</text><circle cx="14" cy="1165" r="11" class="bx"/><text x="14" y="1169.68" class="t" font-size="13" text-anchor="middle">7</text><path d="M14 1008V1153" class="fl" marker-end="url(#perch-ah)"/><path d="M44 1278V1299H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1286" width="123.92" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="1303.55" class="d" font-size="13">StaleScope · 3</text><path d="M44 1278V1331H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1318" width="160.32" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="1335.55" class="d" font-size="13">RuleEvalRefused · 5</text><rect x="32" y="1368" width="304" height="78" rx="6" class="bx"/><text x="44" y="1392" class="x" font-size="14">digest = SHA-256(bound ‖</text><text x="44" y="1411" class="x" font-size="14">XDR(selected rule IDs)). For each</text><text x="44" y="1430" class="x" font-size="14">claimed signer:</text><circle cx="14" cy="1390" r="11" class="bx"/><text x="14" y="1394.68" class="t" font-size="13" text-anchor="middle">8</text><path d="M14 1176V1378" class="fl" marker-end="url(#perch-ah)"/><rect x="62" y="1454" width="274" height="154" rx="6" class="bx"/><rect x="63" y="1455" width="10" height="152" class="tr"/><text x="86" y="1478" class="x" font-size="14">External:</text><text x="86" y="1497" class="x" font-size="14"><tspan class="mono">verifier.verify(digest)</tspan>. A</text><text x="86" y="1516" class="x" font-size="14">failure traps with</text><text x="86" y="1535" class="x" font-size="14"><tspan class="mono">ExternalVerificationFailed</tspan></text><text x="86" y="1554" class="x" font-size="14">(3003), and the host reverts</text><text x="86" y="1573" class="x" font-size="14">the transaction.</text><text x="86" y="1592" class="m tag" font-size="13">TRUSTED · VERIFIER</text><path d="M44 1446V1474H60" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="62" y="1616" width="274" height="78" rx="6" class="bx bx-k"/><text x="74" y="1640" class="x" font-size="14">Delegated (CAP-0071): the</text><text x="74" y="1659" class="x" font-size="14">host's <tspan class="mono">delegate_auth</tspan>. Rule IDs</text><text x="74" y="1678" class="x" font-size="14">are not bound.</text><path d="M44 1446V1636H60" class="fl-k" marker-end="url(#perch-ah-k)"/><rect x="32" y="1720" width="304" height="59" rx="6" class="bx"/><text x="44" y="1744" class="x" font-size="14">Store each capped spending record</text><text x="44" y="1763" class="x" font-size="14">that changed. Authorized.</text><circle cx="14" cy="1742" r="11" class="bx"/><text x="14" y="1746.68" class="t" font-size="13" text-anchor="middle">9</text><path d="M14 1401V1730" class="fl" marker-end="url(#perch-ah)"/></svg>
