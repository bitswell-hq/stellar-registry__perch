<svg class="narrow" viewBox="0 0 340 1668" role="img" aria-labelledby="fig-check-auth-title" aria-describedby="fig-check-auth-text"><rect x="2" y="2" width="336" height="119" rx="6" class="bx bx-k"/><text x="14" y="29" class="x" font-size="14">Soroban host →</text><text x="14" y="48" class="x" font-size="14"><tspan class="mono">__check_auth(signature_payload, auth</tspan></text><text x="14" y="67" class="x" font-size="14"><tspan class="mono">payload, contexts)</tspan>. The auth payload</text><text x="14" y="86" class="x" font-size="14">carries <tspan class="mono">context_rule_ids</tspan> and the claimed</text><text x="14" y="105" class="x" font-size="14">signers.</text><text x="2" y="149" class="m tag" font-size="14">ACCOUNT SHELL · TESTED</text><g><rect x="32" y="165" width="306" height="81" rx="6" class="bx"/><text x="44" y="192" class="x" font-size="14">A context calls a reserved hook on any</text><text x="44" y="211" class="x" font-size="14">contract: <tspan class="mono">install</tspan>, <tspan class="mono">uninstall</tspan>, <tspan class="mono">enforce</tspan></text><text x="44" y="230" class="x" font-size="14">or an <tspan class="mono">rcv_*</tspan> name?</text><circle cx="14" cy="185" r="11" class="bx"/><text x="14" y="189.9" class="t" font-size="14" text-anchor="middle">1</text><path d="M44 246V267H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="254" width="161.71" height="26" rx="13" class="pill pill-d"/><text x="73" y="272.04" class="d" font-size="14">ReservedFunction · 1</text></g><g><rect x="32" y="290" width="306" height="119" rx="6" class="bx"/><text x="44" y="317" class="x" font-size="14">Recovery completion? Exactly one</text><text x="44" y="336" class="x" font-size="14"><tspan class="mono">apply_account_doc</tspan> (exported</text><text x="44" y="355" class="x" font-size="14"><tspan class="mono">apply_doc</tspan>) context on this account,</text><text x="44" y="374" class="x" font-size="14">selecting the recovery rule. Classification</text><text x="44" y="393" class="x" font-size="14">only.</text><circle cx="14" cy="310" r="11" class="bx"/><text x="14" y="314.9" class="t" font-size="14" text-anchor="middle">2</text><path d="M14 196V297" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="32" y="421" width="306" height="62" rx="6" class="bx"/><text x="44" y="448" class="x" font-size="14">Frozen by an authorized <tspan class="mono">Protected</tspan></text><text x="44" y="467" class="x" font-size="14">attempt, and this is not its completion?</text><circle cx="14" cy="441" r="11" class="bx"/><text x="14" y="445.9" class="t" font-size="14" text-anchor="middle">3</text><path d="M14 321V428" class="fl" marker-end="url(#perch-ah)"/><path d="M44 483V504H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="491" width="141.29" height="26" rx="13" class="pill pill-d"/><text x="73" y="509.04" class="d" font-size="14">AccountFrozen · 2</text></g><g><rect x="32" y="527" width="306" height="62" rx="6" class="bx"/><text x="44" y="554" class="x" font-size="14">A selected grant rule calls the recovery</text><text x="44" y="573" class="x" font-size="14">controller, its ZK adapter or its ZK pool?</text><circle cx="14" cy="547" r="11" class="bx"/><text x="14" y="551.9" class="t" font-size="14" text-anchor="middle">4</text><path d="M14 452V534" class="fl" marker-end="url(#perch-ah)"/><path d="M44 589V610H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="597" width="151.92" height="26" rx="13" class="pill pill-d"/><text x="73" y="615.04" class="d" font-size="14">ScopeEscalation · 4</text></g><g><rect x="48" y="633" width="290" height="157" rx="6" class="bx bx-hi"/><text x="60" y="660" class="x" font-size="14">A completion leaves here. The recovery</text><text x="60" y="679" class="x" font-size="14">controller's <tspan class="mono">rcv_complete</tspan> checks the</text><text x="60" y="698" class="x" font-size="14">exact approved document bytes and the</text><text x="60" y="717" class="x" font-size="14">completion window: authorized with no</text><text x="60" y="736" class="x" font-size="14">signatures, or refused.</text><text x="60" y="755" class="m tag" font-size="14">TESTED · RECOVERY</text><text x="60" y="774" class="m tag" font-size="14">CONTROLLER</text><path d="M30 625V653H46" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="32" y="804" width="306" height="81" rx="6" class="bx"/><text x="44" y="831" class="x" font-size="14">bound = SHA-256(domain ‖ account ‖</text><text x="44" y="850" class="x" font-size="14">signature payload), with domain</text><text x="44" y="869" class="x" font-size="14"><tspan class="mono">"perch/account/auth-addr-v1"</tspan></text><circle cx="14" cy="824" r="11" class="bx"/><text x="14" y="828.9" class="t" font-size="14" text-anchor="middle">5</text><path d="M14 558V811" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="32" y="897" width="306" height="81" rx="6" class="bx"/><text x="44" y="924" class="x" font-size="14">Resolve the selected rule IDs to stored</text><text x="44" y="943" class="x" font-size="14">rules and spending records; convert the</text><text x="44" y="962" class="x" font-size="14">contexts.</text><circle cx="14" cy="917" r="11" class="bx"/><text x="14" y="921.9" class="t" font-size="14" text-anchor="middle">6</text><path d="M14 835V904" class="fl" marker-end="url(#perch-ah)"/><path d="M44 978V999H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="986" width="212.38" height="26" rx="13" class="pill pill-d"/><text x="73" y="1004.04" class="d" font-size="14">ContextRuleNotFound · 3000</text><path d="M44 978V1031H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1018" width="155.99" height="26" rx="13" class="pill pill-d"/><text x="73" y="1036.04" class="d" font-size="14">RuleEvalRefused · 5</text></g><g><rect x="32" y="1054" width="306" height="119" rx="6" class="bx bx-pr"/><rect x="36" y="1058" width="298" height="111" rx="2" class="fl-g"/><text x="44" y="1081" class="x" font-size="14"><tspan class="mono">rule_eval::authorize</tspan>: rules, records,</text><text x="44" y="1100" class="x" font-size="14">contexts, choices, signers, ledger,</text><text x="44" y="1119" class="x" font-size="14">generation → next records. No storage, no</text><text x="44" y="1138" class="x" font-size="14">signatures.</text><text x="44" y="1157" class="g tag" font-size="14">PROVED · MODEL + TRANSLATION</text><circle cx="14" cy="1074" r="11" class="bx"/><text x="14" y="1078.9" class="t" font-size="14" text-anchor="middle">7</text><path d="M14 928V1061" class="fl" marker-end="url(#perch-ah)"/><path d="M44 1173V1194H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1181" width="117.61" height="26" rx="13" class="pill pill-d"/><text x="73" y="1199.04" class="d" font-size="14">StaleScope · 3</text><path d="M44 1173V1226H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1213" width="155.99" height="26" rx="13" class="pill pill-d"/><text x="73" y="1231.04" class="d" font-size="14">RuleEvalRefused · 5</text></g><g><rect x="32" y="1249" width="306" height="62" rx="6" class="bx"/><text x="44" y="1276" class="x" font-size="14">digest = SHA-256(bound ‖ XDR(selected</text><text x="44" y="1295" class="x" font-size="14">rule IDs)). For each claimed signer:</text><circle cx="14" cy="1269" r="11" class="bx"/><text x="14" y="1273.9" class="t" font-size="14" text-anchor="middle">8</text><path d="M14 1085V1256" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="48" y="1323" width="290" height="138" rx="6" class="bx"/><rect x="51" y="1326" width="11" height="132" rx="0" class="tr"/><text x="74" y="1350" class="x" font-size="14">External:</text><text x="74" y="1369" class="x" font-size="14"><tspan class="mono">verifier.verify(digest)</tspan>. A bad</text><text x="74" y="1388" class="x" font-size="14">signature traps in the verifier;</text><text x="74" y="1407" class="x" font-size="14"><tspan class="mono">ExternalVerificationFailed</tspan></text><text x="74" y="1426" class="x" font-size="14">(3003) only if a verifier returns false.</text><text x="74" y="1445" class="m tag" font-size="14">TRUSTED · VERIFIER</text><path d="M30 1315V1343H46" class="fl-m" marker-end="url(#perch-ah-m)"/><path d="M62 1461V1482H76" class="fl-d" marker-end="url(#perch-bar)"/><rect x="78" y="1469" width="205.81" height="26" rx="13" class="pill pill-d"/><text x="89" y="1487.04" class="d" font-size="14">verifier traps (bad signature)</text><rect x="48" y="1505" width="290" height="81" rx="6" class="bx bx-k"/><text x="60" y="1532" class="x" font-size="14">Delegated (CAP-0071): the host's</text><text x="60" y="1551" class="x" font-size="14"><tspan class="mono">delegate_auth</tspan>. Rule IDs are not</text><text x="60" y="1570" class="x" font-size="14">bound.</text><path d="M30 1343V1525H46" class="fl-k" marker-end="url(#perch-ah-k)"/></g><g><rect x="32" y="1602" width="306" height="62" rx="6" class="bx"/><text x="44" y="1629" class="x" font-size="14">Store each capped spending record that</text><text x="44" y="1648" class="x" font-size="14">changed. Authorized.</text><circle cx="14" cy="1622" r="11" class="bx"/><text x="14" y="1626.9" class="t" font-size="14" text-anchor="middle">9</text><path d="M14 1280V1609" class="fl" marker-end="url(#perch-ah)"/></g></svg>
