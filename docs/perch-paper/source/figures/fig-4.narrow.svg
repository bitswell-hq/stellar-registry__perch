<svg class="narrow" viewBox="0 0 340 1523" role="img" aria-labelledby="fig-4-title" aria-describedby="fig-4-text"><rect x="2" y="2" width="336" height="59" rx="6" class="bx bx-k"/><text x="14" y="26" class="x" font-size="14">Owner → <tspan class="mono">apply_grant(id, json)</tspan>,</text><text x="14" y="45" class="x" font-size="14">exported as <tspan class="mono">apply_scope</tspan></text><text x="2" y="91" class="m tag" font-size="13">ACCOUNT · TESTED</text><rect x="32" y="107" width="304" height="59" rx="6" class="bx"/><text x="44" y="131" class="x" font-size="14">Owner authorization. The account</text><text x="44" y="150" class="x" font-size="14">calls <tspan class="mono">compile_doc(json)</tspan>.</text><circle cx="14" cy="129" r="11" class="bx"/><text x="14" y="133.68" class="t" font-size="13" text-anchor="middle">1</text><rect x="62" y="174" width="274" height="192" rx="6" class="bx"/><text x="74" y="198" class="x" font-size="14">Document compiler (stateless):</text><text x="74" y="217" class="x" font-size="14">parses and validates the JSON,</text><text x="74" y="236" class="x" font-size="14">resolves verifier names through</text><text x="74" y="255" class="x" font-size="14">the <tspan class="mono">perch/verifiers</tspan> registry,</text><text x="74" y="274" class="x" font-size="14">and returns canonical bytes,</text><text x="74" y="293" class="x" font-size="14"><tspan class="mono">doc_hash</tspan>, the model, credential</text><text x="74" y="312" class="x" font-size="14">fingerprints and a normal-form</text><text x="74" y="331" class="x" font-size="14">flag.</text><text x="74" y="350" class="m tag" font-size="13">TESTED · DOC COMPILER</text><path d="M44 166V194H60" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="32" y="392" width="304" height="97" rx="6" class="bx"/><text x="44" y="416" class="x" font-size="14">Recovery configuration, a</text><text x="44" y="435" class="x" font-size="14">self-admin rule, or a target that</text><text x="44" y="454" class="x" font-size="14">is the account or a member of its</text><text x="44" y="473" class="x" font-size="14">excluded set?</text><circle cx="14" cy="414" r="11" class="bx"/><text x="14" y="418.68" class="t" font-size="13" text-anchor="middle">2</text><path d="M14 140V402" class="fl" marker-end="url(#perch-ah)"/><path d="M44 489V510H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="497" width="131.2" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="514.55" class="d" font-size="13">ScopeEscalation</text><rect x="32" y="547" width="304" height="97" rx="6" class="bx"/><text x="44" y="571" class="x" font-size="14">Read the excluded set X from</text><text x="44" y="590" class="x" font-size="14">storage: the adopted recovery</text><text x="44" y="609" class="x" font-size="14">controller, its ZK adapter and its</text><text x="44" y="628" class="x" font-size="14">ZK pool.</text><circle cx="14" cy="569" r="11" class="bx"/><text x="14" y="573.68" class="t" font-size="13" text-anchor="middle">3</text><path d="M14 425V557" class="fl" marker-end="url(#perch-ah)"/><rect x="32" y="670" width="304" height="135" rx="6" class="bx bx-pr"/><text x="44" y="694" class="x" font-size="14"><tspan class="mono">lower_scoped(model, A, X, g)</tspan></text><text x="44" y="713" class="x" font-size="14">lowers the rules under account A,</text><text x="44" y="732" class="x" font-size="14">excluded set X and the current</text><text x="44" y="751" class="x" font-size="14">generation g. It refuses any target</text><text x="44" y="770" class="x" font-size="14">in {A} ∪ X.</text><text x="44" y="789" class="g tag" font-size="13">PROVED · MODEL + TRANSLATION</text><circle cx="14" cy="692" r="11" class="bx"/><text x="14" y="696.68" class="t" font-size="13" text-anchor="middle">4</text><path d="M14 580V680" class="fl" marker-end="url(#perch-ah)"/><path d="M44 805V826H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="813" width="131.2" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="830.55" class="d" font-size="13">ScopeEscalation</text><path d="M44 805V858H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="845" width="116.64" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="862.55" class="d" font-size="13">UnguardedRule</text><rect x="32" y="895" width="304" height="78" rx="6" class="bx"/><text x="44" y="919" class="x" font-size="14">Normal form? One spelling per</text><text x="44" y="938" class="x" font-size="14">meaning, no expired rule, no</text><text x="44" y="957" class="x" font-size="14">argument that names the account.</text><circle cx="14" cy="917" r="11" class="bx"/><text x="14" y="921.68" class="t" font-size="13" text-anchor="middle">5</text><path d="M14 703V905" class="fl" marker-end="url(#perch-ah)"/><path d="M44 973V994H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="981" width="116.64" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="998.55" class="d" font-size="13">NotNormalForm</text><rect x="32" y="1031" width="304" height="59" rx="6" class="bx"/><text x="44" y="1055" class="x" font-size="14">A credential that recovery revoked,</text><text x="44" y="1074" class="x" font-size="14">or one that a stale grant named?</text><circle cx="14" cy="1053" r="11" class="bx"/><text x="14" y="1057.68" class="t" font-size="13" text-anchor="middle">6</text><path d="M14 928V1041" class="fl" marker-end="url(#perch-ah)"/><path d="M44 1090V1111H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1098" width="145.76" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="1115.55" class="d" font-size="13">RevokedCredential</text><path d="M44 1090V1143H60" class="fl-d" marker-end="url(#perch-bar)"/><rect x="62" y="1130" width="131.2" height="26" rx="13.0" class="pill pill-d"/><text x="73" y="1147.55" class="d" font-size="13">WipedCredential</text><rect x="32" y="1180" width="304" height="97" rx="6" class="bx"/><text x="44" y="1204" class="x" font-size="14">Reconcile rules by name with the</text><text x="44" y="1223" class="x" font-size="14">stored grant. Drop the spending</text><text x="44" y="1242" class="x" font-size="14">records of rules that were removed</text><text x="44" y="1261" class="x" font-size="14">or changed.</text><circle cx="14" cy="1202" r="11" class="bx"/><text x="14" y="1206.68" class="t" font-size="13" text-anchor="middle">7</text><path d="M14 1064V1190" class="fl" marker-end="url(#perch-ah)"/><rect x="32" y="1303" width="304" height="97" rx="6" class="bx"/><text x="44" y="1327" class="x" font-size="14">Store the grant record {generation</text><text x="44" y="1346" class="x" font-size="14">g, <tspan class="mono">doc_hash</tspan>, rules, signer IDs,</text><text x="44" y="1365" class="x" font-size="14">verifier names}, its rule tags and</text><text x="44" y="1384" class="x" font-size="14">its index entry.</text><circle cx="14" cy="1325" r="11" class="bx"/><text x="14" y="1329.68" class="t" font-size="13" text-anchor="middle">8</text><path d="M14 1213V1313" class="fl" marker-end="url(#perch-ah)"/><rect x="62" y="1408" width="274" height="97" rx="6" class="bx"/><text x="74" y="1432" class="x" font-size="14">Spending records are separate</text><text x="74" y="1451" class="x" font-size="14">entries, one per capped rule</text><text x="74" y="1470" class="x" font-size="14">ID. Only authorization writes</text><text x="74" y="1489" class="x" font-size="14">them (Figure 6, step 9).</text><path d="M44 1400V1428H60" class="fl-m" marker-end="url(#perch-ah-m)"/></svg>
