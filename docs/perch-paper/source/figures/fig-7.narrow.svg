<svg class="narrow" viewBox="0 0 340 970" role="img" aria-labelledby="fig-7-title" aria-describedby="fig-7-text"><rect x="22" y="2" width="316" height="135" rx="6" class="bx bx-k"/><text x="34" y="26" class="t" font-size="14">Host</text><text x="34" y="45" class="x" font-size="14">signature payload = SHA-256 of the</text><text x="34" y="64" class="x" font-size="14">XDR preimage: network ID, nonce,</text><text x="34" y="83" class="x" font-size="14">expiration ledger, invocation tree.</text><text x="34" y="102" class="x" font-size="14">Entries with delegates also include</text><text x="34" y="121" class="x" font-size="14">the account address.</text><path d="M62 137V157" class="fl" marker-end="url(#perch-ah)"/><rect x="22" y="159" width="316" height="116" rx="6" class="bx"/><text x="34" y="183" class="t" font-size="14">Account</text><text x="34" y="202" class="x" font-size="14">bound = SHA-256(domain ‖ 32-byte</text><text x="34" y="221" class="x" font-size="14">contract ID ‖ signature payload),</text><text x="34" y="240" class="x" font-size="14">with domain</text><text x="34" y="259" class="x" font-size="14"><tspan class="mono">"perch/account/auth-addr-v1"</tspan></text><path d="M62 275V295" class="fl" marker-end="url(#perch-ah)"/><rect x="22" y="297" width="316" height="78" rx="6" class="bx"/><text x="34" y="321" class="t" font-size="14">Account</text><text x="34" y="340" class="x" font-size="14">digest = SHA-256(bound ‖</text><text x="34" y="359" class="x" font-size="14">XDR(<tspan class="mono">context_rule_ids</tspan>))</text><path d="M62 375V395" class="fl" marker-end="url(#perch-ah)"/><rect x="22" y="397" width="316" height="116" rx="6" class="bx"/><rect x="23" y="398" width="10" height="114" class="tr"/><text x="46" y="421" class="t" font-size="14">External signer</text><text x="46" y="440" class="x" font-size="14">Ed25519 signs the digest. A</text><text x="46" y="459" class="x" font-size="14">WebAuthn passkey signs with</text><text x="46" y="478" class="x" font-size="14">challenge = base64url(digest).</text><text x="46" y="497" class="m tag" font-size="13">TRUSTED · VERIFIER</text><rect x="22" y="541" width="316" height="135" rx="6" class="bx bx-k"/><text x="34" y="565" class="t" font-size="14">Delegated signer (CAP-0071)</text><text x="34" y="584" class="x" font-size="14">Approves, through the host's</text><text x="34" y="603" class="x" font-size="14"><tspan class="mono">delegate_auth</tspan>, the host's payload</text><text x="34" y="622" class="x" font-size="14">for this account's entry, which is</text><text x="34" y="641" class="x" font-size="14">bound to the account. It never sees</text><text x="34" y="660" class="x" font-size="14"><tspan class="mono">context_rule_ids</tspan>.</text><text x="2" y="716" class="m tag" font-size="13">Bound to</text><text x="206" y="716" class="m tag" font-size="13" text-anchor="middle">External</text><text x="296" y="716" class="m tag" font-size="13" text-anchor="middle">Delegated</text><line x1="2" y1="726" x2="338" y2="726" class="rule"/><text x="2" y="746" class="x" font-size="14">network</text><path d="M200 738l4 5l8-10" class="gl"/><path d="M290 738l4 5l8-10" class="gl"/><line x1="2" y1="756" x2="338" y2="756" class="rule"/><text x="2" y="776" class="x" font-size="14">nonce (replay)</text><path d="M200 768l4 5l8-10" class="gl"/><path d="M290 768l4 5l8-10" class="gl"/><line x1="2" y1="786" x2="338" y2="786" class="rule"/><text x="2" y="806" class="x" font-size="14">expiration ledger</text><path d="M200 798l4 5l8-10" class="gl"/><path d="M290 798l4 5l8-10" class="gl"/><line x1="2" y1="816" x2="338" y2="816" class="rule"/><text x="2" y="836" class="x" font-size="14">calls and arguments</text><path d="M200 828l4 5l8-10" class="gl"/><path d="M290 828l4 5l8-10" class="gl"/><line x1="2" y1="846" x2="338" y2="846" class="rule"/><text x="2" y="866" class="x" font-size="14">this account</text><path d="M200 858l4 5l8-10" class="gl"/><path d="M290 858l4 5l8-10" class="gl"/><line x1="2" y1="876" x2="338" y2="876" class="rule"/><text x="2" y="896" class="x" font-size="14">selected rule IDs</text><path d="M200 888l4 5l8-10" class="gl"/><path d="M291 886l10 10M301 886l-10 10" class="gl-d"/><line x1="2" y1="906" x2="338" y2="906" class="rule"/><text x="2" y="926" class="x" font-size="14">rule contents</text><path d="M201 916l10 10M211 916l-10 10" class="gl-d"/><path d="M291 916l10 10M301 916l-10 10" class="gl-d"/><line x1="2" y1="936" x2="338" y2="936" class="rule"/><text x="2" y="956" class="x" font-size="14">account revision</text><path d="M201 946l10 10M211 946l-10 10" class="gl-d"/><path d="M291 946l10 10M301 946l-10 10" class="gl-d"/><line x1="2" y1="966" x2="338" y2="966" class="rule"/><path d="M10 30V644H20" class="fl-k" marker-end="url(#perch-ah-k)"/><line x1="10" y1="30" x2="22" y2="30" class="fl-k"/></svg>
