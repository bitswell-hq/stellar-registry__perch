<svg class="wide" viewBox="0 0 760 659" role="img" aria-labelledby="fig-1-title" aria-describedby="fig-1-text"><rect x="2" y="2" width="242" height="101" rx="6" class="bx bx-k"/><text x="14" y="27" class="t" font-size="15">Owner, in Nido</text><text x="14" y="47" class="x" font-size="15">Passkey wallet: signs</text><text x="14" y="67" class="x" font-size="15">account documents and</text><text x="14" y="87" class="x" font-size="15">grant installs.</text><rect x="258" y="2" width="242" height="101" rx="6" class="bx bx-k"/><text x="270" y="27" class="t" font-size="15">App (Guess the Number)</text><text x="270" y="47" class="x" font-size="15">Signs its calls with its</text><text x="270" y="67" class="x" font-size="15">grant key.</text><rect x="514" y="2" width="242" height="101" rx="6" class="bx bx-k"/><text x="526" y="27" class="t" font-size="15">Soroban host</text><text x="526" y="47" class="x" font-size="15">Calls the account's</text><text x="526" y="67" class="x" font-size="15"><tspan class="mono">__check_auth</tspan> for each</text><text x="526" y="87" class="x" font-size="15">authorization entry.</text><path d="M500 52.5H512" class="fl-k" marker-end="url(#perch-ah-k)"/><path d="M123 103V117H580V105" class="fl-k" marker-end="url(#perch-ah-k)"/><path d="M680 103V139" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="141" width="756" height="175" rx="8" class="bx"/><text x="14" y="167" class="t" font-size="16">Perch account, <tspan class="mono">perch_account.wasm</tspan></text><text x="746" y="167" class="m tag" font-size="13" text-anchor="end">TESTED</text><rect x="14" y="181" width="360" height="121" rx="6" class="bx bx-pr"/><text x="26" y="206" class="t" font-size="15"><tspan class="mono">rule_eval</tspan>, a linked library</text><text x="26" y="226" class="x" font-size="15"><tspan class="mono">check_auth</tspan> (pinned <tspan class="mono">authorize</tspan>), <tspan class="mono">lower</tspan>,</text><text x="26" y="246" class="x" font-size="15"><tspan class="mono">lower_scoped</tspan></text><text x="26" y="266" class="g tag" font-size="13">PROVED · MODEL + TRANSLATION</text><rect x="386" y="181" width="360" height="121" rx="0" class="bx"/><text x="398" y="206" class="t" font-size="15">Storage</text><text x="398" y="226" class="x" font-size="15">Account rules, installed grants, rule</text><text x="398" y="246" class="x" font-size="15">tags, spending records, grant</text><text x="398" y="266" class="x" font-size="15">generation, revision, credential index,</text><text x="398" y="286" class="x" font-size="15">account document bytes</text><rect x="2" y="346" width="242" height="161" rx="6" class="bx"/><rect x="3" y="347" width="10" height="159" class="tr"/><text x="26" y="371" class="t" font-size="15">Verifier contracts</text><text x="26" y="391" class="x" font-size="15">Ed25519 and WebAuthn.</text><text x="26" y="411" class="x" font-size="15"><tspan class="mono">verify(digest)</tspan> on every</text><text x="26" y="431" class="x" font-size="15">authorization.</text><text x="26" y="451" class="m tag" font-size="13">TRUSTED</text><path d="M123 316V344" class="fl-k" marker-end="url(#perch-ah-k)"/><rect x="258" y="346" width="242" height="161" rx="6" class="bx"/><text x="270" y="371" class="t" font-size="15">Document compiler (stateless)</text><text x="270" y="391" class="x" font-size="15"><tspan class="mono">compile_doc</tspan> on every</text><text x="270" y="411" class="x" font-size="15">install. Resolves</text><text x="270" y="431" class="x" font-size="15">verifier names through</text><text x="270" y="451" class="x" font-size="15">the <tspan class="mono">perch/verifiers</tspan></text><text x="270" y="471" class="x" font-size="15">registry.</text><text x="270" y="491" class="m tag" font-size="13">TESTED</text><path d="M379 316V344" class="fl" marker-end="url(#perch-ah)"/><rect x="514" y="346" width="242" height="161" rx="6" class="bx"/><text x="526" y="371" class="t" font-size="15">Recovery controller</text><text x="526" y="391" class="x" font-size="15">Its hooks during recovery</text><text x="526" y="411" class="x" font-size="15">and on account-document</text><text x="526" y="431" class="x" font-size="15">writes. Guardians or a ZK</text><text x="526" y="451" class="x" font-size="15">factor approve attempts</text><text x="526" y="471" class="x" font-size="15">there.</text><text x="526" y="491" class="m tag" font-size="13">TESTED</text><path d="M635 316V344" class="fl" marker-end="url(#perch-ah)"/><g opacity=".65"><rect x="2" y="525" width="756" height="61" rx="6" class="bx dash"/><text x="14" y="550" class="x" font-size="15">Interpreter and spending-limit contracts: addresses pinned and reported by <tspan class="mono">infra()</tspan>,</text><text x="14" y="570" class="x" font-size="15">never called.</text></g><text x="2" y="611" class="m" font-size="14">The account derives each infrastructure address on chain as deployer(registry, Wasm hash) from</text><text x="2" y="630" class="m" font-size="14">inputs compiled into it; no lookup or storage slot can change it. Owner-authorized <tspan class="mono">execute</tspan></text><text x="2" y="649" class="m" font-size="14">calls are not shown.</text></svg>
