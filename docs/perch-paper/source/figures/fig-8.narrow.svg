<svg class="narrow" viewBox="0 0 340 869" role="img" aria-labelledby="fig-8-title" aria-describedby="fig-8-text"><text x="2" y="16" class="m tag" font-size="13">#</text><text x="30" y="16" class="m tag" font-size="13">Command and result</text><text x="268" y="16" class="m tag" font-size="13" text-anchor="middle">Grant</text><text x="318" y="16" class="m tag" font-size="13" text-anchor="middle">Rec.</text><line x1="0" y1="24" x2="340" y2="24" class="rule"/><text x="2" y="42" class="m" font-size="14">5</text><text x="30" y="42" class="x" font-size="14">Collect grant 1</text><path d="M31 52l10 10M41 52l-10 10" class="gl-d"/><text x="50" y="61" class="d" font-size="14"><tspan class="mono">ScopeLive</tspan> · #59: still current</text><text x="268" y="42" class="x" font-size="14" text-anchor="middle">0</text><text x="318" y="42" class="x" font-size="14" text-anchor="middle">0</text><line x1="0" y1="68" x2="340" y2="68" class="rule"/><text x="2" y="86" class="m" font-size="14">6</text><text x="30" y="86" class="x" font-size="14">Enroll recovery</text><path d="M30 99l4 5l8-10" class="gl"/><text x="50" y="105" class="x" font-size="14">Loss, two guardians</text><text x="268" y="86" class="x" font-size="14" text-anchor="middle">0</text><text x="318" y="86" class="x" font-size="14" text-anchor="middle">1</text><line x1="0" y1="112" x2="340" y2="112" class="rule"/><text x="2" y="130" class="m" font-size="14">7</text><text x="30" y="130" class="x" font-size="14">Begin an attempt</text><path d="M30 143l4 5l8-10" class="gl"/><text x="50" y="149" class="x" font-size="14">collecting approvals</text><text x="268" y="130" class="x" font-size="14" text-anchor="middle">0</text><text x="318" y="130" class="x" font-size="14" text-anchor="middle">1</text><line x1="0" y1="156" x2="340" y2="156" class="rule"/><text x="2" y="174" class="m" font-size="14">8</text><text x="30" y="174" class="x" font-size="14">Guardian 1 approves</text><path d="M30 187l4 5l8-10" class="gl"/><text x="50" y="193" class="x" font-size="14"></text><text x="268" y="174" class="x" font-size="14" text-anchor="middle">0</text><text x="318" y="174" class="x" font-size="14" text-anchor="middle">1</text><line x1="0" y1="200" x2="340" y2="200" class="rule"/><text x="2" y="218" class="m" font-size="14">9</text><text x="30" y="218" class="x" font-size="14">Guardian 2 approves</text><path d="M30 231l4 5l8-10" class="gl"/><text x="50" y="237" class="x" font-size="14">authorized at ledger A</text><text x="268" y="218" class="x" font-size="14" text-anchor="middle">0</text><text x="318" y="218" class="x" font-size="14" text-anchor="middle">1</text><line x1="0" y1="244" x2="340" y2="244" class="rule"/><text x="2" y="262" class="m" font-size="14">10</text><text x="30" y="262" class="x" font-size="14">Complete</text><path d="M31 272l10 10M41 272l-10 10" class="gl-d"/><text x="50" y="281" class="d" font-size="14"><tspan class="mono">NotExecutableYet</tspan> · 6 (controller)</text><text x="268" y="262" class="x" font-size="14" text-anchor="middle">0</text><text x="318" y="262" class="x" font-size="14" text-anchor="middle">1</text><line x1="0" y1="288" x2="340" y2="288" class="rule"/><text x="2" y="306" class="m" font-size="14">11</text><text x="30" y="306" class="x" font-size="14">Advance 11 ledgers</text><text x="50" y="325" class="x" font-size="14">no transaction</text><text x="268" y="306" class="x" font-size="14" text-anchor="middle">0</text><text x="318" y="306" class="x" font-size="14" text-anchor="middle">1</text><rect x="0" y="332" width="340" height="44" rx="0" class="band"/><line x1="0" y1="332" x2="340" y2="332" class="rule"/><text x="2" y="350" class="m" font-size="14">12</text><text x="30" y="350" class="x" font-size="14">Complete</text><path d="M30 363l4 5l8-10" class="gl"/><text x="50" y="369" class="x" font-size="14">one transaction in [A + 10, A + 110)</text><text x="268" y="350" class="a" font-size="14" text-anchor="middle">1</text><text x="318" y="350" class="x" font-size="14" text-anchor="middle">2</text><line x1="0" y1="376" x2="340" y2="376" class="rule"/><text x="2" y="394" class="m" font-size="14">13</text><text x="30" y="394" class="x" font-size="14">Spend 1 with grant 1</text><path d="M31 404l10 10M41 404l-10 10" class="gl-d"/><text x="50" y="413" class="d" font-size="14"><tspan class="mono">StaleScope</tspan> · 3: stored, stale</text><text x="268" y="394" class="a" font-size="14" text-anchor="middle">1</text><text x="318" y="394" class="x" font-size="14" text-anchor="middle">2</text><line x1="0" y1="420" x2="340" y2="420" class="rule"/><text x="2" y="438" class="m" font-size="14">14</text><text x="30" y="438" class="x" font-size="14">Old owner installs</text><path d="M31 448l10 10M41 448l-10 10" class="gl-d"/><text x="50" y="457" class="d" font-size="14"><tspan class="mono">RuleEvalRefused</tspan> · 5</text><text x="268" y="438" class="a" font-size="14" text-anchor="middle">1</text><text x="318" y="438" class="x" font-size="14" text-anchor="middle">2</text><line x1="0" y1="464" x2="340" y2="464" class="rule"/><text x="2" y="482" class="m" font-size="14">15</text><text x="30" y="482" class="x" font-size="14">Re-grant the wiped key</text><path d="M31 492l10 10M41 492l-10 10" class="gl-d"/><text x="50" y="501" class="d" font-size="14"><tspan class="mono">WipedCredential</tspan> · #60</text><text x="268" y="482" class="a" font-size="14" text-anchor="middle">1</text><text x="318" y="482" class="x" font-size="14" text-anchor="middle">2</text><line x1="0" y1="508" x2="340" y2="508" class="rule"/><text x="2" y="526" class="m" font-size="14">16</text><text x="30" y="526" class="x" font-size="14">Install a fresh credential</text><path d="M30 539l4 5l8-10" class="gl"/><text x="50" y="545" class="x" font-size="14">grant 2, new owner signs</text><text x="268" y="526" class="a" font-size="14" text-anchor="middle">1</text><text x="318" y="526" class="x" font-size="14" text-anchor="middle">2</text><line x1="0" y1="552" x2="340" y2="552" class="rule"/><text x="2" y="570" class="m" font-size="14">17</text><text x="30" y="570" class="x" font-size="14">Spend 2 with grant 2</text><path d="M30 583l4 5l8-10" class="gl"/><text x="50" y="589" class="x" font-size="14">balance 94 → 92</text><text x="268" y="570" class="a" font-size="14" text-anchor="middle">1</text><text x="318" y="570" class="x" font-size="14" text-anchor="middle">2</text><line x1="0" y1="596" x2="340" y2="596" class="rule"/><text x="2" y="614" class="m" font-size="14">18</text><text x="30" y="614" class="x" font-size="14">Collect grant 1</text><path d="M30 627l4 5l8-10" class="gl"/><text x="50" y="633" class="x" font-size="14">anyone; credential index kept</text><text x="268" y="614" class="a" font-size="14" text-anchor="middle">1</text><text x="318" y="614" class="x" font-size="14" text-anchor="middle">2</text><line x1="0" y1="640" x2="340" y2="640" class="rule"/><rect x="2" y="654" width="336" height="211" rx="6" class="bx"/><text x="14" y="678" class="x" font-size="14">Command 12 in one transaction: the</text><text x="14" y="697" class="x" font-size="14">target document is applied, the grant</text><text x="14" y="716" class="x" font-size="14">generation goes 0 → 1, the replaced</text><text x="14" y="735" class="x" font-size="14">owner key is revoked, any freeze is</text><text x="14" y="754" class="x" font-size="14">lifted, any pending upgrade is dropped,</text><text x="14" y="773" class="x" font-size="14">and the recovery generation and the</text><text x="14" y="792" class="x" font-size="14">revision advance. Grant 1 stops</text><text x="14" y="811" class="x" font-size="14">authorizing here; its storage remains</text><text x="14" y="830" class="x" font-size="14">until command 18, and its key stays</text><text x="14" y="849" class="x" font-size="14">barred after that.</text></svg>
