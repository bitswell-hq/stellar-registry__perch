<svg class="wide" viewBox="0 0 760 1075" role="img" aria-labelledby="fig-4-title" aria-describedby="fig-4-text"><rect x="2" y="2" width="756" height="41" rx="6" class="bx bx-k"/><text x="14" y="27" class="x" font-size="15">Owner → <tspan class="mono">apply_grant(id, json)</tspan>, exported as <tspan class="mono">apply_scope</tspan></text><text x="2" y="73" class="m tag" font-size="13">ACCOUNT · TESTED</text><rect x="50" y="89" width="450" height="61" rx="6" class="bx"/><text x="62" y="114" class="x" font-size="15">Owner authorization. The account calls</text><text x="62" y="134" class="x" font-size="15"><tspan class="mono">compile_doc(json)</tspan>.</text><circle cx="26" cy="111" r="11" class="bx"/><text x="26" y="115.68" class="t" font-size="13" text-anchor="middle">1</text><rect x="90" y="158" width="666" height="101" rx="6" class="bx"/><text x="102" y="183" class="x" font-size="15">Document compiler (stateless): parses and validates the JSON, resolves</text><text x="102" y="203" class="x" font-size="15">verifier names through the <tspan class="mono">perch/verifiers</tspan> registry, and returns canonical</text><text x="102" y="223" class="x" font-size="15">bytes, <tspan class="mono">doc_hash</tspan>, the model, credential fingerprints and a normal-form flag.</text><text x="102" y="243" class="m tag" font-size="13">TESTED · DOC COMPILER</text><path d="M70 150.0V178H88" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="50" y="285" width="450" height="81" rx="6" class="bx"/><text x="62" y="310" class="x" font-size="15">Recovery configuration, a self-admin rule, or a</text><text x="62" y="330" class="x" font-size="15">target that is the account or a member of its</text><text x="62" y="350" class="x" font-size="15">excluded set?</text><circle cx="26" cy="307" r="11" class="bx"/><text x="26" y="311.68" class="t" font-size="13" text-anchor="middle">2</text><path d="M26 122.0V295.0" class="fl" marker-end="url(#perch-ah)"/><path d="M500 325.5H524V325.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="312.5" width="139.6" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="330.4" class="d" font-size="14">ScopeEscalation</text><rect x="50" y="392" width="450" height="81" rx="6" class="bx"/><text x="62" y="417" class="x" font-size="15">Read the excluded set X from storage: the adopted</text><text x="62" y="437" class="x" font-size="15">recovery controller, its ZK adapter and its ZK</text><text x="62" y="457" class="x" font-size="15">pool.</text><circle cx="26" cy="414" r="11" class="bx"/><text x="26" y="418.68" class="t" font-size="13" text-anchor="middle">3</text><path d="M26 318.0V402.0" class="fl" marker-end="url(#perch-ah)"/><rect x="50" y="499" width="450" height="101" rx="6" class="bx bx-pr"/><text x="62" y="524" class="x" font-size="15"><tspan class="mono">lower_scoped(model, A, X, g)</tspan> lowers the rules</text><text x="62" y="544" class="x" font-size="15">under account A, excluded set X and the current</text><text x="62" y="564" class="x" font-size="15">generation g. It refuses any target in {A} ∪ X.</text><text x="62" y="584" class="g tag" font-size="13">PROVED · MODEL + TRANSLATION</text><circle cx="26" cy="521" r="11" class="bx"/><text x="26" y="525.68" class="t" font-size="13" text-anchor="middle">4</text><path d="M26 425.0V509.0" class="fl" marker-end="url(#perch-ah)"/><path d="M500 532.5H524V532.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="519.5" width="139.6" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="537.4" class="d" font-size="14">ScopeEscalation</text><path d="M500 566.5H524V566.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="553.5" width="123.92" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="571.4" class="d" font-size="14">UnguardedRule</text><rect x="50" y="626" width="450" height="61" rx="6" class="bx"/><text x="62" y="651" class="x" font-size="15">Normal form? One spelling per meaning, no expired</text><text x="62" y="671" class="x" font-size="15">rule, no argument that names the account.</text><circle cx="26" cy="648" r="11" class="bx"/><text x="26" y="652.68" class="t" font-size="13" text-anchor="middle">5</text><path d="M26 532.0V636.0" class="fl" marker-end="url(#perch-ah)"/><path d="M500 656.5H524V656.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="643.5" width="123.92" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="661.4" class="d" font-size="14">NotNormalForm</text><rect x="50" y="713" width="450" height="61" rx="6" class="bx"/><text x="62" y="738" class="x" font-size="15">A credential that recovery revoked, or one that a</text><text x="62" y="758" class="x" font-size="15">stale grant named?</text><circle cx="26" cy="735" r="11" class="bx"/><text x="26" y="739.68" class="t" font-size="13" text-anchor="middle">6</text><path d="M26 659.0V723.0" class="fl" marker-end="url(#perch-ah)"/><path d="M500 726.5H524V726.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="713.5" width="155.28" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="731.4" class="d" font-size="14">RevokedCredential</text><path d="M500 760.5H524V760.5H538" class="fl-d" marker-end="url(#perch-bar)"/><rect x="540" y="747.5" width="139.6" height="26" rx="13.0" class="pill pill-d"/><text x="551" y="765.4" class="d" font-size="14">WipedCredential</text><rect x="50" y="800" width="450" height="81" rx="6" class="bx"/><text x="62" y="825" class="x" font-size="15">Reconcile rules by name with the stored grant.</text><text x="62" y="845" class="x" font-size="15">Drop the spending records of rules that were</text><text x="62" y="865" class="x" font-size="15">removed or changed.</text><circle cx="26" cy="822" r="11" class="bx"/><text x="26" y="826.68" class="t" font-size="13" text-anchor="middle">7</text><path d="M26 746.0V810.0" class="fl" marker-end="url(#perch-ah)"/><rect x="50" y="907" width="450" height="81" rx="6" class="bx"/><text x="62" y="932" class="x" font-size="15">Store the grant record {generation g, <tspan class="mono">doc_hash</tspan>,</text><text x="62" y="952" class="x" font-size="15">rules, signer IDs, verifier names}, its rule tags</text><text x="62" y="972" class="x" font-size="15">and its index entry.</text><circle cx="26" cy="929" r="11" class="bx"/><text x="26" y="933.68" class="t" font-size="13" text-anchor="middle">8</text><path d="M26 833.0V917.0" class="fl" marker-end="url(#perch-ah)"/><rect x="90" y="996" width="666" height="61" rx="6" class="bx"/><text x="102" y="1021" class="x" font-size="15">Spending records are separate entries, one per capped rule ID. Only</text><text x="102" y="1041" class="x" font-size="15">authorization writes them (Figure 6, step 9).</text><path d="M70 988.0V1016H88" class="fl-m" marker-end="url(#perch-ah-m)"/></svg>
