<svg class="narrow" viewBox="0 0 340 1426" role="img" aria-labelledby="fig-auth-path-title" aria-describedby="fig-auth-path-text" data-recorded-trap="Error(Crypto, InvalidInput)" data-recorded-command="11"><text x="2" y="16" class="t tag" font-size="14">THE ACCOUNT’S STAGES AND EXITS</text><text x="2" y="36" class="m" font-size="14">MODEL. Rules: <tspan class="mono">shop</tspan> (XLM to the shop, 10 per</text><text x="2" y="53" class="m" font-size="14">100 ledgers; its window holds 6), and the game</text><text x="2" y="70" class="m" font-size="14">grant’s <tspan class="mono">guess</tspan> and <tspan class="mono">spend</tspan> (XLM, 2 per 100). Signed</text><text x="2" y="87" class="m" font-size="14">by the app’s key unless noted.</text><g data-stage="host"><rect x="2" y="101" width="336" height="92" rx="6" class="bx"/><rect x="5" y="104" width="11" height="86" rx="0" class="tr"/><text x="28" y="125" class="t" font-size="14">1  Host call</text><text x="28" y="145" class="x" font-size="14">The host calls <tspan class="mono">__check_auth</tspan>: the</text><text x="28" y="163" class="x" font-size="14">contexts, one named rule per context, the</text><text x="28" y="181" class="x" font-size="14">claimed signers.</text><g data-mark="pass" data-print="no" class="off"><path d="M312 119l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 114l10 10M323 114l-10 10" class="gl-d"/><path d="M327 112V126" class="fl-d"/></g></g><path d="M42 195V213" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-stage="guards"><rect x="2" y="217" width="336" height="129" rx="6" class="bx"/><text x="14" y="241" class="t" font-size="14">2  Guards</text><text x="14" y="261" class="x" font-size="14">Reserved hook names, a frozen account, a</text><text x="14" y="279" class="x" font-size="14">grant rule on an adopted recovery contract.</text><text x="14" y="300" class="m" font-size="14">exits: <tspan class="mono">ReservedFunction</tspan> (1);</text><text x="14" y="317" class="m" font-size="14"><tspan class="mono">AccountFrozen</tspan> (2); <tspan class="mono">ScopeEscalation</tspan> (4); a</text><text x="14" y="334" class="m" font-size="14">completion: decided by the recovery controller</text><g data-mark="pass" data-print="no" class="off"><path d="M312 235l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 230l10 10M323 230l-10 10" class="gl-d"/><path d="M327 228V242" class="fl-d"/></g></g><path d="M42 348V366" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-stage="select"><rect x="2" y="370" width="336" height="95" rx="6" class="bx"/><text x="14" y="394" class="t" font-size="14">3  Select rules</text><text x="14" y="414" class="x" font-size="14">Look up each named rule and its spending</text><text x="14" y="432" class="x" font-size="14">record; no search.</text><text x="14" y="453" class="m" font-size="14">exits: <tspan class="mono">ContextRuleNotFound</tspan> (3000)</text><g data-mark="pass" data-print="no" class="off"><path d="M312 388l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 383l10 10M323 383l-10 10" class="gl-d"/><path d="M327 381V395" class="fl-d"/></g></g><path d="M42 467V485" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-stage="decide"><rect x="2" y="489" width="336" height="274" rx="6" class="bx bx-pr"/><rect x="6" y="493" width="328" height="266" rx="2" class="fl-g"/><text x="14" y="513" class="t" font-size="14">4  Decide</text><text x="14" y="533" class="x" font-size="14"><tspan class="mono">rule_eval::authorize</tspan>: no storage read,</text><text x="14" y="551" class="x" font-size="14">no signature checked.</text><text x="14" y="572" class="m" font-size="14">exits: stale grant: <tspan class="mono">StaleScope</tspan> (3); otherwise</text><text x="14" y="589" class="m" font-size="14"><tspan class="mono">RuleEvalRefused</tspan> (5)</text><g data-check="found"><rect x="14" y="599" width="153" height="26" rx="4" class="bx"/><text x="22" y="617" class="x" font-size="14">rule found</text><g data-mark="pass" data-print="no" class="off"><path d="M143 612l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M144 607l10 10M154 607l-10 10" class="gl-d"/><path d="M158 605V619" class="fl-d"/></g></g><g data-check="unexpired"><rect x="173" y="599" width="153" height="26" rx="4" class="bx"/><text x="181" y="617" class="x" font-size="14">unexpired</text><g data-mark="pass" data-print="no" class="off"><path d="M302 612l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M303 607l10 10M313 607l-10 10" class="gl-d"/><path d="M317 605V619" class="fl-d"/></g></g><g data-check="generation"><rect x="14" y="629" width="153" height="26" rx="4" class="bx"/><text x="22" y="647" class="x" font-size="14">current generation</text><g data-mark="pass" data-print="no" class="off"><path d="M143 642l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M144 637l10 10M154 637l-10 10" class="gl-d"/><path d="M158 635V649" class="fl-d"/></g></g><g data-check="target"><rect x="173" y="629" width="153" height="26" rx="4" class="bx"/><text x="181" y="647" class="x" font-size="14">target</text><g data-mark="pass" data-print="no" class="off"><path d="M302 642l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M303 637l10 10M313 637l-10 10" class="gl-d"/><path d="M317 635V649" class="fl-d"/></g></g><g data-check="function"><rect x="14" y="659" width="153" height="26" rx="4" class="bx"/><text x="22" y="677" class="x" font-size="14">function</text><g data-mark="pass" data-print="no" class="off"><path d="M143 672l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M144 667l10 10M154 667l-10 10" class="gl-d"/><path d="M158 665V679" class="fl-d"/></g></g><g data-check="arguments"><rect x="173" y="659" width="153" height="26" rx="4" class="bx"/><text x="181" y="677" class="x" font-size="14">arguments</text><g data-mark="pass" data-print="no" class="off"><path d="M302 672l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M303 667l10 10M313 667l-10 10" class="gl-d"/><path d="M317 665V679" class="fl-d"/></g></g><g data-check="threshold"><rect x="14" y="689" width="153" height="26" rx="4" class="bx"/><text x="22" y="707" class="x" font-size="14">threshold</text><g data-mark="pass" data-print="no" class="off"><path d="M143 702l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M144 697l10 10M154 697l-10 10" class="gl-d"/><path d="M158 695V709" class="fl-d"/></g></g><g data-check="signers"><rect x="173" y="689" width="153" height="26" rx="4" class="bx"/><text x="181" y="707" class="x" font-size="14">every signer used</text><g data-mark="pass" data-print="no" class="off"><path d="M302 702l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M303 697l10 10M313 697l-10 10" class="gl-d"/><path d="M317 695V709" class="fl-d"/></g></g><g data-check="charge"><rect x="14" y="719" width="153" height="26" rx="4" class="bx"/><text x="22" y="737" class="x" font-size="14">charge</text><g data-mark="pass" data-print="no" class="off"><path d="M143 732l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M144 727l10 10M154 727l-10 10" class="gl-d"/><path d="M158 725V739" class="fl-d"/></g></g><g data-mark="pass" data-print="no" class="off"><path d="M312 507l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 502l10 10M323 502l-10 10" class="gl-d"/><path d="M327 500V514" class="fl-d"/></g></g><g data-exits="decide"><g data-exit="over app current right"><path d="M7 779l8 8M15 779l-8 8" class="gl-d"/><path d="M19 776V789" class="fl-d"/><text x="28" y="788" class="x" font-size="14">pay the shop 5, over the cap: charge: 6 + 5 =</text><text x="28" y="805" class="x" font-size="14">11 &gt; 10</text></g><g data-exit="account app current right"><path d="M7 819l8 8M15 819l-8 8" class="gl-d"/><path d="M19 816V829" class="fl-d"/><text x="28" y="828" class="x" font-size="14">a call to the account: target</text></g><g data-exit="within unlisted current right"><path d="M7 842l8 8M15 842l-8 8" class="gl-d"/><path d="M19 839V852" class="fl-d"/><text x="28" y="851" class="x" font-size="14">a key on no rule: threshold: 0 of 1 listed</text><text x="28" y="868" class="x" font-size="14">signers</text></g><g data-exit="within app expired right"><path d="M7 882l8 8M15 882l-8 8" class="gl-d"/><path d="M19 879V892" class="fl-d"/><text x="28" y="891" class="x" font-size="14">an expired grant: unexpired</text></g><g data-exit="within app stale right"><path d="M7 905l8 8M15 905l-8 8" class="gl-d"/><path d="M19 902V915" class="fl-d"/><text x="28" y="914" class="x" font-size="14">a grant from before a recovery: current</text><text x="28" y="931" class="x" font-size="14">generation</text></g><g data-exit="within app current wrong"><path d="M7 945l8 8M15 945l-8 8" class="gl-d"/><path d="M19 942V955" class="fl-d"/><text x="28" y="954" class="x" font-size="14">the wrong rule named: charge: 0 + 4 = 4 &gt; 2</text></g><text x="28" y="977" class="m" font-size="14">Every refusal here: nothing written, no verifier</text><text x="28" y="994" class="m" font-size="14">called.</text></g><path d="M42 1002V1020" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-stage="authenticate"><rect x="2" y="1024" width="336" height="147" rx="6" class="bx"/><rect x="5" y="1027" width="11" height="141" rx="0" class="tr"/><text x="28" y="1048" class="t" font-size="14">5  Authenticate</text><text x="28" y="1068" class="x" font-size="14">A digest of the payload, the account and</text><text x="28" y="1086" class="x" font-size="14">the rule IDs; each signer’s verifier checks</text><text x="28" y="1104" class="x" font-size="14">it.</text><text x="28" y="1125" class="m" font-size="14">exits: bad signature: the verifier traps</text><text x="28" y="1142" class="m" font-size="14">(Error(Crypto, InvalidInput) for Ed25519);</text><text x="28" y="1159" class="m" font-size="14"><tspan class="mono">ExternalVerificationFailed</tspan> (3003)</text><g data-mark="pass" data-print="no" class="off"><path d="M312 1042l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 1037l10 10M323 1037l-10 10" class="gl-d"/><path d="M327 1035V1049" class="fl-d"/></g></g><g data-exits="authenticate"><g data-exit="within forged current right"><path d="M7 1187l8 8M15 1187l-8 8" class="gl-d"/><path d="M19 1184V1197" class="fl-d"/><text x="28" y="1196" class="x" font-size="14">another key signing as the app: the decision</text><text x="28" y="1213" class="x" font-size="14">accepts; the verifier traps (recorded run,</text><text x="28" y="1230" class="x" font-size="14">command 11: Error(Crypto, InvalidInput))</text></g></g><path d="M42 1238V1256" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-stage="store"><rect x="2" y="1260" width="336" height="74" rx="6" class="bx"/><text x="14" y="1284" class="t" font-size="14">6  Store</text><text x="14" y="1304" class="x" font-size="14">Write each changed spending record.</text><text x="14" y="1322" class="x" font-size="14">Authorized.</text><g data-mark="pass" data-print="no" class="off"><path d="M312 1278l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M313 1273l10 10M323 1273l-10 10" class="gl-d"/><path d="M327 1271V1285" class="fl-d"/></g></g><g data-exits="store"><g data-exit="within app current right"><path d="M6 1354l4 5l8-10" class="gl"/><text x="28" y="1359" class="x" font-size="14">pay the shop 4, within the cap: accepted;</text><text x="28" y="1376" class="x" font-size="14"><tspan class="mono">shop</tspan> window 6 + 4 = 10 of 10</text></g><g data-exit="guess app current right"><path d="M6 1394l4 5l8-10" class="gl"/><text x="28" y="1399" class="x" font-size="14">a lost guess: accepted; <tspan class="mono">spend</tspan> window 0 + 1 =</text><text x="28" y="1416" class="x" font-size="14">1 of 2</text></g></g></svg>
