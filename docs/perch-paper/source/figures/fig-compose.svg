<svg class="wide" viewBox="0 0 760 866" role="img" aria-labelledby="fig-compose-title" aria-describedby="fig-compose-text"><text x="2" y="16" class="m tag" font-size="14">MODEL</text><text x="60" y="16" class="m" font-size="14">the same five checks, two arrangements; no contract named</text><text x="2" y="38" class="x" font-size="14">Each request is signed by the app and a co-signer, and the oracle’s price is above the floor, unless it says</text><text x="2" y="55" class="x" font-size="14">otherwise.</text><text x="158" y="73" class="t" font-size="14">(a) Shaped like a Perch account</text><text x="158" y="90" class="m" font-size="14">one decision point holds the checks</text><text x="158" y="107" class="m" font-size="14">and the window record</text><text x="416" y="73" class="t" font-size="14">(b) Shaped like a policy-composed</text><text x="416" y="90" class="t" font-size="14">OpenZeppelin account</text><text x="416" y="107" class="m" font-size="14">one policy per check, each with its own state, run in</text><text x="416" y="124" class="m" font-size="14">order</text><rect x="158" y="145" width="250" height="156" rx="6" class="bx bx-k"/><text x="170" y="167" class="t" font-size="14">decision point</text><text x="170" y="187" class="x" font-size="14">• recipient pin</text><text x="170" y="204" class="x" font-size="14">• per-call bound</text><text x="170" y="221" class="x" font-size="14">• window cap + its record</text><text x="170" y="238" class="x" font-size="14">• two signers</text><rect x="168" y="246" width="230" height="44" rx="4" class="bx dash"/><text x="178" y="264" class="m" font-size="14">live read: a Perch rule reads</text><text x="178" y="281" class="m" font-size="14">nothing outside the account</text><rect x="416" y="149" width="147.21" height="24" rx="4" class="bx"/><text x="422" y="166" class="x" font-size="14">window cap + record</text><path d="M566.21 161H577.21" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="581.21" y="149" width="91.25" height="24" rx="4" class="bx"/><text x="587.21" y="166" class="x" font-size="14">recipient pin</text><path d="M416 191H427" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="431" y="179" width="105.14" height="24" rx="4" class="bx"/><text x="437" y="196" class="x" font-size="14">per-call bound</text><path d="M539.14 191H550.14" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="554.14" y="179" width="86.34" height="24" rx="4" class="bx"/><text x="560.14" y="196" class="x" font-size="14">two signers</text><path d="M643.48 191H654.48" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="658.48" y="179" width="67.55" height="24" rx="4" class="bx"/><text x="664.48" y="196" class="x" font-size="14">live read</text><text x="416" y="221" class="m" font-size="14">Each policy can be attached, detached or moved;</text><text x="416" y="238" class="m" font-size="14">the first to refuse stops the call.</text><text x="2" y="331" class="t tag" font-size="14">REQUESTS</text><g data-request="1" data-a="accepted" data-b="accepted"><circle cx="13" cy="358" r="11" class="bx"/><text x="13" y="362.9" class="t" font-size="14" text-anchor="middle">1</text><text x="30" y="363" class="t" font-size="14">Pay 6 to the</text><text x="30" y="380" class="t" font-size="14">shop</text><rect x="158" y="341" width="250" height="114" rx="6" class="bx"/><rect x="166" y="349" width="101.88" height="24" rx="4" class="bx"/><text x="172" y="366" class="x" font-size="14">decision point</text><path d="M167 390l4 5l8-10" class="gl"/><text x="188" y="395" class="x" font-size="14">accepted; written: the window</text><text x="188" y="413" class="x" font-size="14">record, now 6 of 10</text><rect x="416" y="341" width="342" height="114" rx="6" class="bx"/><rect x="424" y="349" width="88.79" height="24" rx="4" class="bx"/><text x="430" y="366" class="x" font-size="14">window cap</text><path d="M515.79 361H526.79" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="530.79" y="349" width="91.25" height="24" rx="4" class="bx"/><text x="536.79" y="366" class="x" font-size="14">recipient pin</text><path d="M625.04 361H636.04" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="640.04" y="349" width="105.14" height="24" rx="4" class="bx"/><text x="646.04" y="366" class="x" font-size="14">per-call bound</text><path d="M424 391H435" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="439" y="379" width="86.34" height="24" rx="4" class="bx"/><text x="445" y="396" class="x" font-size="14">two signers</text><path d="M528.34 391H539.34" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="543.34" y="379" width="67.55" height="24" rx="4" class="bx"/><text x="549.34" y="396" class="x" font-size="14">live read</text><path d="M425 420l4 5l8-10" class="gl"/><text x="446" y="425" class="x" font-size="14">accepted; written: the window cap’s record,</text><text x="446" y="443" class="x" font-size="14">now 6 of 10</text></g><g data-request="2" data-a="refused:window" data-b="refused:window"><circle cx="13" cy="478" r="11" class="bx"/><text x="13" y="482.9" class="t" font-size="14" text-anchor="middle">2</text><text x="30" y="483" class="t" font-size="14">Pay 5 more to</text><text x="30" y="500" class="t" font-size="14">the shop</text><rect x="158" y="461" width="250" height="102" rx="6" class="bx"/><rect x="166" y="469" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="172" y="486" class="d" font-size="14">decision point</text><path d="M267.88 466V496" class="fl-d"/><path d="M168 505l10 10M178 505l-10 10" class="gl-d"/><text x="188" y="515" class="d" font-size="14">refused at the decision point:</text><text x="188" y="533" class="d" font-size="14">window cap (6 + 5 = 11 &gt; 10);</text><text x="188" y="551" class="d" font-size="14">nothing written</text><rect x="416" y="461" width="342" height="102" rx="6" class="bx"/><rect x="424" y="469" width="88.79" height="24" rx="4" class="bx bx-no"/><text x="430" y="486" class="d" font-size="14">window cap</text><path d="M512.79 466V496" class="fl-d"/><path d="M426 505l10 10M436 505l-10 10" class="gl-d"/><text x="446" y="515" class="d" font-size="14">refused by the window cap (6 + 5 = 11 &gt; 10);</text><text x="446" y="533" class="d" font-size="14">nothing written</text></g><g data-request="3" data-a="refused:pin" data-b="refused:pin:rolled-back"><circle cx="13" cy="586" r="11" class="bx"/><text x="13" y="590.9" class="t" font-size="14" text-anchor="middle">3</text><text x="30" y="591" class="t" font-size="14">Pay 1 elsewhere</text><rect x="158" y="569" width="250" height="84" rx="6" class="bx"/><rect x="166" y="577" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="172" y="594" class="d" font-size="14">decision point</text><path d="M267.88 574V604" class="fl-d"/><path d="M168 613l10 10M178 613l-10 10" class="gl-d"/><text x="188" y="623" class="d" font-size="14">refused at the decision point:</text><text x="188" y="641" class="d" font-size="14">recipient pin; nothing written</text><rect x="416" y="569" width="342" height="84" rx="6" class="bx"/><rect x="424" y="577" width="88.79" height="24" rx="4" class="bx"/><text x="430" y="594" class="x" font-size="14">window cap</text><path d="M515.79 589H526.79" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="530.79" y="577" width="91.25" height="24" rx="4" class="bx bx-no"/><text x="536.79" y="594" class="d" font-size="14">recipient pin</text><path d="M622.04 574V604" class="fl-d"/><path d="M426 613l10 10M436 613l-10 10" class="gl-d"/><text x="446" y="623" class="d" font-size="14">refused by the recipient pin after the window</text><text x="446" y="641" class="d" font-size="14">cap wrote: rolled back with the call</text></g><g data-request="4" data-a="refused:window" data-b="accepted"><circle cx="13" cy="676" r="11" class="bx"/><text x="13" y="680.9" class="t" font-size="14" text-anchor="middle">4</text><text x="30" y="681" class="t" font-size="14">Detach the</text><text x="30" y="698" class="t" font-size="14">window cap in</text><text x="30" y="715" class="t" font-size="14">(b); pay 6 to the</text><text x="30" y="732" class="t" font-size="14">shop</text><rect x="158" y="659" width="250" height="132" rx="6" class="bx"/><rect x="166" y="667" width="101.88" height="24" rx="4" class="bx bx-no"/><text x="172" y="684" class="d" font-size="14">decision point</text><path d="M267.88 664V694" class="fl-d"/><path d="M168 703l10 10M178 703l-10 10" class="gl-d"/><text x="188" y="713" class="d" font-size="14">refused at the decision point:</text><text x="188" y="731" class="d" font-size="14">window cap (6 + 6 = 12 &gt; 10);</text><text x="188" y="749" class="d" font-size="14">nothing written</text><rect x="416" y="659" width="342" height="132" rx="6" class="bx"/><rect x="424" y="667" width="91.25" height="24" rx="4" class="bx"/><text x="430" y="684" class="x" font-size="14">recipient pin</text><path d="M518.25 679H529.25" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="533.25" y="667" width="105.14" height="24" rx="4" class="bx"/><text x="539.25" y="684" class="x" font-size="14">per-call bound</text><path d="M641.39 679H652.39" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="656.39" y="667" width="86.34" height="24" rx="4" class="bx"/><text x="662.39" y="684" class="x" font-size="14">two signers</text><path d="M424 709H435" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="439" y="697" width="67.55" height="24" rx="4" class="bx"/><text x="445" y="714" class="x" font-size="14">live read</text><path d="M425 738l4 5l8-10" class="gl"/><text x="446" y="743" class="x" font-size="14">accepted; no window cap attached, so nothing</text><text x="446" y="761" class="x" font-size="14">written; moved in the last 100 ledgers: 12,</text><text x="446" y="779" class="x" font-size="14">over 10</text></g><text x="158" y="815" class="x" font-size="14">Window at most 10: holds while the</text><text x="158" y="832" class="x" font-size="14">rule exists.</text><text x="416" y="815" class="x" font-size="14">Window at most 10: holds while the window-cap</text><text x="416" y="832" class="x" font-size="14">policy is attached.</text><text x="2" y="815" class="t tag" font-size="14">GUARANTEE</text><text x="2" y="858" class="t" font-size="15">Composition buys flexibility; one decision point gives one place to check.</text></svg>
