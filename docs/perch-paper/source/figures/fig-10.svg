<svg class="wide" viewBox="0 0 760 1163" role="img" aria-labelledby="fig-10-title" aria-describedby="fig-10-text"><rect x="2" y="2" width="756" height="81" rx="6" class="bx"/><text x="14" y="27" class="t" font-size="15">One source</text><text x="14" y="47" class="x" font-size="15"><tspan class="mono">crates/rule-eval</tspan>: about 2,400 lines of Rust, <tspan class="mono">no_std</tspan>, no dependencies,</text><text x="14" y="67" class="x" font-size="15"><tspan class="mono">forbid(unsafe_code)</tspan></text><path d="M32 83V135" class="fl" marker-end="url(#perch-ah)"/><text x="46" y="123" class="t tag" font-size="13">PROOF PATH</text><rect x="2" y="133" width="440" height="61" rx="6" class="bx"/><rect x="3" y="134" width="10" height="59" class="tr"/><text x="26" y="158" class="x" font-size="15">rustc <tspan class="mono">nightly-2026-09-17</tspan> → MIR</text><text x="26" y="178" class="m tag" font-size="13">TRUSTED</text><path d="M32 194V212" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="214" width="440" height="61" rx="6" class="bx"/><rect x="3" y="215" width="10" height="59" class="tr"/><text x="26" y="239" class="x" font-size="15">Charon <tspan class="mono">7b462d9</tspan> → LLBC</text><text x="26" y="259" class="m tag" font-size="13">TRUSTED</text><path d="M32 275V293" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="295" width="440" height="81" rx="6" class="bx"/><rect x="3" y="296" width="10" height="79" class="tr"/><text x="26" y="320" class="x" font-size="15">Aeneas <tspan class="mono">ab34bd2</tspan> → <tspan class="mono">RuleEval.lean</tspan>: 3,653</text><text x="26" y="340" class="x" font-size="15">generated lines, regenerated and diffed in CI</text><text x="26" y="360" class="m tag" font-size="13">TRUSTED</text><path d="M32 376V394" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="396" width="440" height="331" rx="8" class="bx bx-pr"/><rect x="14" y="408" width="416" height="101" rx="6" class="bx"/><text x="26" y="433" class="x" font-size="15">Equivalence: <tspan class="mono">authorize_eq</tspan>, <tspan class="mono">lower_eq</tspan>,</text><text x="26" y="453" class="x" font-size="15"><tspan class="mono">lower_scoped_eq</tspan> relate the translation to the</text><text x="26" y="473" class="x" font-size="15">readable model.</text><text x="26" y="493" class="g tag" font-size="13">PROVED · TRANSLATION ↔ MODEL</text><rect x="14" y="519" width="416" height="81" rx="6" class="bx"/><text x="26" y="544" class="x" font-size="15">Containment, narrowing, trace inclusion, cap</text><text x="26" y="564" class="x" font-size="15">window, budgets</text><text x="26" y="584" class="g tag" font-size="13">PROVED · MODEL + TRANSLATION</text><rect x="14" y="610" width="416" height="61" rx="6" class="bx"/><text x="26" y="635" class="x" font-size="15">Account event model: recovery invalidation</text><text x="26" y="655" class="g tag" font-size="13">PROVED · ACCOUNT MODEL</text><text x="14" y="696" class="g" font-size="14">Lean v4.35.0 kernel. 940 exported theorems; axioms</text><text x="14" y="715" class="g" font-size="14">within propext, Quot.sound, Classical.choice.</text><rect x="2" y="745" width="440" height="101" rx="6" class="bx"/><rect x="3" y="746" width="10" height="99" class="tr"/><text x="26" y="770" class="x" font-size="15">Denotations, the document meaning <tspan class="mono">Doc.allows</tspan></text><text x="26" y="790" class="x" font-size="15">(written from Perch <tspan class="mono">dff2a73</tspan>), and the Soroban</text><text x="26" y="810" class="x" font-size="15">host models</text><text x="26" y="830" class="m tag" font-size="13">TRUSTED SPECIFICATION</text><path d="M412 745V729" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="2" y="860" width="440" height="81" rx="6" class="bx"/><text x="14" y="885" class="x" font-size="15">Theorems about a Soroban host model; the model is</text><text x="14" y="905" class="x" font-size="15">tested against soroban-env-host 29.0.1 and 30.0.0</text><text x="14" y="925" class="g tag" font-size="13">PROVED · HOST MODEL</text><rect x="2" y="955" width="440" height="81" rx="6" class="bx"/><text x="14" y="980" class="x" font-size="15">Perch <tspan class="mono">formal/</tspan> (Lean v4.33.0): CANON v1 encoding</text><text x="14" y="1000" class="x" font-size="15">is injective</text><text x="14" y="1020" class="g tag" font-size="13">PROVED · PERCH CANON PACKAGE</text><path d="M522 83V135" class="fl" marker-end="url(#perch-ah)"/><text x="536" y="123" class="t tag" font-size="13">SHIPPING PATH</text><rect x="492" y="133" width="266" height="81" rx="6" class="bx"/><rect x="493" y="134" width="10" height="79" class="tr"/><text x="516" y="158" class="x" font-size="15">rustc 1.97.1 →</text><text x="516" y="178" class="x" font-size="15"><tspan class="mono">wasm32v1-none</tspan></text><text x="516" y="198" class="m tag" font-size="13">TRUSTED</text><path d="M522 214V232" class="fl" marker-end="url(#perch-ah)"/><rect x="492" y="234" width="266" height="121" rx="6" class="bx"/><text x="504" y="259" class="x" font-size="15">Linked into</text><text x="504" y="279" class="x" font-size="15"><tspan class="mono">perch_account.wasm</tspan>: <tspan class="mono">lower</tspan></text><text x="504" y="299" class="x" font-size="15">and <tspan class="mono">lower_scoped</tspan> on</text><text x="504" y="319" class="x" font-size="15">install, <tspan class="mono">authorize</tspan> in</text><text x="504" y="339" class="x" font-size="15"><tspan class="mono">__check_auth</tspan></text><path d="M522 355V373" class="fl" marker-end="url(#perch-ah)"/><rect x="492" y="375" width="266" height="61" rx="6" class="bx"/><text x="504" y="400" class="x" font-size="15">Account shell around it</text><text x="504" y="420" class="m tag" font-size="13">TESTED</text><rect x="492" y="454" width="266" height="61" rx="6" class="bx bx-no dash"/><text x="504" y="479" class="x" font-size="15">Nothing checks this Wasm</text><text x="504" y="499" class="x" font-size="15">against the translation.</text><path d="M732 470l10 10M742 470l-10 10" class="gl-d"/><rect x="2" y="1058" width="756" height="101" rx="6" class="bx"/><text x="14" y="1083" class="x" font-size="15">Bridge: 57 Lean-generated document traces run through the account's <tspan class="mono">apply_doc</tspan>,</text><text x="14" y="1103" class="x" font-size="15"><tspan class="mono">apply_scope</tspan> and <tspan class="mono">__check_auth</tspan> (native contracts, enforcing authorization, the real</text><text x="14" y="1123" class="x" font-size="15">Ed25519 verifier). Rule-core's vectors are replayed in Perch CI.</text><text x="14" y="1143" class="m tag" font-size="13">TESTED</text></svg>
