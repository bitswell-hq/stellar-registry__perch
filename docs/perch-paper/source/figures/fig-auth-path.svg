<svg class="wide" viewBox="0 0 760 974" role="img" aria-labelledby="fig-auth-path-title" aria-describedby="fig-auth-path-text" data-recorded-trap="Error(Crypto, InvalidInput)" data-recorded-command="11"><text x="2" y="16" class="t tag" font-size="14">THE ACCOUNT’S STAGES AND EXITS</text><text x="368" y="16" class="t tag" font-size="14">WHERE EACH SCENARIO STOPS</text><text x="368" y="36" class="m" font-size="14">MODEL. Rules: <tspan class="mono">shop</tspan> (XLM to the shop, 10 per 100</text><text x="368" y="53" class="m" font-size="14">ledgers; its window holds 6), and the game grant’s <tspan class="mono">guess</tspan></text><text x="368" y="70" class="m" font-size="14">and <tspan class="mono">spend</tspan> (XLM, 2 per 100). Signed by the app’s key</text><text x="368" y="87" class="m" font-size="14">unless noted.</text><g data-exits="host"></g><g data-stage="host"><rect x="2" y="30" width="352" height="96" rx="6" class="bx"/><rect x="5" y="33" width="11" height="90" rx="0" class="tr"/><text x="28" y="54" class="t" font-size="15">1  Host call</text><text x="28" y="74" class="x" font-size="15">The host calls <tspan class="mono">__check_auth</tspan>: the</text><text x="28" y="92" class="x" font-size="15">contexts, one named rule per context,</text><text x="28" y="110" class="x" font-size="15">the claimed signers.</text><g data-mark="pass" data-print="no" class="off"><path d="M328 48l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 43l10 10M339 43l-10 10" class="gl-d"/><path d="M343 41V55" class="fl-d"/></g></g><path d="M42 128V146" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-exits="guards"></g><g data-stage="guards"><rect x="2" y="150" width="352" height="129" rx="6" class="bx"/><text x="14" y="174" class="t" font-size="15">2  Guards</text><text x="14" y="194" class="x" font-size="15">Reserved hook names, a frozen account, a</text><text x="14" y="212" class="x" font-size="15">grant rule on an adopted recovery contract.</text><text x="14" y="233" class="m" font-size="14">exits: <tspan class="mono">ReservedFunction</tspan> (1); <tspan class="mono">AccountFrozen</tspan></text><text x="14" y="250" class="m" font-size="14">(2); <tspan class="mono">ScopeEscalation</tspan> (4); a completion: decided</text><text x="14" y="267" class="m" font-size="14">by the recovery controller</text><g data-mark="pass" data-print="no" class="off"><path d="M328 168l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 163l10 10M339 163l-10 10" class="gl-d"/><path d="M343 161V175" class="fl-d"/></g></g><path d="M42 281V299" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-exits="select"></g><g data-stage="select"><rect x="2" y="303" width="352" height="95" rx="6" class="bx"/><text x="14" y="327" class="t" font-size="15">3  Select rules</text><text x="14" y="347" class="x" font-size="15">Look up each named rule and its spending</text><text x="14" y="365" class="x" font-size="15">record; no search.</text><text x="14" y="386" class="m" font-size="14">exits: <tspan class="mono">ContextRuleNotFound</tspan> (3000)</text><g data-mark="pass" data-print="no" class="off"><path d="M328 321l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 316l10 10M339 316l-10 10" class="gl-d"/><path d="M343 314V328" class="fl-d"/></g></g><path d="M42 400V418" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-exits="decide"><g data-exit="over app current right"><path d="M369 433l8 8M377 433l-8 8" class="gl-d"/><path d="M381 430V443" class="fl-d"/><text x="388" y="442" class="x" font-size="14">pay the shop 5, over the cap: charge: 6 + 5 = 11 &gt; 10</text></g><g data-exit="account app current right"><path d="M369 456l8 8M377 456l-8 8" class="gl-d"/><path d="M381 453V466" class="fl-d"/><text x="388" y="465" class="x" font-size="14">a call to the account: target</text></g><g data-exit="within unlisted current right"><path d="M369 479l8 8M377 479l-8 8" class="gl-d"/><path d="M381 476V489" class="fl-d"/><text x="388" y="488" class="x" font-size="14">a key on no rule: threshold: 0 of 1 listed signers</text></g><g data-exit="within app expired right"><path d="M369 502l8 8M377 502l-8 8" class="gl-d"/><path d="M381 499V512" class="fl-d"/><text x="388" y="511" class="x" font-size="14">an expired grant: unexpired</text></g><g data-exit="within app stale right"><path d="M369 525l8 8M377 525l-8 8" class="gl-d"/><path d="M381 522V535" class="fl-d"/><text x="388" y="534" class="x" font-size="14">a grant from before a recovery: current generation</text></g><g data-exit="within app current wrong"><path d="M369 548l8 8M377 548l-8 8" class="gl-d"/><path d="M381 545V558" class="fl-d"/><text x="388" y="557" class="x" font-size="14">the wrong rule named: charge: 0 + 4 = 4 &gt; 2</text></g><text x="388" y="584" class="m" font-size="14">Every refusal here: nothing written,</text><text x="388" y="601" class="m" font-size="14">no verifier called.</text></g><g data-stage="decide"><rect x="2" y="422" width="352" height="274" rx="6" class="bx bx-pr"/><rect x="6" y="426" width="344" height="266" rx="2" class="fl-g"/><text x="14" y="446" class="t" font-size="15">4  Decide</text><text x="14" y="466" class="x" font-size="15"><tspan class="mono">rule_eval::authorize</tspan>: no storage</text><text x="14" y="484" class="x" font-size="15">read, no signature checked.</text><text x="14" y="505" class="m" font-size="14">exits: stale grant: <tspan class="mono">StaleScope</tspan> (3); otherwise</text><text x="14" y="522" class="m" font-size="14"><tspan class="mono">RuleEvalRefused</tspan> (5)</text><g data-check="found"><rect x="14" y="532" width="161" height="26" rx="4" class="bx"/><text x="22" y="550" class="x" font-size="14">rule found</text><g data-mark="pass" data-print="no" class="off"><path d="M151 545l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M152 540l10 10M162 540l-10 10" class="gl-d"/><path d="M166 538V552" class="fl-d"/></g></g><g data-check="unexpired"><rect x="181" y="532" width="161" height="26" rx="4" class="bx"/><text x="189" y="550" class="x" font-size="14">unexpired</text><g data-mark="pass" data-print="no" class="off"><path d="M318 545l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M319 540l10 10M329 540l-10 10" class="gl-d"/><path d="M333 538V552" class="fl-d"/></g></g><g data-check="generation"><rect x="14" y="562" width="161" height="26" rx="4" class="bx"/><text x="22" y="580" class="x" font-size="14">current generation</text><g data-mark="pass" data-print="no" class="off"><path d="M151 575l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M152 570l10 10M162 570l-10 10" class="gl-d"/><path d="M166 568V582" class="fl-d"/></g></g><g data-check="target"><rect x="181" y="562" width="161" height="26" rx="4" class="bx"/><text x="189" y="580" class="x" font-size="14">target</text><g data-mark="pass" data-print="no" class="off"><path d="M318 575l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M319 570l10 10M329 570l-10 10" class="gl-d"/><path d="M333 568V582" class="fl-d"/></g></g><g data-check="function"><rect x="14" y="592" width="161" height="26" rx="4" class="bx"/><text x="22" y="610" class="x" font-size="14">function</text><g data-mark="pass" data-print="no" class="off"><path d="M151 605l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M152 600l10 10M162 600l-10 10" class="gl-d"/><path d="M166 598V612" class="fl-d"/></g></g><g data-check="arguments"><rect x="181" y="592" width="161" height="26" rx="4" class="bx"/><text x="189" y="610" class="x" font-size="14">arguments</text><g data-mark="pass" data-print="no" class="off"><path d="M318 605l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M319 600l10 10M329 600l-10 10" class="gl-d"/><path d="M333 598V612" class="fl-d"/></g></g><g data-check="threshold"><rect x="14" y="622" width="161" height="26" rx="4" class="bx"/><text x="22" y="640" class="x" font-size="14">threshold</text><g data-mark="pass" data-print="no" class="off"><path d="M151 635l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M152 630l10 10M162 630l-10 10" class="gl-d"/><path d="M166 628V642" class="fl-d"/></g></g><g data-check="signers"><rect x="181" y="622" width="161" height="26" rx="4" class="bx"/><text x="189" y="640" class="x" font-size="14">every signer used</text><g data-mark="pass" data-print="no" class="off"><path d="M318 635l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M319 630l10 10M329 630l-10 10" class="gl-d"/><path d="M333 628V642" class="fl-d"/></g></g><g data-check="charge"><rect x="14" y="652" width="161" height="26" rx="4" class="bx"/><text x="22" y="670" class="x" font-size="14">charge</text><g data-mark="pass" data-print="no" class="off"><path d="M151 665l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M152 660l10 10M162 660l-10 10" class="gl-d"/><path d="M166 658V672" class="fl-d"/></g></g><g data-mark="pass" data-print="no" class="off"><path d="M328 440l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 435l10 10M339 435l-10 10" class="gl-d"/><path d="M343 433V447" class="fl-d"/></g></g><path d="M42 698V716" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-exits="authenticate"><g data-exit="within forged current right"><path d="M369 731l8 8M377 731l-8 8" class="gl-d"/><path d="M381 728V741" class="fl-d"/><text x="388" y="740" class="x" font-size="14">another key signing as the app: the decision accepts;</text><text x="388" y="757" class="x" font-size="14">the verifier traps (recorded run, command 11:</text><text x="388" y="774" class="x" font-size="14">Error(Crypto, InvalidInput))</text></g></g><g data-stage="authenticate"><rect x="2" y="720" width="352" height="147" rx="6" class="bx"/><rect x="5" y="723" width="11" height="141" rx="0" class="tr"/><text x="28" y="744" class="t" font-size="15">5  Authenticate</text><text x="28" y="764" class="x" font-size="15">A digest of the payload, the account and</text><text x="28" y="782" class="x" font-size="15">the rule IDs; each signer’s verifier checks</text><text x="28" y="800" class="x" font-size="15">it.</text><text x="28" y="821" class="m" font-size="14">exits: bad signature: the verifier traps</text><text x="28" y="838" class="m" font-size="14">(Error(Crypto, InvalidInput) for Ed25519);</text><text x="28" y="855" class="m" font-size="14"><tspan class="mono">ExternalVerificationFailed</tspan> (3003)</text><g data-mark="pass" data-print="no" class="off"><path d="M328 738l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 733l10 10M339 733l-10 10" class="gl-d"/><path d="M343 731V745" class="fl-d"/></g></g><path d="M42 869V887" class="fl-m" marker-end="url(#perch-ah-m)"/><g data-exits="store"><g data-exit="within app current right"><path d="M368 906l4 5l8-10" class="gl"/><text x="388" y="911" class="x" font-size="14">pay the shop 4, within the cap: accepted; <tspan class="mono">shop</tspan> window</text><text x="388" y="928" class="x" font-size="14">6 + 4 = 10 of 10</text></g><g data-exit="guess app current right"><path d="M368 946l4 5l8-10" class="gl"/><text x="388" y="951" class="x" font-size="14">a lost guess: accepted; <tspan class="mono">spend</tspan> window 0 + 1 = 1 of 2</text></g></g><g data-stage="store"><rect x="2" y="891" width="352" height="79" rx="6" class="bx"/><text x="14" y="915" class="t" font-size="15">6  Store</text><text x="14" y="935" class="x" font-size="15">Write each changed spending record.</text><text x="14" y="953" class="x" font-size="15">Authorized.</text><g data-mark="pass" data-print="no" class="off"><path d="M328 909l4 5l8-10" class="gl"/></g><g data-mark="stop" data-print="no" class="off"><path d="M329 904l10 10M339 904l-10 10" class="gl-d"/><path d="M343 902V916" class="fl-d"/></g></g></svg>
