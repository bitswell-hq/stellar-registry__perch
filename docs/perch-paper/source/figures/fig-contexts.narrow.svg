font-size="14">allowed</text><path d="M12 427l4 5l8-10" class="gl"/><path d="M8 397V427H10" class="fl-m"/><rect x="34" y="477" width="304" height="81" rx="6" class="bx dash"/><text x="46" y="504" class="m" font-size="14">The game then pays out its balance (3</text><text x="46" y="523" class="m" font-size="14">XLM) under its own authority. Nothing is</text><text x="46" y="542" class="m" font-size="14">charged to grant 3.</text><text x="2" y="601" class="t" font-size="15">(c) A direct transfer</text><rect x="2" y="612" width="336" height="77" rx="6" class="bx bx-k"/><text x="14" y="639" class="t" font-size="14">Signed tree</text><text x="14" y="658" class="x" font-size="14"><tspan class="mono">xlm.transfer(account → anyone,</tspan></text><text x="22" y="677" class="x" font-size="14"><tspan class="mono">≤ 2 XLM)</tspan></text><rect x="34" y="699" width="304" height="62" rx="6" class="bx"/><text x="46" y="726" class="x" font-size="14">[0] <tspan class="mono">xlm.transfer</tspan> → grant 3, rule <tspan class="mono">spend</tspan>:</text><text x="46" y="745" class="x" font-size="14">allowed at the pinned build</text><path d="M12 719l4 5l8-10" class="gl"/><path d="M8 689V719H10" class="fl-m"/><rect x="34" y="773" width="71" height="26" rx="13" class="pill pill-m"/><text x="45" y="791.04" class="m" font-size="14">DRAFT</text><text x="115" y="791" class="m" font-size="14">A draft that checks exact entry</text><text x="115" y="810" class="m" font-size="14">roots would refuse it.</text></svg>
