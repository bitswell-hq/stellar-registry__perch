<svg class="narrow" viewBox="0 0 340 909" role="img" aria-labelledby="fig-2-title" aria-describedby="fig-2-text"><text x="2" y="18" class="t" font-size="15">(a) A lost guess</text><rect x="2" y="30" width="336" height="97" rx="6" class="bx bx-k"/><text x="14" y="54" class="t" font-size="14">Signed tree</text><text x="14" y="73" class="x" font-size="14"><tspan class="mono">game.guess(0, guesser)</tspan></text><text x="14" y="92" class="x" font-size="14">└ <tspan class="mono">xlm.transfer(account → game, 1</tspan></text><text x="14" y="111" class="x" font-size="14"><tspan class="mono">XLM)</tspan></text><path d="M10 127V159H18" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="46" y="139" width="292" height="59" rx="6" class="bx"/><text x="58" y="163" class="x" font-size="14">[0] <tspan class="mono">game.guess</tspan> → grant 3, rule</text><text x="58" y="182" class="x" font-size="14"><tspan class="mono">guess</tspan>: allowed</text><path d="M24 160l4 5l8-10" class="gl"/><rect x="46" y="206" width="292" height="78" rx="6" class="bx bx-hi"/><text x="58" y="230" class="x" font-size="14">[1] <tspan class="mono">xlm.transfer</tspan> → grant 3, rule</text><text x="58" y="249" class="x" font-size="14"><tspan class="mono">spend</tspan> (2 XLM per 100 ledgers):</text><text x="58" y="268" class="x" font-size="14">allowed, charges 1 XLM</text><path d="M24 227l4 5l8-10" class="gl-a"/><text x="2" y="326" class="t" font-size="15">(b) A winning guess</text><rect x="2" y="338" width="336" height="59" rx="6" class="bx bx-k"/><text x="14" y="362" class="t" font-size="14">Signed tree</text><text x="14" y="381" class="x" font-size="14"><tspan class="mono">game.guess(n, guesser)</tspan></text><path d="M10 397V429H18" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="46" y="409" width="292" height="59" rx="6" class="bx"/><text x="58" y="433" class="x" font-size="14">[0] <tspan class="mono">game.guess</tspan> → grant 3, rule</text><text x="58" y="452" class="x" font-size="14"><tspan class="mono">guess</tspan>: allowed</text><path d="M24 430l4 5l8-10" class="gl"/><g opacity=".8"><rect x="46" y="476" width="292" height="78" rx="6" class="bx dash"/><text x="58" y="500" class="x" font-size="14">The game then pays out its balance</text><text x="58" y="519" class="x" font-size="14">(3 XLM) under its own authority.</text><text x="58" y="538" class="x" font-size="14">Nothing is charged to grant 3.</text></g><text x="2" y="596" class="t" font-size="15">(c) A direct transfer</text><rect x="2" y="608" width="336" height="78" rx="6" class="bx bx-k"/><text x="14" y="632" class="t" font-size="14">Signed tree</text><text x="14" y="651" class="x" font-size="14"><tspan class="mono">xlm.transfer(account → anyone, ≤ 2</tspan></text><text x="14" y="670" class="x" font-size="14"><tspan class="mono">XLM)</tspan></text><path d="M10 686V718H18" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="46" y="698" width="292" height="78" rx="6" class="bx"/><text x="58" y="722" class="x" font-size="14">[0] <tspan class="mono">xlm.transfer</tspan> → grant 3, rule</text><text x="58" y="741" class="x" font-size="14"><tspan class="mono">spend</tspan>: allowed at the pinned</text><text x="58" y="760" class="x" font-size="14">build</text><path d="M24 719l4 5l8-10" class="gl"/><rect x="46" y="784" width="75.0752" height="22" rx="11.0" class="pill pill-m"/><text x="83.5376" y="799.68" class="m tag" font-size="13" text-anchor="middle">OPEN PR</text><text x="131.075" y="800" class="m" font-size="14">Exact entry roots (draft</text><text x="131.075" y="819" class="m" font-size="14">PR #69) would refuse it.</text><text x="2" y="862" class="m" font-size="14">The auth payload names one installed rule</text><text x="2" y="881" class="m" font-size="14">per context (<tspan class="mono">context_rule_ids</tspan>). The fee</text><text x="2" y="900" class="m" font-size="14">payer may be another account.</text></svg>
