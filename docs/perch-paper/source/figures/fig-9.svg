<svg class="wide" viewBox="0 0 760 715" role="img" aria-labelledby="fig-9-title" aria-describedby="fig-9-text"><text x="2" y="18" class="t" font-size="16">(a) Conventional: Perch <tspan class="mono">c135aca</tspan></text><rect x="2" y="30" width="246.301" height="22" rx="11.0" class="pill pill-m"/><text x="125.15" y="45.68" class="m tag" font-size="13" text-anchor="middle">DEPLOYED · TESTNET · MAINNET</text><rect x="2" y="66" width="340" height="41" rx="6" class="bx bx-k"/><text x="14" y="91" class="x" font-size="15">Soroban host → <tspan class="mono">__check_auth</tspan></text><path d="M42 107V127" class="fl" marker-end="url(#perch-ah)"/><rect x="2" y="129" width="340" height="189" rx="6" class="bx"/><text x="14" y="154" class="t" font-size="15">Account</text><text x="14" y="174" class="x" font-size="15">OpenZeppelin library code resolves</text><text x="14" y="194" class="x" font-size="15">the rule ID and checks the rule, its</text><text x="14" y="214" class="x" font-size="15">expiry and its signers. Stores rules,</text><text x="14" y="234" class="x" font-size="15">signers and the document.</text><rect x="36" y="344" width="306" height="78" rx="6" class="bx bx-k"/><text x="48" y="368" class="t" font-size="14">Verifier</text><text x="48" y="387" class="x" font-size="14"><tspan class="mono">verify(digest)</tspan>: checks the</text><text x="48" y="406" class="x" font-size="14">signature.</text><path d="M16 318.0V364.0H34" class="fl-k" marker-end="url(#perch-ah-k)"/><text x="6" y="356" class="k" font-size="13">1</text><rect x="36" y="436" width="306" height="97" rx="6" class="bx bx-hi"/><text x="48" y="460" class="t" font-size="14">Interpreter</text><text x="48" y="479" class="x" font-size="14"><tspan class="mono">enforce</tspan>: functions, arguments and</text><text x="48" y="498" class="x" font-size="14">threshold. Keeps programs by</text><text x="48" y="517" class="x" font-size="14">(account, rule).</text><path d="M16 318.0V456.0H34" class="fl" marker-end="url(#perch-ah)"/><text x="6" y="448" class="a" font-size="13">2</text><rect x="36" y="547" width="306" height="78" rx="6" class="bx bx-hi"/><text x="48" y="571" class="t" font-size="14">Spending limit</text><text x="48" y="590" class="x" font-size="14"><tspan class="mono">enforce</tspan>: the cap. Keeps spending</text><text x="48" y="609" class="x" font-size="14">windows by (account, rule).</text><path d="M16 318.0V567.0H34" class="fl" marker-end="url(#perch-ah)"/><text x="6" y="559" class="a" font-size="13">3</text><text x="2" y="659" class="x" font-size="15">Order: authenticate, then policies</text><text x="2" y="683" class="t" font-size="15">Decision and state: 3 contracts, 3 calls</text><text x="2" y="705" class="m" font-size="14">(call counts read from source)</text><text x="418" y="18" class="t" font-size="16">(b) This paper: Perch <tspan class="mono">f0275f4</tspan></text><rect x="418" y="30" width="75.0752" height="22" rx="11.0" class="pill pill-m"/><text x="455.538" y="45.68" class="m tag" font-size="13" text-anchor="middle">OPEN PR</text><rect x="501.075" y="30" width="156.611" height="22" rx="11.0" class="pill pill-m"/><text x="579.381" y="45.68" class="m tag" font-size="13" text-anchor="middle">PREVIEW · TESTNET</text><rect x="418" y="66" width="340" height="41" rx="6" class="bx bx-k"/><text x="430" y="91" class="x" font-size="15">Soroban host → <tspan class="mono">__check_auth</tspan></text><path d="M458 107V127" class="fl" marker-end="url(#perch-ah)"/><rect x="418" y="129" width="340" height="189" rx="6" class="bx"/><text x="430" y="154" class="t" font-size="15">Account</text><rect x="430" y="165" width="316" height="97" rx="6" class="bx bx-pr"/><text x="442" y="189" class="x" font-size="14"><tspan class="mono">rule_eval::check_auth</tspan> (pinned</text><text x="442" y="208" class="x" font-size="14"><tspan class="mono">authorize</tspan>): functions, arguments,</text><text x="442" y="227" class="x" font-size="14">threshold and cap</text><text x="442" y="246" class="g tag" font-size="13">PROVED · MODEL + TRANSLATION</text><text x="430" y="292" class="x" font-size="14">Stores rules, grants, spending records</text><text x="430" y="311" class="x" font-size="14">and the generation.</text><rect x="452" y="344" width="306" height="78" rx="6" class="bx bx-k"/><text x="464" y="368" class="t" font-size="14">Verifier</text><text x="464" y="387" class="x" font-size="14"><tspan class="mono">verify(digest)</tspan>: checks the</text><text x="464" y="406" class="x" font-size="14">signature.</text><path d="M432 318V364H450" class="fl-k" marker-end="url(#perch-ah-k)"/><text x="422" y="356" class="k" font-size="13">1</text><g opacity=".6"><rect x="452" y="436" width="306" height="78" rx="6" class="bx dash"/><text x="464" y="460" class="t" font-size="14">Interpreter</text><text x="464" y="479" class="x" font-size="14">Address pinned and reported by</text><text x="464" y="498" class="x" font-size="14"><tspan class="mono">infra()</tspan>. Not called.</text></g><g opacity=".6"><rect x="452" y="528" width="306" height="78" rx="6" class="bx dash"/><text x="464" y="552" class="t" font-size="14">Spending limit</text><text x="464" y="571" class="x" font-size="14">Address pinned and reported by</text><text x="464" y="590" class="x" font-size="14"><tspan class="mono">infra()</tspan>. Not called.</text></g><text x="418" y="640" class="x" font-size="15">Order: decide, then authenticate</text><text x="418" y="664" class="t" font-size="15">Decision and state: 1 contract, 1 call</text><text x="418" y="686" class="m" font-size="14">(call counts read from source)</text></svg>
