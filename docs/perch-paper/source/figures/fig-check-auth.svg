<svg class="wide" viewBox="0 0 760 1178" role="img" aria-labelledby="fig-check-auth-title" aria-describedby="fig-check-auth-text"><rect x="2" y="2" width="756" height="64" rx="6" class="bx bx-k"/><text x="14" y="30" class="x" font-size="15">Soroban host → <tspan class="mono">__check_auth(signature_payload, auth payload, contexts)</tspan>. The auth</text><text x="14" y="50" class="x" font-size="15">payload carries <tspan class="mono">context_rule_ids</tspan> and the claimed signers.</text><text x="2" y="96" class="m tag" font-size="14">ACCOUNT SHELL · TESTED</text><g><rect x="50" y="114" width="450" height="64" rx="6" class="bx"/><text x="62" y="142" class="x" font-size="15">A context calls a reserved hook on any contract: <tspan class="mono">install</tspan>,</text><text x="62" y="162" class="x" font-size="15"><tspan class="mono">uninstall</tspan>, <tspan class="mono">enforce</tspan> or an <tspan class="mono">rcv_*</tspan> name?</text><circle cx="26" cy="136" r="11" class="bx"/><text x="26" y="140.9" class="t" font-size="14" text-anchor="middle">1</text><path d="M500 133H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="120" width="161.71" height="26" rx="13" class="pill pill-d"/><text x="531" y="138.04" class="d" font-size="14">ReservedFunction · 1</text></g><g><rect x="50" y="190" width="450" height="84" rx="6" class="bx"/><text x="62" y="218" class="x" font-size="15">Recovery completion? Exactly one <tspan class="mono">apply_account_doc</tspan></text><text x="62" y="238" class="x" font-size="15">(exported <tspan class="mono">apply_doc</tspan>) context on this account, selecting the</text><text x="62" y="258" class="x" font-size="15">recovery rule. Classification only.</text><circle cx="26" cy="212" r="11" class="bx"/><text x="26" y="216.9" class="t" font-size="14" text-anchor="middle">2</text><path d="M26 147V199" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="50" y="286" width="450" height="64" rx="6" class="bx"/><text x="62" y="314" class="x" font-size="15">Frozen by an authorized <tspan class="mono">Protected</tspan> attempt, and this is not</text><text x="62" y="334" class="x" font-size="15">its completion?</text><circle cx="26" cy="308" r="11" class="bx"/><text x="26" y="312.9" class="t" font-size="14" text-anchor="middle">3</text><path d="M26 223V295" class="fl" marker-end="url(#perch-ah)"/><path d="M500 305H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="292" width="141.29" height="26" rx="13" class="pill pill-d"/><text x="531" y="310.04" class="d" font-size="14">AccountFrozen · 2</text></g><g><rect x="50" y="362" width="450" height="64" rx="6" class="bx"/><text x="62" y="390" class="x" font-size="15">A selected grant rule calls the recovery controller, its ZK</text><text x="62" y="410" class="x" font-size="15">adapter or its ZK pool?</text><circle cx="26" cy="384" r="11" class="bx"/><text x="26" y="388.9" class="t" font-size="14" text-anchor="middle">4</text><path d="M26 319V371" class="fl" marker-end="url(#perch-ah)"/><path d="M500 381H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="368" width="151.92" height="26" rx="13" class="pill pill-d"/><text x="531" y="386.04" class="d" font-size="14">ScopeEscalation · 4</text></g><g><rect x="90" y="434" width="666" height="104" rx="6" class="bx bx-hi"/><text x="102" y="462" class="x" font-size="15">A completion leaves here. The recovery controller's <tspan class="mono">rcv_complete</tspan> checks the exact</text><text x="102" y="482" class="x" font-size="15">approved document bytes and the completion window: authorized with no signatures, or</text><text x="102" y="502" class="x" font-size="15">refused.</text><text x="102" y="522" class="m tag" font-size="14">TESTED · RECOVERY CONTROLLER</text><path d="M70 422V458H88" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="50" y="556" width="450" height="64" rx="6" class="bx"/><text x="62" y="584" class="x" font-size="15">bound = SHA-256(domain ‖ account ‖ signature payload),</text><text x="62" y="604" class="x" font-size="15">with domain <tspan class="mono">"perch/account/auth-addr-v1"</tspan></text><circle cx="26" cy="578" r="11" class="bx"/><text x="26" y="582.9" class="t" font-size="14" text-anchor="middle">5</text><path d="M26 395V565" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="50" y="632" width="450" height="64" rx="6" class="bx"/><text x="62" y="660" class="x" font-size="15">Resolve the selected rule IDs to stored rules and spending</text><text x="62" y="680" class="x" font-size="15">records; convert the contexts.</text><circle cx="26" cy="654" r="11" class="bx"/><text x="26" y="658.9" class="t" font-size="14" text-anchor="middle">6</text><path d="M26 589V641" class="fl" marker-end="url(#perch-ah)"/><path d="M500 651H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="638" width="212.38" height="26" rx="13" class="pill pill-d"/><text x="531" y="656.04" class="d" font-size="14">ContextRuleNotFound · 3000</text><path d="M500 685H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="672" width="155.99" height="26" rx="13" class="pill pill-d"/><text x="531" y="690.04" class="d" font-size="14">RuleEvalRefused · 5</text></g><g><rect x="50" y="710" width="450" height="104" rx="6" class="bx bx-pr"/><rect x="54" y="714" width="442" height="96" rx="2" class="fl-g"/><text x="62" y="738" class="x" font-size="15"><tspan class="mono">rule_eval::authorize</tspan>: rules, records, contexts, choices,</text><text x="62" y="758" class="x" font-size="15">signers, ledger, generation → next records. No storage, no</text><text x="62" y="778" class="x" font-size="15">signatures.</text><text x="62" y="798" class="g tag" font-size="14">PROVED · MODEL + TRANSLATION</text><circle cx="26" cy="732" r="11" class="bx"/><text x="26" y="736.9" class="t" font-size="14" text-anchor="middle">7</text><path d="M26 665V719" class="fl" marker-end="url(#perch-ah)"/><path d="M500 729H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="716" width="117.61" height="26" rx="13" class="pill pill-d"/><text x="531" y="734.04" class="d" font-size="14">StaleScope · 3</text><path d="M500 763H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="750" width="155.99" height="26" rx="13" class="pill pill-d"/><text x="531" y="768.04" class="d" font-size="14">RuleEvalRefused · 5</text></g><g><rect x="50" y="826" width="450" height="64" rx="6" class="bx"/><text x="62" y="854" class="x" font-size="15">digest = SHA-256(bound ‖ XDR(selected rule IDs)). For each</text><text x="62" y="874" class="x" font-size="15">claimed signer:</text><circle cx="26" cy="848" r="11" class="bx"/><text x="26" y="852.9" class="t" font-size="14" text-anchor="middle">8</text><path d="M26 743V835" class="fl" marker-end="url(#perch-ah)"/></g><g><rect x="90" y="898" width="410" height="124" rx="6" class="bx"/><rect x="93" y="901" width="11" height="118" rx="0" class="tr"/><text x="116" y="926" class="x" font-size="15">External: <tspan class="mono">verifier.verify(digest)</tspan>. A bad</text><text x="116" y="946" class="x" font-size="15">signature traps in the verifier;</text><text x="116" y="966" class="x" font-size="15"><tspan class="mono">ExternalVerificationFailed</tspan> (3003) only if a</text><text x="116" y="986" class="x" font-size="15">verifier returns false.</text><text x="116" y="1006" class="m tag" font-size="14">TRUSTED · VERIFIER</text><path d="M70 886V922H88" class="fl-m" marker-end="url(#perch-ah-m)"/><path d="M500 917H518" class="fl-d" marker-end="url(#perch-bar)"/><rect x="520" y="904" width="205.81" height="26" rx="13" class="pill pill-d"/><text x="531" y="922.04" class="d" font-size="14">verifier traps (bad signature)</text><rect x="90" y="1030" width="410" height="64" rx="6" class="bx bx-k"/><text x="102" y="1058" class="x" font-size="15">Delegated (CAP-0071): the host's <tspan class="mono">delegate_auth</tspan>.</text><text x="102" y="1078" class="x" font-size="15">Rule IDs are not bound.</text><path d="M70 922V1050H88" class="fl-k" marker-end="url(#perch-ah-k)"/></g><g><rect x="50" y="1112" width="450" height="64" rx="6" class="bx"/><text x="62" y="1140" class="x" font-size="15">Store each capped spending record that changed.</text><text x="62" y="1160" class="x" font-size="15">Authorized.</text><circle cx="26" cy="1134" r="11" class="bx"/><text x="26" y="1138.9" class="t" font-size="14" text-anchor="middle">9</text><path d="M26 859V1121" class="fl" marker-end="url(#perch-ah)"/></g></svg>
