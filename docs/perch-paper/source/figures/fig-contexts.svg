<svg class="wide" viewBox="0 0 760 496" role="img" aria-labelledby="fig-contexts-title" aria-describedby="fig-contexts-text"><text x="2" y="17" class="t" font-size="16">(a) A lost guess</text><rect x="2" y="28" width="310" height="120" rx="6" class="bx bx-k"/><text x="14" y="56" class="t" font-size="15">Signed tree</text><text x="14" y="76" class="x" font-size="15"><tspan class="mono">game.guess(0, guesser)</tspan></text><path d="M18 80V91H28" class="fl-m"/><text x="32" y="96" class="x" font-size="15"><tspan class="mono">xlm.transfer(account →</tspan></text><text x="40" y="116" class="x" font-size="15"><tspan class="mono">game,</tspan></text><text x="40" y="136" class="x" font-size="15"><tspan class="mono">1 XLM)</tspan></text><rect x="356" y="28" width="402" height="44" rx="6" class="bx"/><text x="368" y="56" class="x" font-size="15">[0] <tspan class="mono">game.guess</tspan> → grant 3, rule <tspan class="mono">guess</tspan>: allowed</text><path d="M334 48l4 5l8-10" class="gl"/><path d="M312 50H322V48H328" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="356" y="80" width="402" height="64" rx="6" class="bx bx-hi"/><text x="368" y="108" class="x" font-size="15">[1] <tspan class="mono">xlm.transfer</tspan> → grant 3, rule <tspan class="mono">spend</tspan> (2 XLM per</text><text x="368" y="128" class="x" font-size="15">100 ledgers): allowed, charges 1 XLM</text><path d="M334 100l4 5l8-10" class="gl-a"/><path d="M312 50H322V100H328" class="fl-m" marker-end="url(#perch-ah-m)"/><text x="2" y="191" class="t" font-size="16">(b) A winning guess</text><rect x="2" y="202" width="310" height="60" rx="6" class="bx bx-k"/><text x="14" y="230" class="t" font-size="15">Signed tree</text><text x="14" y="250" class="x" font-size="15"><tspan class="mono">game.guess(n, guesser)</tspan></text><rect x="356" y="202" width="402" height="44" rx="6" class="bx"/><text x="368" y="230" class="x" font-size="15">[0] <tspan class="mono">game.guess</tspan> → grant 3, rule <tspan class="mono">guess</tspan>: allowed</text><path d="M334 222l4 5l8-10" class="gl"/><path d="M312 224H322V222H328" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="356" y="254" width="402" height="64" rx="6" class="bx dash"/><text x="368" y="282" class="m" font-size="15">The game then pays out its balance (3 XLM) under its</text><text x="368" y="302" class="m" font-size="15">own authority. Nothing is charged to grant 3.</text><text x="2" y="361" class="t" font-size="16">(c) A direct transfer</text><rect x="2" y="372" width="310" height="100" rx="6" class="bx bx-k"/><text x="14" y="400" class="t" font-size="15">Signed tree</text><text x="14" y="420" class="x" font-size="15"><tspan class="mono">xlm.transfer(account →</tspan></text><text x="22" y="440" class="x" font-size="15"><tspan class="mono">anyone,</tspan></text><text x="22" y="460" class="x" font-size="15"><tspan class="mono">≤ 2 XLM)</tspan></text><rect x="356" y="372" width="402" height="64" rx="6" class="bx"/><text x="368" y="400" class="x" font-size="15">[0] <tspan class="mono">xlm.transfer</tspan> → grant 3, rule <tspan class="mono">spend</tspan>: allowed at</text><text x="368" y="420" class="x" font-size="15">the pinned build</text><path d="M334 392l4 5l8-10" class="gl"/><path d="M312 394H322V392H328" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="356" y="448" width="71" height="26" rx="13" class="pill pill-m"/><text x="367" y="466.04" class="m" font-size="14">DRAFT</text><text x="437" y="466" class="m" font-size="15">A draft that checks exact entry roots would</text><text x="437" y="486" class="m" font-size="15">refuse it.</text></svg>
