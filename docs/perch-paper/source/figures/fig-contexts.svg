<svg class="wide" viewBox="0 0 760 492" role="img" aria-labelledby="fig-contexts-title" aria-describedby="fig-contexts-text"><text x="2" y="17" class="t" font-size="16">(a) A lost guess</text><rect x="2" y="28" width="318" height="100" rx="6" class="bx bx-k"/><text x="14" y="56" class="t" font-size="15">Signed tree</text><text x="14" y="76" class="x" font-size="15"><tspan class="mono">game.guess(0, guesser)</tspan></text><path d="M18 80V91H28" class="fl-m"/><text x="32" y="96" class="x" font-size="15"><tspan class="mono">xlm.transfer(account → game,</tspan></text><text x="40" y="116" class="x" font-size="15"><tspan class="mono">1 XLM)</tspan></text><rect x="356" y="28" width="402" height="44" rx="6" class="bx"/><text x="368" y="56" class="x" font-size="15">[0] <tspan class="mono">game.guess</tspan> → grant 3, rule <tspan class="mono">guess</tspan>: allowed</text><path d="M334 48l4 5l8-10" class="gl"/><path d="M320 50H326V48H330" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="356" y="80" width="402" height="64" rx="6" class="bx bx-hi"/><text x="368" y="108" class="x" font-size="15">[1] <tspan class="mono">xlm.transfer</tspan> → grant 3, rule <tspan class="mono">spend</tspan> (2 XLM per</text><text x="368" y="128" class="x" font-size="15">100 ledgers): allowed, charges 1 XLM</text><path d="M334 100l4 5l8-10" class="gl-a"/><path d="M320 50H326V100H330" class="fl-m" marker-end="url(#perch-ah-m)"/><text x="2" y="187" class="t" font-size="16">(b) A winning guess</text><rect x="2" y="198" width="318" height="60" rx="6" class="bx bx-k"/><text x="14" y="226" class="t" font-size="15">Signed tree</text><text x="14" y="246" class="x" font-size="15"><tspan class="mono">game.guess(n, guesser)</tspan></text><rect x="356" y="198" width="402" height="44" rx="6" class="bx"/><text x="368" y="226" class="x" font-size="15">[0] <tspan class="mono">game.guess</tspan> → grant 3, rule <tspan class="mono">guess</tspan>: allowed</text><path d="M334 218l4 5l8-10" class="gl"/><path d="M320 220H326V218H330" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="356" y="250" width="402" height="64" rx="6" class="bx dash"/><text x="368" y="278" class="m" font-size="15">The game then pays out its balance (3 XLM) under its</text><text x="368" y="298" class="m" font-size="15">own authority. Nothing is charged to grant 3.</text><text x="2" y="357" class="t" font-size="16">(c) A direct transfer</text><rect x="2" y="368" width="318" height="80" rx="6" class="bx bx-k"/><text x="14" y="396" class="t" font-size="15">Signed tree</text><text x="14" y="416" class="x" font-size="15"><tspan class="mono">xlm.transfer(account → anyone,</tspan></text><text x="22" y="436" class="x" font-size="15"><tspan class="mono">≤ 2 XLM)</tspan></text><rect x="356" y="368" width="402" height="64" rx="6" class="bx"/><text x="368" y="396" class="x" font-size="15">[0] <tspan class="mono">xlm.transfer</tspan> → grant 3, rule <tspan class="mono">spend</tspan>: allowed at</text><text x="368" y="416" class="x" font-size="15">the pinned build</text><path d="M334 388l4 5l8-10" class="gl"/><path d="M320 390H326V388H330" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="356" y="444" width="71" height="26" rx="13" class="pill pill-m"/><text x="367" y="462.04" class="m" font-size="14">DRAFT</text><text x="437" y="462" class="m" font-size="15">A draft that checks exact entry roots would</text><text x="437" y="482" class="m" font-size="15">refuse it.</text></svg>
