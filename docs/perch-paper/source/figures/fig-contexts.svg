<svg class="wide" viewBox="0 0 760 532" role="img" aria-labelledby="fig-contexts-title" aria-describedby="fig-contexts-text"><text x="2" y="17" class="t" font-size="16">(a) A lost guess</text><rect x="2" y="28" width="318" height="100" rx="6" class="bx bx-k"/><text x="14" y="56" class="t" font-size="15">Signed tree</text><text x="14" y="76" class="x" font-size="15"><tspan class="mono">game.guess(0, guesser)</tspan></text><path d="M18 80V91H28" class="fl-m"/><text x="32" y="96" class="x" font-size="15"><tspan class="mono">xlm.transfer(account → game,</tspan></text><text x="40" y="116" class="x" font-size="15"><tspan class="mono">1 XLM)</tspan></text><rect x="356" y="28" width="402" height="64" rx="6" class="bx"/><text x="368" y="56" class="x" font-size="15">[0] <tspan class="mono">game.guess</tspan> → the game grant, rule <tspan class="mono">guess</tspan>:</text><text x="368" y="76" class="x" font-size="15">allowed</text><path d="M334 48l4 5l8-10" class="gl"/><path d="M320 50H326V48H330" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="356" y="100" width="402" height="64" rx="6" class="bx bx-hi"/><text x="368" y="128" class="x" font-size="15">[1] <tspan class="mono">xlm.transfer</tspan> → the game grant, rule <tspan class="mono">spend</tspan> (2</text><text x="368" y="148" class="x" font-size="15">XLM per 100 ledgers): allowed, charges 1 XLM</text><path d="M334 120l4 5l8-10" class="gl-a"/><path d="M320 50H326V120H330" class="fl-m" marker-end="url(#perch-ah-m)"/><text x="2" y="207" class="t" font-size="16">(b) A winning guess</text><rect x="2" y="218" width="318" height="60" rx="6" class="bx bx-k"/><text x="14" y="246" class="t" font-size="15">Signed tree</text><text x="14" y="266" class="x" font-size="15"><tspan class="mono">game.guess(n, guesser)</tspan></text><rect x="356" y="218" width="402" height="64" rx="6" class="bx"/><text x="368" y="246" class="x" font-size="15">[0] <tspan class="mono">game.guess</tspan> → the game grant, rule <tspan class="mono">guess</tspan>:</text><text x="368" y="266" class="x" font-size="15">allowed</text><path d="M334 238l4 5l8-10" class="gl"/><path d="M320 240H326V238H330" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="356" y="290" width="402" height="64" rx="6" class="bx dash"/><text x="368" y="318" class="m" font-size="15">The game then pays out its balance (3 XLM) under its</text><text x="368" y="338" class="m" font-size="15">own authority. Nothing is charged to the game grant.</text><text x="2" y="397" class="t" font-size="16">(c) A direct transfer</text><rect x="2" y="408" width="318" height="80" rx="6" class="bx bx-k"/><text x="14" y="436" class="t" font-size="15">Signed tree</text><text x="14" y="456" class="x" font-size="15"><tspan class="mono">xlm.transfer(account → anyone,</tspan></text><text x="22" y="476" class="x" font-size="15"><tspan class="mono">≤ 2 XLM)</tspan></text><rect x="356" y="408" width="402" height="64" rx="6" class="bx"/><text x="368" y="436" class="x" font-size="15">[0] <tspan class="mono">xlm.transfer</tspan> → the game grant, rule <tspan class="mono">spend</tspan>:</text><text x="368" y="456" class="x" font-size="15">allowed at the pinned build</text><path d="M334 428l4 5l8-10" class="gl"/><path d="M320 430H326V428H330" class="fl-m" marker-end="url(#perch-ah-m)"/><rect x="356" y="484" width="71" height="26" rx="13" class="pill pill-m"/><text x="367" y="502.04" class="m" font-size="14">DRAFT</text><text x="437" y="502" class="m" font-size="15">A draft that checks exact entry roots would</text><text x="437" y="522" class="m" font-size="15">refuse it.</text></svg>
