<svg class="wide" viewBox="0 0 760 597" role="img" aria-labelledby="fig-2-title" aria-describedby="fig-2-text"><text x="2" y="18" class="t" font-size="16">(a) A lost guess</text><rect x="2" y="30" width="300" height="101" rx="6" class="bx bx-k"/><text x="14" y="55" class="t" font-size="15">Signed tree</text><text x="14" y="75" class="x" font-size="15"><tspan class="mono">game.guess(0, guesser)</tspan></text><text x="14" y="95" class="x" font-size="15">└ <tspan class="mono">xlm.transfer(account → game,</tspan></text><text x="14" y="115" class="x" font-size="15"><tspan class="mono">1 XLM)</tspan></text><rect x="356" y="30" width="402" height="61" rx="6" class="bx"/><text x="368" y="55" class="x" font-size="15">[0] <tspan class="mono">game.guess</tspan> → grant 3, rule <tspan class="mono">guess</tspan>:</text><text x="368" y="75" class="x" font-size="15">allowed</text><path d="M334 51l4 5l8-10" class="gl"/><rect x="356" y="99" width="402" height="61" rx="6" class="bx bx-hi"/><text x="368" y="124" class="x" font-size="15">[1] <tspan class="mono">xlm.transfer</tspan> → grant 3, rule <tspan class="mono">spend</tspan> (2</text><text x="368" y="144" class="x" font-size="15">XLM per 100 ledgers): allowed, charges 1 XLM</text><path d="M334 120l4 5l8-10" class="gl-a"/><path d="M302 50H316V50H328" class="fl-m" marker-end="url(#perch-ah-m)"/><path d="M302 50H316V119H328" class="fl-m" marker-end="url(#perch-ah-m)"/><text x="2" y="202" class="t" font-size="16">(b) A winning guess</text><rect x="2" y="214" width="300" height="61" rx="6" class="bx bx-k"/><text x="14" y="239" class="t" font-size="15">Signed tree</text><text x="14" y="259" class="x" font-size="15"><tspan class="mono">game.guess(n, guesser)</tspan></text><rect x="356" y="214" width="402" height="61" rx="6" class="bx"/><text x="368" y="239" class="x" font-size="15">[0] <tspan class="mono">game.guess</tspan> → grant 3, rule <tspan class="mono">guess</tspan>:</text><text x="368" y="259" class="x" font-size="15">allowed</text><path d="M334 235l4 5l8-10" class="gl"/><g opacity=".8"><rect x="356" y="283" width="402" height="81" rx="6" class="bx dash"/><text x="368" y="308" class="x" font-size="15">The game then pays out its balance (3 XLM)</text><text x="368" y="328" class="x" font-size="15">under its own authority. Nothing is charged</text><text x="368" y="348" class="x" font-size="15">to grant 3.</text></g><path d="M302 234H316V234H328" class="fl-m" marker-end="url(#perch-ah-m)"/><text x="2" y="406" class="t" font-size="16">(c) A direct transfer</text><rect x="2" y="418" width="300" height="81" rx="6" class="bx bx-k"/><text x="14" y="443" class="t" font-size="15">Signed tree</text><text x="14" y="463" class="x" font-size="15"><tspan class="mono">xlm.transfer(account → anyone,</tspan></text><text x="14" y="483" class="x" font-size="15"><tspan class="mono">≤ 2 XLM)</tspan></text><rect x="356" y="418" width="402" height="61" rx="6" class="bx"/><text x="368" y="443" class="x" font-size="15">[0] <tspan class="mono">xlm.transfer</tspan> → grant 3, rule <tspan class="mono">spend</tspan>:</text><text x="368" y="463" class="x" font-size="15">allowed at the pinned build</text><path d="M334 439l4 5l8-10" class="gl"/><rect x="356" y="487" width="75.0752" height="22" rx="11.0" class="pill pill-m"/><text x="393.538" y="502.68" class="m tag" font-size="13" text-anchor="middle">OPEN PR</text><text x="441.075" y="503" class="m" font-size="15">Exact entry roots (draft PR #69)</text><text x="441.075" y="523" class="m" font-size="15">would refuse it.</text><path d="M302 438H316V438H328" class="fl-m" marker-end="url(#perch-ah-m)"/><text x="2" y="568" class="m" font-size="15">The auth payload names one installed rule per context (<tspan class="mono">context_rule_ids</tspan>). The fee payer</text><text x="2" y="588" class="m" font-size="15">may be another account.</text></svg>
