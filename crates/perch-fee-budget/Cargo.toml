[package]
name = "perch-fee-budget"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable Perch policy with immutable recipient and lifetime fee-refill budget"
[package.metadata.stellar]
cargo_inherit = true
[lib]
crate-type = ["lib", "cdylib"]
doctest = false
[features]
default = ["contract"]
contract = ["dep:perch-fee-budget-core"]
[dependencies]
soroban-sdk.workspace = true
perch-fee-budget-core = { version = "0.1.0", path = "../perch-fee-budget-core", optional = true }
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
